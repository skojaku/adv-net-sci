# =============================================================================
# SSIE 641 Advanced Topics in Network Science
# Concept inventory / curriculum map
# =============================================================================
# Purpose:
#   A single source of truth listing every concept students are expected to
#   learn, module by module. Slides, pen-and-paper exercises, in-class
#   activities, out-of-class assignments, quizzes and exams are designed
#   against this list so that coverage can be checked mechanically.
#
# How to use:
#   1. Design an activity (slide deck, exercise, notebook, quiz item).
#   2. Register its identifier in the `coverage` block of every concept it
#      touches.
#   3. Any concept whose `coverage` is still empty is not yet taught/assessed.
#
# Scope note:
#   Theory/concepts only. Library usage (igraph API calls, PyTorch Geometric,
#   plotting recipes) is tracked separately, not here. The one exception is the
#   CSR format (m01.c27-c29): the lecture note teaches it as a representation
#   and a memory-scaling argument, not as an API, so it is included.
# =============================================================================

meta:
  version: "2.0"
  updated: "2026-08-04"
  source_of_truth:
    # Primary: the lecture note. Every concept below was checked against these.
    - docs/lecture-note/intro/why-networks.qmd
    - docs/lecture-note/m01-euler_tour/{01-concepts,04-advanced}.qmd
    - docs/lecture-note/m02-small-world/{01-concepts,appendix,04-appendix}.qmd
    - docs/lecture-note/m03-robustness/01-concepts.qmd
    - docs/lecture-note/m04-node-degree/{01-concepts,03-exercises}
    - docs/lecture-note/m05-clustering/{01-concepts.qmd,04-appendix.md}
    - docs/lecture-note/m06-centrality/{01-concepts,eigencentrality,degree-distance-based-centrality}.qmd
    - docs/lecture-note/m07-random-walks/{01-concepts,random-walks-math,appendix-unifying-centrality-and-communities,amida-kuji}.qmd
    - docs/lecture-note/m08-embedding/{01-concepts.qmd,04-appendix.md}
    - docs/lecture-note/m09-graph-neural-networks/{00-preparation,01-concepts}.qmd
    # Secondary: condensed references used by the AI tutor.
    - docs/tutor-references/m0*-concept.md
  not_covered_here:
    - "docs/lecture-note/m0*/02-coding.qmd (library usage)"
    - "docs/lecture-note/m09-graph-neural-networks/04-appendix.qmd (PyTorch implementations)"
  schema:
    module:
      id: "m00-m09"
      title: "human-readable module name"
      slug: "directory name under docs/lecture-note/"
      sessions: "class dates from the syllabus (Fall 2025)"
      big_question: "the one question the module answers"
      hook: "the concrete story/experience the module opens with"
      objectives: "module-level learning outcomes"
      keywords: "terms as listed in the lecture note"
      concepts: "the atomic teachable ideas"
    concept:
      id: "<module>.c<NN>, stable; never renumber, only append"
      name: "short label"
      type: >-
        context | definition | representation | metric | theorem | model |
        algorithm | method | phenomenon | principle | limitation | application
      level: >-
        core = every student must master it (fair game on exam);
        extension = enrichment, assessed only as bonus
      statement: "the thing to be learned, in one sentence"
      note: "optional; used to record where this entry departs from an earlier version of the lecture note, and why"
      prereq: "list of concept ids that must come first"
      coverage:
        slide: "slide file / section that teaches it"
        in_class: "in-class activity id (pen-and-paper, discussion, live demo)"
        out_class: "assignment / notebook / reading id"
        assessment: "quiz item / exam item / project rubric row"

# =============================================================================
# LECTURE-NOTE COVERAGE
# =============================================================================
# An audit on 2026-08-04 found 69 concepts that this inventory assessed but the
# lecture note never taught. All of them have since been written into the
# lecture note, so the note is now the union of itself and this inventory.
# Sections added, by module:
#   m01  G = (V,E); multigraph and parallel edges; self-loops and the +2 rule;
#        the giant component; finding components by DFS/BFS; (A^k)_ij counts
#        walks of length k
#   m03  fixed vs adaptive attack ordering; and the Molloy-Reed proof, which
#        01-concepts.qmd had always promised but 04-appendix.md never held
#   m04  degree sum formula; handshaking lemma; the exact friendship paradox
#        <k>_friend = <k> + Var(k)/<k>; Barabasi-Albert preferential attachment;
#        degree correlations and assortativity
#   m05  reading a modularity score and NP-hardness; the algorithms themselves
#        (greedy, Louvain, Leiden, label propagation, Girvan-Newman); evaluation
#        (conductance, NMI, ARI, why metadata is not ground truth); applications
#   m06  power iteration; Katz as discounted walk counting and its convergence
#        condition; bridges and brokers; centrality selection table; complexity;
#        star vs path correlation; applications
#   m07  ergodicity (irreducibility, aperiodicity); reversibility and detailed
#        balance; return, hitting, commute and cover times; resistance distance;
#        walk variants (biased, restart, second-order, self-avoiding, directed);
#        walk-based centralities; Walktrap; how structure shapes mixing
#   m08  normalized Laplacian; Fiedler vector and algebraic connectivity;
#        spectral clustering as the relaxation of normalized cut; neural
#        embedding as implicit PMI factorization; spectral vs neural comparison;
#        the entire evaluation section; dimension choice, instability under
#        rotation, preservation trade-offs
#   m09  permutation invariance and equivariance; the MESSAGE/AGGREGATE/UPDATE
#        framework with all four architectures tabulated; node/edge/graph task
#        levels; readout and hierarchical pooling; mini-batching and the
#        neighborhood explosion; Graph Transformers and positional encodings;
#        open challenges; and a closing synthesis tying the module to M4-M8
lecture_note_coverage:
  status: complete
  verified: "2026-08-04"
  note: >-
    Re-run the audit after any substantial lecture-note edit. The check that
    matters is not whether a term appears, but whether the note actually
    explains it - several gaps found in the first audit were terms that appeared
    only in a keyword list, a code comment, or an exercise prompt.

# Places where the lecture note disagrees with itself. Each was confirmed by
# reading the surrounding text; none is a curriculum.yml error. Marked FIXED
# where the note has already been corrected.
lecture_note_defects:
  - where: "m03-robustness/01-concepts.qmd (homogeneous network)"
    problem: "Justified f_c = 1 - 1/<k> with '<k^2> = <k>^2 and thus kappa = <k>', the zero-variance regular-graph case, contradicting the f_c formula printed above it."
    status: FIXED
  - where: "m05-clustering/01-concepts.qmd (end of Modularity section)"
    problem: "'There is \"free lunch\" in community detection [@peel2017ground]' - a missing 'no' inverted the meaning of the cited paper and of the next sentence."
    status: FIXED
  - where: "m08-embedding/01-concepts.qmd (Two Exploration Strategies)"
    problem: "BFS/DFS bullets contradicted the q-direction lines three lines above and swapped homophily with structural equivalence."
    status: FIXED
  - where: "m06-centrality/01-concepts.qmd and eigencentrality.qmd (HITS)"
    problem: "Hub and authority formulas are swapped relative to the note's own prose and to the edge direction its PageRank formula establishes (A_ji with d_j^out implies A_ab = 1 is a -> b). It also assigns A^T A to hubs; the standard result is A A^T. See the note on m06.c20."
    status: FIXED
  - where: "m09-graph-neural-networks/01-concepts.qmd (First-order Approximation)"
    problem: "L means the unnormalized D - A earlier on the page but must mean the normalized Laplacian here for the equality to hold; the switch is never flagged. See the note on m09.c10."
    status: FIXED
  - where: "m09-graph-neural-networks/01-concepts.qmd (GAT attention)"
    problem: "Prose says both node features are transformed by the shared W, but the equation transforms only h_j, and the aggregation step then introduces a third matrix W_feature. See the note on m09.c51."
    status: FIXED
  - where: "m09-graph-neural-networks/01-concepts.qmd (Deep GCNs section)"
    problem: "Heading promises over-smoothing; the body explains gradient vanishing/exploding. Over-smoothing is never defined anywhere in the module."
    status: FIXED
  - where: "m05-clustering/01-concepts.qmd (Cut into more than two communities)"
    problem: "Lowercase k is introduced as the total number of communities, then reused as the summation index with an unintroduced K as the upper bound."
    status: FIXED
  - where: "m03-robustness/04-appendix.md"
    problem: "01-concepts.qmd says 'See the Appendix for the proof of the Molloy-Reed criterion', but this file contains the M02 small-world assignment instead. The proof exists nowhere."
    status: FIXED

