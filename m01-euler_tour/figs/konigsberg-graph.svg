<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 430" width="620" height="430" role="img" aria-labelledby="kgraph-title">
  <title id="kgraph-title">The Königsberg multigraph: four nodes A, B, C, D and seven edges a to g, with node degrees 5, 3, 3, 3.</title>
  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">

    <!-- edges -->
    <g fill="none" stroke="#1a1a1a" stroke-width="3">
      <path d="M230,70 Q150,142 230,215"/>
      <path d="M230,70 Q310,142 230,215"/>
      <path d="M230,215 Q150,287 230,360"/>
      <path d="M230,215 Q310,287 230,360"/>
      <path d="M230,215 H500"/>
      <path d="M230,70 C380,70 490,120 500,215"/>
      <path d="M230,360 C380,360 490,310 500,215"/>
    </g>

    <!-- edge names -->
    <g fill="#593196" font-size="18" font-style="italic" font-weight="600">
      <text x="176" y="148" text-anchor="end">c</text>
      <text x="284" y="148" text-anchor="start">d</text>
      <text x="176" y="293" text-anchor="end">a</text>
      <text x="284" y="293" text-anchor="start">b</text>
      <text x="365" y="202" text-anchor="middle">e</text>
      <text x="400" y="78" text-anchor="middle">g</text>
      <text x="400" y="358" text-anchor="middle">f</text>
    </g>

    <!-- nodes -->
    <g fill="#ffffff" stroke="#1a1a1a" stroke-width="3">
      <circle cx="230" cy="70"  r="26"/>
      <circle cx="230" cy="215" r="26"/>
      <circle cx="230" cy="360" r="26"/>
      <circle cx="500" cy="215" r="26"/>
    </g>
    <g fill="#1a1a1a" font-size="21" font-weight="700" text-anchor="middle">
      <text x="230" y="78">C</text>
      <text x="230" y="223">A</text>
      <text x="230" y="368">B</text>
      <text x="500" y="223">D</text>
    </g>

    <!-- degrees -->
    <g fill="#1a1a1a" fill-opacity="0.65" font-size="15">
      <text x="230" y="30"  text-anchor="middle">degree 3</text>
      <text x="120" y="220" text-anchor="end">degree 5</text>
      <text x="230" y="408" text-anchor="middle">degree 3</text>
      <text x="540" y="220" text-anchor="start">degree 3</text>
    </g>

  </g>
</svg>
