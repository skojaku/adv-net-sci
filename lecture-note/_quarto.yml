project:
  type: website
  output-dir: _site
  # `*.qmd` / `*.md` match at every depth, so anything not excluded here becomes
  # a live page. The exclusions are load-bearing, not tidiness.
  render:
    - "*.qmd"
    - "*.md"
    - "!figs/src/"            # figure generators, not pages
    - "!assets/**"            # a legacy revealjs deck lives under assets/slides
    - "!**/pen-and-paper/**"  # LaTeX worksheet sources; the PDFs ship as resources
    - "!_*.qmd"               # include partials, e.g. _pair-notebook-walkthrough
    - "!_*.md"
    - "!**/_*.qmd"
    - "!**/_*.md"

title: "Advanced Topics in Network Science"
author: Sadamori Kojaku
date: last-modified
date-format: long

website:
  title: "Advanced Topics in Network Science"
  repo-url: https://github.com/skojaku/adv-net-sci
  repo-actions: [edit, issue]
  page-navigation: true
  reader-mode: true
  search:
    keyboard-shortcut: ["|"]
    type: overlay
  page-footer:
