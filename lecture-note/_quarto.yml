  navbar:
    # logo.jpg is a 4.6 MB 10156x4449 original; this is the same mark resampled
    # to 200px for the 34px slot it actually occupies.
    logo: assets/logo.png
    # No `background:` — a solid #593196 bar puts white-at-70% labels at ~2.6:1,
    # below WCAG AA. The navbar is white with a hairline (see scss/minimal.scss).
    search: true
    # Three entries only. The sidebar is the map of the course; the navbar is
    # the way back to the top of it. Menu items carry no `text:` override, so
    # every label comes from the target page's own title.
    left:
      - text: "Home"
        file: index.qmd
      - text: "Course"
        menu:
