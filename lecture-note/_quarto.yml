# The lecture note is prose, mathematics and static figures only. Nothing here
# executes, so a render is fast and needs no Python environment.
#
#   - Runnable code lives in marimo notebooks under notebooks/, linked from each
#     module's "Hands-on" page. Link ids are kept in _variables.yml.
#   - The figures that used to be generated inline are now committed SVGs under
#     figs/. Regenerate them with:  bash tools/build_figures.sh
#   - Graphviz (```{dot}```) blocks are rendered by Quarto itself, not by a
#     Jupyter kernel, so they are unaffected by `enabled: false` and stay inline.
execute:
  enabled: false
  freeze: true

# Code folding.
#
# `code-fold: true` alone does nothing on this site. Quarto's own filter
# (share/filters/main.lua, render_folded_block) opens with
#   `if (not block.attr.classes:includes("cell-code") ...) then return block end`
# and only an execution engine adds `cell-code`. With `execute: enabled: false`
# every fence is a plain fence, so Quarto walks past it. The flag is kept for
# the day a cell does execute; filters/fold-static-code.lua does the real work
# for plain fences. Both flavours are styled identically in scss/minimal.scss.
filters:
  - at: post-quarto
    path: filters/fold-static-code.lua

format:
  html:
    theme:
      - scss/minimal.scss
    toc: true
    toc-depth: 3
    toc-location: right
    toc-title: "On this page"
    page-layout: article
    # Off: it numbered prose pages, e.g. index.qmd rendered as
    # "1 List of Exercises and Assignments".
    number-sections: false
    # KaTeX is served from this repo, not a CDN. Thirty-four pages carry
    # mathematics, and the default `katex@latest` on jsdelivr both floats
    # (a breaking release upstream silently breaks the note) and fails often
    # enough to matter — a reader on a plane or a blocked network gets raw TeX
    # on every one of those pages. Vendored copy is 0.16.22, woff2 only.
    html-math-method:
      method: katex
      url: /assets/katex/
    code-fold: true
    code-summary: "Show the code"
    code-copy: hover
    # Off: it injects a "</> Code" dropdown into the header of every page,
    # including the many with no code at all.
    code-tools: false
    highlight-style: monochrome
    code-block-bg: "#fbfbfa"
    code-block-border-left: "#e0ded9"
    css:
      - assets/anim.css
    include-after-body:
      - _includes/anim.html

resources:
  - "assets/**"
  # PDF copying otherwise depends on link-discovery heuristics, and the M02
  # worksheets 404 in production even though the files are on disk.
  - "m0*/pen-and-paper/*.pdf"

# Add a bibtex file so that we can create citations
bibliography: references.bib

