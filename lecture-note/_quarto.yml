    # No `search:` here — the navbar already carries one, and setting both
    # renders two search boxes on every page.
    collapse-level: 1
    border: false
    background: "white"
    # Entries are bare file paths on purpose: the label is then inherited from
    # the page's own YAML `title`, so a retitled page can never drift out of
    # sync with the nav that points at it.
