<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-labelledby="kmap-title">
  <title id="kmap-title">Schematic map of Königsberg: four landmasses A, B, C, D joined by seven bridges a to g.</title>
  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">

    <!-- water -->
    <rect x="0" y="0" width="760" height="430" fill="#e9e6f1"/>

    <!-- landmasses -->
    <g fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5">
      <path d="M-4,-4 H764 V96 C640,116 520,88 400,104 C280,120 130,92 -4,110 Z"/>
      <path d="M-4,434 H764 V330 C640,314 520,342 400,326 C280,310 130,338 -4,320 Z"/>
      <ellipse cx="250" cy="215" rx="170" ry="62"/>
      <ellipse cx="610" cy="215" rx="100" ry="50"/>
    </g>

    <!-- the seven bridges -->
    <g fill="#593196">
      <rect x="141" y="88"  width="18" height="84" rx="4"/>
      <rect x="311" y="88"  width="18" height="84" rx="4"/>
      <rect x="141" y="258" width="18" height="84" rx="4"/>
      <rect x="311" y="258" width="18" height="84" rx="4"/>
      <rect x="400" y="206" width="130" height="18" rx="4"/>
      <rect x="601" y="88"  width="18" height="96" rx="4"/>
      <rect x="601" y="246" width="18" height="96" rx="4"/>
    </g>

    <!-- bridge names -->
    <g fill="#593196" font-size="18" font-style="italic" font-weight="600">
      <text x="131" y="136" text-anchor="end">c</text>
      <text x="301" y="136" text-anchor="end">d</text>
      <text x="131" y="308" text-anchor="end">a</text>
      <text x="301" y="308" text-anchor="end">b</text>
      <text x="465" y="196" text-anchor="middle">e</text>
      <text x="591" y="132" text-anchor="end">g</text>
      <text x="591" y="302" text-anchor="end">f</text>
    </g>

    <!-- landmass names -->
    <g fill="#1a1a1a" font-size="18" font-weight="600">
      <text x="380" y="54"  text-anchor="middle">C — north bank</text>
      <text x="380" y="394" text-anchor="middle">B — south bank</text>
      <text x="250" y="222" text-anchor="middle">A — Kneiphof island</text>
      <text x="610" y="222" text-anchor="middle">D — east island</text>
    </g>

  </g>
</svg>
