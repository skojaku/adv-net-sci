# Links to the marimo notebooks that hold all executable code for this course.
#
# The lecture note itself contains no runnable code: it is prose, mathematics
# and static figures. Everything you actually run lives in a marimo notebook,
# and this file is the single place where those links are recorded.
#
# ---------------------------------------------------------------------------
# TWO WAYS A NOTEBOOK RUNS
# ---------------------------------------------------------------------------
# marimo.app  Runs the notebook in the browser via WebAssembly (Pyodide), read
#             straight from GitHub. Nothing to upload, nothing stored here, and
#             the link updates itself whenever the notebook is pushed.
#             Constraint: Pyodide can only load pure-Python wheels plus the
#             packages it ships itself. It does ship igraph, numpy, scipy,
#             pandas, matplotlib, scikit-learn, networkx and altair, which
#             covers modules 1-7.
#
# molab       Hosted execution at https://molab.marimo.io. Needed when a
#             notebook uses a compiled package Pyodide cannot load. That is
#             gensim (module 8) and torch (module 9). Upload is web-only —
#             there is no CLI for it — but molab can sync a notebook from a
#             GitHub URL, so you paste the repo link rather than a file.
#
# To move a notebook between the two, just change its URL below. Pages refer to
# these as {{< var molab.m05 >}}, so one edit here fixes every page.

molab:
  # --- runs in the browser, no upload needed -------------------------------
  m01: "https://marimo.app/https://github.com/skojaku/adv-net-sci/blob/main/notebooks/m01-euler-tour/coding.py"
  m01_sparse: "https://marimo.app/https://github.com/skojaku/adv-net-sci/blob/main/notebooks/m01-euler-tour/sparse-matrices.py"
  m01_exercises: "https://marimo.app/https://github.com/skojaku/adv-net-sci/blob/main/notebooks/m01-euler-tour/03-exercises.py"
  # The paired lab the pen-and-paper sheet hands off to. The sheet prints a
  # short redirect (go.skojaku.com/m01lab) because students type it by hand;
  # point that redirect here.
  m01_lab: "https://marimo.app/https://github.com/skojaku/adv-net-sci/blob/main/notebooks/m01-euler-tour/pen-and-paper-lab.py"
  m02: "https://marimo.app/https://github.com/skojaku/adv-net-sci/blob/main/notebooks/m02-small-world/coding.py"
  m03: "https://marimo.app/https://github.com/skojaku/adv-net-sci/blob/main/notebooks/m03-robustness/coding.py"
  m04: "https://marimo.app/https://github.com/skojaku/adv-net-sci/blob/main/notebooks/m04-friendship-paradox/coding.py"
  m05: "https://marimo.app/https://github.com/skojaku/adv-net-sci/blob/main/notebooks/m05-clustering/coding.py"
  m06: "https://marimo.app/https://github.com/skojaku/adv-net-sci/blob/main/notebooks/m06-centrality/coding.py"
  m07: "https://marimo.app/https://github.com/skojaku/adv-net-sci/blob/main/notebooks/m07-randomwalks/coding.py"

  # --- needs molab or a local environment ----------------------------------
  # m08 imports gensim (compiled; no Pyodide wheel).
  m08: TODO

  # Module 9 has no hosted notebook. It is taught with animations only, and its
  # code is read and run locally from notebooks/m09-graph-neural-nets/.

# Interactive demos that are already standalone apps and need no notebook.
#
# NOTE: nothing in the lecture note uses `{{< var demo.* >}}` — every module
# links its demo by relative path instead, so these entries are currently
# unreferenced. They are kept only as the canonical published URLs, for the
# slide decks under slides/, which do link absolutely. Two entries were removed
# with their demos: `mst` (kruskal-vs-prime.html, superseded by the animated
# Kruskal/Prim stage in m03) and `spectra` (spectra-decomposition.html, linked
# from nothing).
demo:
  watts_strogatz: "https://marimo.app/https://github.com/skojaku/adv-net-sci/blob/main/lecture-note/assets/marimo/watts_strogatz_wasm.py?embed=true&show-chrome=false&mode=app"
  robustness: "https://skojaku.github.io/adv-net-sci/assets/vis/network-robustness.html"
  friendship_paradox: "https://skojaku.github.io/adv-net-sci/assets/vis/friendship-paradox-game.html"
  vaccination: "https://skojaku.github.io/adv-net-sci/assets/vis/vaccination-game.html"
  community: "https://skojaku.github.io/adv-net-sci/assets/vis/community-detection/index.html"
  amida: "https://skojaku.github.io/adv-net-sci/assets/vis/amida-kuji.html"
  random_walk: "https://skojaku.github.io/adv-net-sci/assets/vis/random-walks/index.html"

