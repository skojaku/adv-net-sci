# Lesson script for the AI-guided session: Module 02 — Small-World Networks
#
# This file is the tutor's curriculum. The tutor agent (see AGENTS.md) follows
# these checkpoints IN ORDER. The agent adapts wording, pacing, and hints to
# the student, but it must NOT skip, reorder, or invent checkpoints. Detours
# (student questions) are allowed anywhere and do not count as checkpoints.
#
# Channels (see AGENTS.md "Channel discipline"):
#   - Words live in the TERMINAL: stories, questions, the student's typed
#     answers, hints, feedback. Checkpoints with `build: none` never touch
#     the notebook.
#   - The NOTEBOOK is only for what the terminal cannot do: figures,
#     interactive/animated widgets, photo uploads. Prefer interactive over
#     static — a slider the student can move beats a frozen image.
#   - Every notebook cell that expects student input (an upload, exploring a
#     widget) gets a ✅ Done button: pass done_signal: "<checkpoint id>" to
#     nb_add_cell and the wiring is automatic. Clicking it pings the terminal
#     tutor. Typing "done" in the terminal always works too.
#
# "accept" describes what a passing answer must contain. The agent judges
# meaning, not wording. Numeric answers accept small rounding differences.
#
# "hints" are only the FIRST rungs of a ladder: the tutor invents more,
# ever-smaller rungs as needed and NEVER states the answer — the student must
# take the final step themselves, however long it takes (see AGENTS.md,
# "Guiding without giving the answer").

meta:
  module: m02-small-world
  title: "The Small-World Puzzle"
  expected_duration_min: 45-60
  concepts:
    - Milgram's small-world experiment / six degrees of separation
    - Shortest path, distance, average path length
    - Local clustering coefficient
    - Why small-world is non-trivial (high clustering AND short paths)
    - Watts-Strogatz model: ring lattice + random rewiring
    - Critique: high clustering alone does not imply small-world

checkpoints:

  - id: cp0_welcome
    goal: Calibrate the session to the student.
    build: none
    ask: |
      Greet and ask what to call them (say). Then ask how they feel about
      Python with ask_student: "I don't code" / "tried a little" /
      "comfortable with Python".
    accept: Any answer. Record it.
    adapt: |
      "I don't code"  -> never ask the student to write code; keep all
                         notebook code collapsed; explain in plain words.
      "tried a little"-> offer small optional code peeks.
      "comfortable"   -> code cells visible; offer the stretch (cs1) later.

  - id: cp1_milgram
    goal: Hook — the six degrees of separation result.
    build: |
      nb_add_template("cp1_milgram_image") — shows the experiment picture
      while you tell the story.
    ask: |
      Tell the Milgram story in the terminal — in your short spoken beats,
      pointing the student to the picture: 1960s, packets mailed to random
      people in Omaha, Nebraska; goal — reach a specific stockbroker in
      Boston; rule — you may only forward it to someone you know on a
      first-name basis. Then ask for a guess with ask_student:
      for the letters that made it, how many hands on average?
      Options: "about 6" / "about 20" / "about 60" / "over 200".
    accept: Any guess. This is a prediction — never mark it wrong.
    reveal_after: |
      In the terminal: about 6 — "six degrees of separation"; 64 of 160
      letters arrived. Facebook's 721-million-user network (2011): 4.74 steps
      on average. Bridge: "Hundreds of millions of people, ~6 steps. Something
      about the network's SHAPE makes that possible. Let's find out what."

  - id: cp2_distance
    goal: Student can compute distance and average path length on a small graph.
    build: |
      nb_add_template("cp2_ripple") — a slider-driven "wave from A" explorer
      on the 4-node graph (edges: A-B, A-C, B-C, B-D, C-D): nodes reachable
      within cp2_steps edges light up, animating what "distance" means.
    ask: |
      ONE question at a time:
      1. "Play with the slider — watch the wave spread from A. What's the
         distance from A to D — the number of EDGES on the shortest route?"
      2. Only after they answer: "Now the average distance over all 6 pairs —
         a fraction or decimal is fine."
    accept: |
      distance A-D = 2.  average = 7/6 ≈ 1.17 (accept 1.16-1.17 or "7/6").
    hints:
      - "Set the slider to 1 — who lights up? Now 2 — when does D light up?"
      - "There are 6 pairs: AB, AC, AD, BC, BD, CD. Five are directly connected (distance 1). Make a little table and average."
    reveal_after: |
      nb_add_template("cp2_pairs_table") — the six pairs drawn as circle
      pairs with their distances, average in the title. Then one beat in the
      terminal: average path length = the average shortest-path distance over
      all pairs — this number is what "six degrees" measures for the whole
      USA.

  - id: cp3_clustering
    goal: Student understands local clustering as "do my friends know each other?"
    build: |
      nb_add_template("cp3_clustering") (only AFTER the idea question below
      is answered) — A with five friends; the two friendships among the
      friends (B-F, C-E) are highlighted in orange.
    ask: |
      ONE question at a time:
      1. "In your own words: what would it mean, in numbers, to say 'Alice's
         friends tend to know each other'?" (typed answer)
      2. Then build the figure and ask: "A has 5 friends, so up to 10
         friendships could exist among them. How many actually exist?"
      3. After they answer: "So what fraction is that?"
    accept: |
      Idea: any mention of counting friend-pairs that are themselves
      connected, out of possible pairs (triangles = bonus, not required).
      Calculation: 2 of 10 exist -> C_A = 2/10 = 0.2.
    hints:
      - "Look only at A's friends: B, C, D, E, F. Ignore A. How many lines run BETWEEN them?"
      - "2 friendships exist out of 10 possible. So the fraction is...?"
    reveal_after: |
      Terminal: name it — local clustering coefficient C_i = (edges among
      neighbors) / (possible edges among neighbors); averaging over nodes
      gives the network's clustering. Social networks: typically high. One
      sentence: a 'global clustering' variant exists in the lecture notes.

  - id: cp4_shortcut_drawing
    goal: Student discovers, with pen and paper, that WHERE a link goes matters
          more than HOW MANY links there are.
    build: |
      nb_add_template("cp4_upload", done_signal="cp4_shortcut_drawing") —
      the photo upload area plus the Done button.
    ask: |
      Terminal: "Pen and paper time! 📝
      1. Draw 8 dots in a circle. Connect each dot to its neighbor on each
         side, so you get a ring.
      2. The two dots straight across from each other are 4 steps apart.
      3. You get ONE extra cable. Draw it where you think it shrinks travel
         distances across the whole ring the most.
      Photograph your drawing and upload it in the notebook, then click the
      Done button — or just tell me here which two dots you connected and why."
    accept: |
      A long-range chord (opposite or near-opposite dots), with any reasoning
      about "connecting the far sides". The classic miss — connecting two dots
      that are already close — is NOT a fail: it is the perfect teaching
      moment (see reveal_after). Judge the reasoning, not the artwork.
    hints:
      - "Try your cable between two dots that are already close. Who benefits? Now try it between dots that are far apart. Who benefits now?"
    reveal_after: |
      nb_add_template("cp4_compare") — a radio-driven comparison: choosing
      "no cable / short cable / long cable" redraws the 8-ring and updates
      the average distance in the title.
      Terminal — the punchline, referencing THEIR cable: a SHORT extra link
      creates a triangle (clustering up, distances barely move); a LONG one is
      a SHORTCUT (distances drop for everyone). One cable, two very different
      effects.

  - id: cp5_tension
    goal: Student articulates the tension that makes small-world non-trivial.
    build: none
    ask: |
      ONE world at a time: "Imagine a RING world — everyone knows only their
      neighbors. What's good about living there, and what's bad?" After they
      answer, the RANDOM world (friends scattered completely at random) the
      same way.
    accept: |
      Ring: high clustering / tight communities (good), long distances (bad).
      Random: short distances (good), no clustering (bad). Any phrasing that
      captures both trade-offs passes.
    hints:
      - "In the RING world, do your friends know each other? And how long does a letter take to cross the ring?"
      - "In the RANDOM world, how fast can a letter travel? And do your friends know each other?"
    reveal_after: |
      Terminal, sharply: real social networks have BOTH high clustering AND
      short paths. Neither extreme world explains that. So how does nature
      do it?

  - id: cp6_watts_strogatz
    goal: Student sees that a tiny fraction of rewired links collapses distance
          while clustering survives.
    build: |
      nb_add_template("cp6_ws_explorer", done_signal="cp6_watts_strogatz")
      (only AFTER the prediction below is committed) — slider over p; the
      network drawing highlights rewired shortcut edges in red, and the
      title shows L(p)/L₀ and C(p)/C₀ live.
    ask: |
      FIRST, before any widget exists, ask_student: "Rewire just 1% of the
      ring's links to random targets. What happens?" Options:
      "both distance and clustering drop a lot" /
      "distance drops a lot, clustering barely changes" /
      "clustering drops a lot, distance barely changes" /
      "both barely change".
      Then build the explorer and: "Play with the slider. Around which p does
      distance collapse — and what is clustering doing there? Click Done when
      you've got it."
    accept: |
      Report notices that L collapses at small p (~0.01, i.e. ~1% of links)
      while C is still high, and honestly compares to their prediction.
      A wrong prediction + honest reconciliation is a FULL PASS — say so.
    hints:
      - "Set p = 0.01 exactly. Read the two numbers. Which one moved?"
    reveal_after: |
      Terminal: name the model (Watts & Strogatz, 1998). The mechanism: a few
      random rewires are the long cables from your drawing — rare enough that
      clustering survives, but they shortcut the whole ring. This resolves
      cp5's puzzle and explains cp1's six degrees.

  - id: cp7_redteam
    goal: Student can catch a plausible-but-wrong small-world claim.
    build: none
    ask: |
      Terminal — quote this as a message from an AI assistant:
        "I analyzed your network. Its average clustering coefficient is 0.61,
         far higher than a random network's (0.01). Therefore this is a
         small-world network."
      "You're the reviewer who has to sign off on this. Do you? What would
      you check before signing?"
    accept: |
      Must notice that path length was never measured — high clustering alone
      is not enough. Gold answer cites the counterexample they already met:
      the p=0 ring (high clustering, LONG paths). Bonus: mentions comparing
      against a random baseline (the small-world index σ in the lecture notes).
    hints:
      - "Small-world needs TWO properties. The assistant measured how many?"
      - "You built a network today with very high clustering and terrible distances. Which one?"
    reveal_after: |
      Terminal: verifying an AI's analysis requires knowing what the concept
      demands — exactly the skill this course grades. Point to the small-world
      index σ (clustering AND path length, both vs a random baseline) in the
      lecture notes as the proper check.

  - id: cp8_wrapup
    goal: Consolidation — student explains the phenomenon end to end.
    build: none
    ask: |
      Terminal: "Last one. A friend asks: 'How can a letter cross a whole
      country in about six steps?' Explain it in about three sentences, your
      own words, no jargon required."
    accept: |
      Mentions (any wording): local links create clusters; a few long-range
      shortcuts exist; those shortcuts make everyone close. All three ->
      full pass. Two of three -> one gentle follow-up, then pass.
    reveal_after: |
      Close the session per "Ending the session" in AGENTS.md (session
      summary, congratulate, what's next: module m03 robustness, and the σ
      index in the lecture notes). Remind them the notebook — the wave
      explorer, the cable comparison, the rewiring slider — is theirs to keep
      playing with.

# Optional stretch — offer ONLY if cp0 said "comfortable with Python",
# after cp6, if time and energy allow. Never required, never logged as a fail.
stretch:
  - id: cs1_code
    goal: Student writes a real check with networkx.
    ask: |
      Terminal: "Load Zachary's karate club (nx.karate_club_graph()) and
      decide with code: is it a small world? Compute average path length and
      average clustering, and compare each against an Erdős–Rényi graph with
      the same number of nodes and edges. You write it (in the notebook — ask
      me to open you a scratch cell); I'll only rescue you if you ask."
    accept: |
      Working comparison + a verdict in words. Style does not matter;
      the interpretation does.
