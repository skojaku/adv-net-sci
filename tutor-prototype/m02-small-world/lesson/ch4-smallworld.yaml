# Chapter 4 of 5 — Turning One Dial (cp6, cp6_large_n_experiment, + optional stretch).
# The chapter title is deliberately vague: it is rendered as a visible
# notebook header and a terminal divider BEFORE cp6's prediction, so it must
# not name the answer ("The Small-World Recipe" gave the prediction away).
# Follow checkpoints IN ORDER. Judge "accept" by meaning, not wording.
# "hints" are first rungs of a ladder — invent smaller rungs, never state answers.
# After logging the last checkpoint, call chapter_done with short handoff notes.

chapter:
  id: ch4
  title: "Turning One Dial"
  goal: Student sees that a tiny fraction of rewired links collapses distance
        while clustering survives (Watts-Strogatz), then proves it themselves
        with a real coded experiment at large N.
checkpoints:

  - id: cp6_watts_strogatz
    goal: Student sees that a tiny fraction of rewired links collapses distance
          while clustering survives.
    build: |
      nb_add_template("cp6_ws_explorer")
      (only AFTER the prediction below is committed) — slider over p; the
      network drawing highlights rewired shortcut edges in rust, and the
      title shows L(p)/L₀ and C(p)/C₀ live.
    ask: |
      FIRST, before any widget exists, ask_user_question: "Rewire just 1% of the
      ring's links to random targets. Per your own C(k)/L(N,k) formulas from
      last chapter, what happens?" Options:
      "both distance and clustering drop a lot" /
      "distance drops a lot, clustering barely changes" /
      "clustering drops a lot, distance barely changes" /
      "both barely change".
      Then build the explorer and ask it as a reading task, not as
      "where does it collapse" — the slider has eight fixed stops and
      "collapse" is not a thing they can see a definition of:
      "Move the slider one notch at a time from the left, and write the
      two numbers down as you go. Which single notch drops L/L₀ the most?
      And at that same notch, what is C/C₀ — near 1, or near 0? Tell me
      here when you have it."
    accept: |
      They name a notch where L/L₀ fell hard and report that C/C₀ was still
      high there, and reconcile that honestly with their prediction.
      Measured on the widget's own 200-person ring, notch by notch:
        p      L/L₀   C/C₀   drop in L/L₀ from the notch before
        0.001  1.00   1.00   0.00
        0.005  0.70   0.98   0.30   <- one of the two biggest
        0.01   0.61   0.97   0.09
        0.05   0.29   0.84   0.32   <- the other
        0.1    0.24   0.75   0.05
      So 0.005, 0.01 and 0.05 ALL pass, and so does "somewhere around 1%".
      The two steepest single drops are nearly tied — never insist on one
      notch, and never correct a student who picked the other.
      A wrong prediction + honest reconciliation is a FULL PASS — say so.
    fresh_variants: |
      If the answer slips out, ask the same thing from the other end: "start
      the slider at p=1 (everything rewired) and walk it DOWN — where does
      clustering come back, and what is distance doing there?" Same two
      curves, opposite direction of travel: C/C₀ climbs back near 1 only
      once p is back down around 0.01, while L/L₀ stays low.
    hints:
      - "Set p = 0.01 exactly. Read the two numbers. Which one moved?"
      - "Slide p from 0 up slowly and watch ONE number only: L/L₀. Where does it fall off a cliff?"
      - "Go back to that p. Now cover L/L₀ and read only C/C₀ — is it near 1, or near 0?"
    reveal_after: |
      Terminal: name the model (Watts & Strogatz, 1998). The mechanism: a few
      random rewires are the long cables from the student's drawing — rare
      enough that clustering survives, but they shortcut the whole ring. This
      resolves ch3's puzzle and explains ch1's six degrees.
    note: |
      ### 🎛️ The Watts–Strogatz recipe (1998)
      The dials: $p$ = the fraction of links picked up and reconnected to a
      random person; $L$ = average distance (typical steps between two
      people); $C$ = clustering (how often two of your friends know each
      other). $L_0$ and $C_0$ are the same two on the untouched ring, so the
      ratios read "compared to before".

      Rewiring only about 1% of a ring's links ($p \approx 0.01$) already
      pulls distance down hard — here $L/L_0$ falls to about $0.6$ — while
      clustering barely moves ($C/C_0 \approx 1$). Those few rewires are the
      long cables from my drawing: rare enough to keep the communities, long
      enough to shortcut the whole ring. That's the small-world recipe, and
      it's why six degrees works.

      > **My prediction:** «their pick» → **what I actually saw:**
      «their report, verbatim»

  - id: cp6_large_n_experiment
    goal: |
      Student runs a real coded experiment — large N, sweep p, find where L
      collapses while C survives — and sees the effect get more dramatic (a
      smaller critical p) as N grows past the N=200 toy from cp6.
    build: |
      nb_add_exercise with name "cp6_large_n" and
      checkpoint="cp6_large_n_experiment" (pass it, or the previous
      checkpoint's note cell can land after this box), adapted to the
      student's cp0 comfort level (carried in your handoff notes — same
      mechanism the cs1_code stretch already relies on):

      COMFORTABLE WITH PYTHON — scaffold with a few `...` blanks:
      ```
      # 1. Set a LARGE network size — much bigger than the N=200 you played with.
      N = ...  # try 2000
      k = 4
      p_values = [0.0, 0.001, 0.005, 0.01, 0.05, 0.1, 0.5, 1.0]

      L0 = C0 = None
      rows = []
      for p in p_values:
          G = nx.connected_watts_strogatz_graph(N, k, p, seed=1) if p > 0 else nx.watts_strogatz_graph(N, k, 0)
          # 2. Measure the average distance of G — nx.average_shortest_path_length
          L = ...
          # 3. Measure the average clustering of G — nx.average_clustering
          C = ...
          if p == 0.0:
              L0, C0 = L, C
          rows.append({"p": str(p), "L/L0": L / L0, "C/C0": C / C0})

      df = pd.DataFrame(rows).melt("p", var_name="measure", value_name="ratio")
      alt.Chart(df).mark_line(point=True).encode(
          x=alt.X("p:O", title="rewiring probability p"),
          y=alt.Y("ratio:Q", title="ratio to p=0 baseline"),
          color=alt.Color("measure:N", scale=alt.Scale(range=["#B4552D", "#35577F"])),
      ).properties(title=f"N={N}, k={k}")
      ```

      "I DON'T CODE" / "TRIED A LITTLE" — same scaffold, fully filled in
      (zero blanks, N=2000, `L = nx.average_shortest_path_length(G)`,
      `C = nx.average_clustering(G)` already written) — they press ▶ Run
      and read the chart rather than writing anything.
    ask: |
      "Press ▶ Run — it takes a few seconds on a network this size. Run it as
      many times as you like; when the chart looks right, press 📨 Send my
      code to my tutor under it and I'll read what you wrote."
      Then WAIT. Their press starts your turn and hands you the code — never
      ask whether they have run it yet, and never ask them to paste it.
      When it arrives, read it with nb_read(["cp6_large_n_ed.value"]) and ask:
      "At which p does the L/L₀ line make its steepest drop, and what is C/C₀
      doing at that p? Then: is that p bigger, smaller, or about the same as
      the one you found on the 200-person ring?"
    accept: |
      Reads the steepest drop off their own chart, and compares it to the
      200-person ring. At N=2000, seed 1, the drops are unambiguous:
        p      L/L₀   C/C₀   drop from the notch before
        0.001  0.52   1.00   0.48   <- clearly the steepest
        0.005  0.30   0.99   0.22
        0.01   0.17   0.98   0.13
        0.05   0.05   0.86   0.11
      So the expected answer is p = 0.001 with C/C₀ still 1.00, and the
      comparison is SMALLER than what they found at N=200 — a tenth of a
      percent of the links instead of half a percent to five percent.
      "Smaller" is the graded half; the exact notch is not. A student who
      says "about the same, still a tiny fraction" has also understood the
      point and passes — press only for whether it moved, not by how much.
    hints:
      - "Same reading as before: find where the L/L0 line drops sharply. What p is that, roughly?"
      - "At that p, has C/C0 moved much?"
    fresh_variants: |
      If the answer slips out, re-run the same sweep on NEW settings — the
      student edits one line in their own code box and presses ▶ Run again:
      N=5000 with k=4 (the collapse moves to an even smaller p), or N=2000
      with k=10 (more friends each, so the ring starts closer together and
      the whole curve shifts). Ask the same question of the new chart.
    reveal_after: |
      Terminal: this is the real Watts-Strogatz result at scale, not a toy
      — the effect you found on 200 dots holds (and sharpens) on thousands.
      Bridges to next chapter's small-world index, which turns "clustering
      high AND distance low" into one number.
    note: |
      ### 💻 The phase transition, at scale
      Same experiment as the slider, but coded and run on a much bigger
      network — $N$, the number of people, is 2000 here instead of 200. I
      swept $p$ (the fraction of links rewired at random) and plotted
      $L/L_0$ (average distance, compared to the untouched ring) against
      $C/C_0$ (clustering, compared to the untouched ring).

      > **What I found:** «their answers, verbatim»

# Optional stretch — offer ONLY if cp0 said "comfortable with Python", after
# cp6, if time and energy allow. Never required, never logged as a fail.
stretch:
  - id: cs1_code
    goal: Student writes a real check with networkx.
    ask: |
      "Load Zachary's karate club (nx.karate_club_graph()) and decide with
      code: is it a small world? Compute average path length and average
      clustering, and compare each against an Erdős–Rényi graph with the
      same number of nodes and edges. I'll set up a code box for you in the
      notebook (nb_add_exercise, scaffold with ... blanks); you fill it in
      and press ▶ Run — I'll only rescue you if you ask."
    accept: |
      Working comparison + a verdict in words. Style does not matter;
      the interpretation does.
