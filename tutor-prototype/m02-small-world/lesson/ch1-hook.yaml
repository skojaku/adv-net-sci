# Chapter 1 of 5 — A Letter Across a Country (cp0-cp1).
# The chapter title is deliberately vague: it is rendered as a visible
# notebook header before cp1's prediction, so it must not name the answer.
# Follow checkpoints IN ORDER. Judge "accept" by meaning, not wording.
# "hints" are first rungs of a ladder — invent smaller rungs, never state answers.
# After logging the last checkpoint, call chapter_done with short handoff notes.

chapter:
  id: ch1
  title: "A Letter Across a Country"
  goal: Hook the student with the six-degrees phenomenon and calibrate to them.
checkpoints:

  - id: cp0_welcome
    goal: Calibrate the session to the student.
    build: none
    ask: |
      Greet warmly in one breath — do NOT ask their name.
      Then ask with ask_user_question (the DIALOG, not plain text — this is
      one of the two places the dialog is used): "How do you feel about
      Python?" Options: "I don't code" / "tried a little" /
      "comfortable with Python". Do not also type the question out.
    # No hints and no reveal_after, deliberately: "how do you feel about
    # Python?" has no wrong answer to hint toward and nothing to reveal.
    # Same for cp1's guess below. Every OTHER checkpoint carries both.
    accept: |
      Any answer. Record it. Judgment is `pass` with 0 hints — this is a
      calibration question, not a lesson: there is nothing to get wrong and
      nothing to hint toward. (A live run logged `guided`, which the
      extension then reconciled into a hint that never happened.)
    adapt: |
      "I don't code"  -> never ask the student to write code; keep all
                         notebook code collapsed; explain in plain words.
      "tried a little"-> offer small optional code peeks.
      "comfortable"   -> code cells visible; offer the ch4 stretch later.
    # No note cell on purpose. This checkpoint calibrates the session; it
    # teaches nothing, so a cell about it would be the first thing a reader
    # meets in a lecture note that has not started yet. The answer is still
    # logged and still appears in the closing session_record, where the
    # grader wants it. `note: none` is the switch that suppresses the cell
    # without the tool nagging for a hand-written one.
    note: none

  - id: cp1_milgram
    goal: Hook — the six degrees of separation result.
    build: |
      nb_add_template("cp1_milgram_image") — shows the experiment picture
      while you tell the story.
    ask: |
      Tell the Milgram story in short spoken beats, pointing to the picture:
      1960s, packets mailed to random people in Omaha, Nebraska; goal —
      reach a specific stockbroker in Boston; rule — you may only forward it
      to someone you know on a first-name basis. Then ask for a guess with
      ask_user_question: for the letters that made it, how many hands on average?
      Options: "about 6" / "about 20" / "about 60" / "over 200". Each option
      needs a `description` (the field is required — omitting it fails
      validation and prints the rejected payload into the student's
      terminal), and each description REPEATS ITS LABEL and nothing more: a
      description that calls one of them "surprisingly few" hands over the
      answer while the question is still open.
      THEN give the reveal below, and finish with ONE typed question:
      "How does that compare with what you guessed?" Their picker choice never
      reaches the transcript, so this line is the only thing the notebook can
      quote in their own voice. Ask it, end your turn, and wait — checkpoint_done
      refuses this checkpoint until they have answered.
    accept: |
      Any guess. This is a prediction — never mark it wrong. Their one-line
      reaction to the reveal is never wrong either; any honest comparison
      passes ("way off", "I nearly said 6", "that's fewer than I'd believe").
    reveal_after: |
      About 6 — "six degrees of separation"; 64 of 160 letters arrived.
      Facebook's 721-million-user network (2012 study): 4.74 steps on average.
      THEN one typed follow-up, before the bridge: "How does that compare
      with what you guessed?" One line is plenty. Their picker choice never
      reaches the transcript, so this line is the only thing the notebook can
      quote in their own voice — ask it, and wait.
      Bridge: "Hundreds of millions of people, ~6 steps. Something about the
      network's SHAPE makes that possible. Let's find out what."
    note: |
      ### 🌍 Six degrees of separation
      In the 1960s, Stanley Milgram mailed packets to strangers in Nebraska
      with one rule: pass it to someone you know on a first-name basis,
      until it reaches a Boston stockbroker. The letters that arrived took
      about **6 hops** (64 of 160 made it). A 2012 study re-measured this on
      Facebook's 721 million users: **4.74 steps** on average.

      > **My guess:** «their pick» — «their own line on how it compared, verbatim»
