# Chapter 2 of 5 — Measuring Smallness
# (cp2_distance, cp2_diameter, cp2_paperwork, cp3_clustering, cp3_global_clustering).
# Follow checkpoints IN ORDER. Judge "accept" by meaning, not wording.
# "hints" are first rungs of a ladder — invent smaller rungs, never state answers.
# If an answer slips out, re-check with the SAME question on fresh_variants data.
# After logging the last checkpoint, call chapter_done with short handoff notes.

chapter:
  id: ch2
  title: "Measuring Smallness"
  goal: |
    The student can compute distance, average path length, diameter, local
    clustering, and global clustering.
checkpoints:

  - id: cp2_distance
    goal: Student can compute distance and average path length on a small graph.
    build: |
      nb_add_template("cp2_ripple") — a slider-driven "wave from A" explorer
      on the 4-node graph (edges: A-B, A-C, B-C, B-D, C-D): nodes reachable
      within cp2_steps edges light up, animating what "distance" means.
    ask: |
      ONE question at a time:
      1. "Play with the slider — watch the wave spread from A. What's the
         distance from A to D — the number of EDGES on the shortest route?"
      2. Only after they answer: "Now the average distance over all 6 pairs —
         a fraction or decimal is fine."
    accept: |
      distance A-D = 2.  average = 7/6 ≈ 1.17 (accept 1.16-1.17 or "7/6").
    hints:
      - "Set the slider to 1 — who lights up? Now 2 — when does D light up?"
      - "List the pairs first, so nothing gets missed: AB, AC, AD, BC, BD, CD — that's all 6. Now go one at a time: is AB a single line, or further?"
      - "You have a distance for each of the 6 pairs now. Averaging means adding them all up and dividing by — what?"
    fresh_variants: |
      If the answer slips out, re-check on new data (draw it with
      nb_add_cell, student computes everything):
      - 4-person star, A in the middle: AB=AC=AD=1, BC=BD=CD=2 -> avg 9/6 = 1.5
      - square A-B-C-D-A: AB=BC=CD=AD=1, AC=BD=2 -> avg 8/6 ≈ 1.33
    reveal_after: |
      nb_add_template("cp2_pairs_table") — the six pairs as an Altair bar
      chart, distance on each bar, average in the title. Then one beat in
      the terminal: average path length = the average shortest-path
      distance over all pairs — this number is what "six degrees" measures
      for the whole USA.
    note: |
      ### 📏 Distance and average path length
      The **distance** $d(u,v)$ between two people is the number of edges on
      the shortest route between them. Averaging over every pair gives the
      **average path length** $L$ — one number for how far apart a whole
      network sits. Here five pairs sit at distance 1 and A–D at 2, so
      $L = 7/6 \approx 1.17$. "Six degrees" is exactly this number, measured
      on a whole country.

      > **I worked out:** «their answers, verbatim»

  - id: cp2_diameter
    goal: Student distinguishes diameter (the worst-case trip) from average path length (the typical trip), on the same chart just built.
    build: none
    ask: |
      Point back at the chart still on screen from cp2_distance (cp2_pairs_table).
      "That chart has six bars — one per pair — and the average was 7/6.
      But there's another number sitting right there in the same chart: the
      SINGLE longest trip in this whole network. Which pair is it, and how
      many edges?"
    accept: |
      A-D at 2 edges — the only pair not at distance 1. Naming the number
      (2) is enough; naming the pair too is a bonus, not required.
    hints:
      - "Scan the six bars in the chart — which one stands tallest?"
      - "You already worked out all six distances for the average. Which single one was the biggest?"
    fresh_variants: |
      Reuse cp2_distance's fresh-variant networks: the 4-person star (longest
      trip is 2, between any two leaves) or the A-B-C-D-A square (longest
      trip is 2, along either diagonal).
    reveal_after: |
      Terminal: name it — this worst-case number is the **diameter**.
      Average path length tells you the TYPICAL trip; diameter tells you
      the worst one. A network can have a small average and still hide a
      few painfully long trips in its diameter — they measure different
      things, and a small-world network keeps BOTH small even as it grows.
    note: |
      ### 📐 Diameter — the worst-case trip
      **Average path length** ($L$) is the typical trip; the **diameter**
      is the single LONGEST shortest-path trip anywhere in the network —
      the worst case, not the average. Here every pair sits at distance 1
      except A–D, so the diameter is **2**. A ring or lattice can have a
      diameter that keeps growing as the network grows; a small-world
      network's diameter stays small even as it gets bigger — that's part
      of what "small" means.

      > **I worked out:** «their answer, verbatim»

  - id: cp2_paperwork
    goal: |
      Apply distance and average path length BY HAND, on a graph never shown
      on screen, and submit the work as a photo — the digital widget was
      intuition; this is the real computation.
    build: |
      nb_add_template("cp2_paperwork") — a photo upload area
      (upload widget: cp2_paperwork_photo).
    ask: |
      "Pen and paper time. 📝 Draw 5 dots in a circle — A, B, C, D, E —
      and connect each dot only to its two neighbors, so you get a 5-ring
      (A-B, B-C, C-D, D-E, E-A). By hand, find the distance for ALL 10
      pairs, then the average. Then photograph that page and drop it into
      the upload box in the notebook, and press the 📨 Send button under
      it — I'll see it straight away."
      ASK FOR THE PHOTO, nothing else. Typed work is accepted (see accept),
      but do NOT offer it: a student given the easier option takes it, and
      the hand-worked page is the point of this checkpoint. Only if they say
      they can't photograph do you fall back to "then just type me the
      table."
    accept: |
      Average = 1.5 (15/10 — 5 pairs at distance 1, the other 5 "across the
      circle" pairs at distance 2), with pair-by-pair reasoning shown, not
      just the final number.
    hints:
      - "List all 10 pairs first: AB, AC, AD, AE, BC, BD, BE, CD, CE, DE. Which ones are neighbors — distance 1?"
      - "Take the pairs that are NOT neighbors. Pick one and walk it the SHORT way around the circle — how many steps?"
      - "You have every pair's distance now. Averaging means: add them all up, then divide by what?"
    fresh_variants: |
      If the answer slips out, re-check on a 6-person ring (same rule: each
      dot connects only to its two neighbors): 6 pairs at distance 1, 6 at
      distance 2, 3 "opposite" pairs at distance 3 -> sum 27, average
      27/15 = 1.8.
    reveal_after: |
      Nothing to build — their photo (or typed work) IS the artifact.
      One beat in the terminal naming what they just did: "that's the same
      average-path-length calculation, done by hand instead of on screen."
    note: |
      ### ✏️ By hand: distance on a 5-ring
      Same two ideas as before — $d(u,v)$, the distance between two people
      (the fewest lines you cross to get from $u$ to $v$), and $L$, the
      average of $d(u,v)$ over every pair — computed entirely on paper this
      time, on a network no widget ever showed. 5 pairs sit at distance 1,
      5 "across the circle" pairs sit at distance 2, so $L = 15/10 = 1.5$.

      > **My work:** «what my photo of the table shows, written as mine —
      "I listed all ten pairs and got…". A photographed answer never reaches
      the transcript, so this slot is yours to describe; quote any reasoning
      I typed alongside it»

  - id: cp3_clustering
    goal: Student understands local clustering as "do my friends know each other?"
    build: |
      nb_add_template("cp3_clustering") (only AFTER the idea question below
      is answered) — A with five friends, and the friendships among those
      friends drawn as rust lines. Do NOT look up which pairs they are and
      do NOT name them: counting them is the checkpoint, and a live run put
      both pair names into its very first hint.
    ask: |
      ONE question at a time.
      1. Anchor it in two extremes before asking for anything — a bare
         "what would it mean in numbers?" is too open to answer cold, and
         a student who freezes here has not failed at anything:
         "Picture Alice with five friends. In one version, none of the five
         have ever met each other. In the other, all five know each other.
         Same Alice, same five friends — what is actually different between
         those two pictures?" (typed answer; they will say something like
         'lines between the friends')
      2. Then, using their own words back: "Right. So if you wanted ONE
         number for how much Alice's friends know each other, what would
         you count — and what would you compare it against?"
      3. Then build the figure and ask: "A has 5 friends, so up to 10
         friendships could exist among them. How many actually exist?"
      4. After they answer: "So what fraction is that?"
    accept: |
      Idea (1)-(2): they see that the difference is lines BETWEEN Alice's
      friends, and get to counting those against how many there could be.
      "Count the lines among her friends" alone passes (2) — the "out of
      how many possible" half can come from you in the reveal if they only
      reach the counting. Triangles = bonus, never required. Judge (1) and
      (2) together: this is a discovery step, not a definition test.
      Calculation (3)-(4): 2 of 10 exist -> C_A = 2/10 = 0.2.
    hints:
      - "Look only at A's friends: B, C, D, E, F. Ignore A. How many lines run BETWEEN them?"
      - "Take one friend at a time. Does B have a line to any of C, D, E, F? Then C — does it?"
      - "You have two counts now: the friendships that exist, and the 10 that could. What do you do with two counts to get 'how often'?"
    fresh_variants: |
      If the answer slips out, re-check on new data: Alice with 4 friends
      and exactly one friendship among them -> 1 of 6 possible pairs = 1/6;
      or 4 friends where everyone knows everyone -> 6 of 6 = 1.
    reveal_after: |
      Terminal: name it — local clustering coefficient C_i = (edges among
      neighbors) / (possible edges among neighbors); averaging over nodes
      gives the network's average clustering. Social networks: typically
      high. There's also a way to measure clustering for the WHOLE network
      at once, counted differently — let's look at that next.
    note: |
      ### 🤝 Local clustering — do my friends know each other?
      The **local clustering coefficient** of a person $i$ is
      $C_i = \frac{\text{friendships among } i\text{'s friends}}{\text{possible ones}}$.
      A has 5 friends, so up to 10 friendships could exist among them; 2 do,
      so $C_A = 2/10 = 0.2$. Averaging $C_i$ over everyone gives the
      network's average clustering $\overline{C}$ — typically HIGH in
      social networks.

      > **I worked out:** «their answers, verbatim»

  - id: cp3_global_clustering
    goal: |
      Student distinguishes a triangle (a closed triplet) from an open
      triplet, and understands global clustering as a network-wide,
      hub-weighted ratio — different from the node-averaged local
      clustering just learned.
    build: none
    ask: |
      Stay on Alice's picture, still on screen from cp3_clustering.
      ONE piece at a time:
      1. "Pick Alice and any two of her friends who are NOT connected to
         each other. Two of the three possible friendships exist — both
         run back to Alice — but the third one doesn't. We call that shape
         an OPEN triplet, 'open' because one edge is missing. Now pick
         Alice and two friends who ARE connected to each other too, so all
         three edges exist. What would you call THAT shape, if not open?"
      2. "So a triangle really is just a triplet with all three edges — a
         CLOSED triplet. Now zoom out to the whole network, not just
         Alice's corner of it: say the whole network has 2 triangles in
         it, and 30 triplets total once you count the open ones too. Since
         each triangle gets counted three times — once centered on each of
         its three corners — the formula is 3 times the triangles, divided
         by the triplets. What number does that give you?"
      3. "Now think about WHO those triplets belong to. Alice's local score
         only ever looks at Alice's own five friends. This network-wide
         number doesn't care whose neighborhood a triplet sits in — it just
         counts every triplet in the whole network. Someone with 2 friends
         contributes very few possible triplets; someone with 200 friends
         contributes a lot. Does that make this network-wide number MORE
         sensitive to ordinary people, or to a few super-connected hubs?"
    accept: |
      (1) triangle = closed triplet, all three edges present, vs. an open
      triplet that is missing one edge.
      (2) 3x2/30 = 0.2.
      (3) hubs — high-degree nodes contribute disproportionately, unlike
      the node-averaged local version where everyone counts equally.
    hints:
      - "A triangle needs all three possible edges. Does your open triplet have all three, or just two?"
      - "3 times 2 is 6. What's 6 divided by 30?"
      - "If Alice has 2 friends, how many possible triplets can even be centered on her? Now what if she had 200?"
    fresh_variants: |
      If the answer slips out, re-check with new counts: 3 triangles and
      45 triplets total -> 9/45 = 0.2; or 1 triangle and 10 triplets ->
      3/10 = 0.3.
    reveal_after: |
      Terminal: name it — the **global clustering coefficient** (also
      called transitivity): 3 x triangles / triplets, one number for the
      WHOLE network. Unlike the local-clustering average, which treats
      every node equally, hub or leaf, this one gets pulled around by
      whoever has the most friends. The two numbers can disagree quite a
      bit on the same network — the lecture notes go further into when
      that happens.
    note: |
      ### 🔺 Global clustering — one number for the whole network
      A **triplet** is any three people with at least two friendships among
      them; if the third friendship is ALSO there, it's a **triangle** — a
      "closed" triplet. The **global clustering coefficient**
      $C = \frac{3 \times \text{triangles}}{\text{triplets}}$ counts every
      triplet in the network, not just one person's neighborhood — so
      people with more friends contribute more triplets, and pull this
      number around more than the node-averaged $\overline{C}$ does.

      > **I worked out:** «their answers, verbatim»
