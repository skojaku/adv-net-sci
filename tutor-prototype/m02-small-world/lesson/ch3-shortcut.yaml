# Chapter 3 of 5 — The Power of One Cable (cp4, cp5_ring_formula, cp5_tension).
# Follow checkpoints IN ORDER. Judge "accept" by meaning, not wording.
# "hints" are first rungs of a ladder — invent smaller rungs, never state answers.
# After logging the last checkpoint, call chapter_done with short handoff notes.

chapter:
  id: ch3
  title: "The Power of One Cable"
  goal: Student discovers that WHERE a link goes matters more than HOW MANY,
        derives on paper how clustering and path length scale with N and k on
        a ring, and can articulate the resulting tension.

checkpoints:

  - id: cp4_shortcut_drawing
    goal: Student discovers, with pen and paper, that WHERE a link goes matters
          more than HOW MANY links there are.
    build: |
      nb_add_template("cp4_upload") — the photo upload area
      (upload widget: cp4_photo).
    ask: |
      "Pen and paper time! 📝
      1. Draw 8 dots in a circle. Connect each dot to its neighbor on each
         side, so you get a ring.
      2. The two dots straight across from each other are 4 steps apart.
      3. You get ONE extra cable. Draw it where you think it shrinks travel
         distances across the whole ring the most.
      Photograph your drawing and upload it in the notebook, then tell me
      here when it's up — or just tell me which two dots you connected
      and why."
    accept: |
      A long-range chord (opposite or near-opposite dots), with any reasoning
      about "connecting the far sides". The classic miss — connecting two dots
      that are already close — is NOT a fail: it is the perfect teaching
      moment (see reveal_after). Judge the reasoning, not the artwork.
    hints:
      - "Try your cable between two dots that are already close. Who benefits? Now try it between dots that are far apart. Who benefits now?"
      - "Pick the two dots that are FARTHEST apart on your ring — how many steps between them right now? Now put the cable there: how many steps is it?"
      - "Forget the whole ring for a second. Just you and the dot straight across: does your cable make YOUR trip to it shorter, or not?"
    fresh_variants: |
      If the answer slips out, run it again on a ring of 10 dots (opposite
      dots are 5 steps apart) — or on a 12-dot ring (opposite dots 6 apart)
      — and ask for TWO cables this time: "where do the two go, and why
      there?" Same discovery, new numbers, and the two-cable version makes
      them think about spacing rather than a single lucky choice.
    reveal_after: |
      nb_add_template("cp4_compare") — a radio-driven comparison: choosing
      "no cable / short cable / long cable" redraws the 8-ring and updates
      the average distance in the title.
      Terminal — the punchline, referencing THEIR cable: a SHORT extra link
      creates a triangle (clustering up, distances barely move); a LONG one is
      a SHORTCUT (distances drop for everyone). One cable, two very different
      effects. This plain ring (each dot connects only to ITS TWO neighbors)
      has ZERO triangles before the cable — remember that, it matters next.
    note: |
      ### 🔌 One cable, two very different effects
      A cable between nearby dots closes a **triangle**: clustering goes up,
      distances barely move. A cable across the ring is a **shortcut**:
      distances drop for everyone at once. WHERE a link goes matters more
      than HOW MANY links there are.

      > **My cable:** «which dots they connected + their why, verbatim»

  - id: cp5_ring_formula
    goal: |
      Student derives, on paper, that a ring's clustering C depends only on
      the friend-count k (NOT on N), while its path length L depends on
      BOTH N and k — and explicitly corrects the "plain ring has no
      triangles" fact from cp4 into "a ring CAN have triangles once each
      person has more than 1 friend per side".
    build: |
      nb_add_template("cp5_ring_lattice") — a 12-dot ring with a friend-count
      slider k (2, 4, or 6); node 0 is rust and its k nearest neighbours are
      amber. It shows NO counts and NO clustering value: the counting is the
      student's job. The "check my count" box highlights the friendships
      among the amber dots — invite it only AFTER they have committed to a
      number, as a self-check.
      nb_add_template("cp5_ring_paperwork") — the photo upload area for their
      by-hand work (upload widget: cp5_ring_paperwork_photo).
    ask: |
      ONE piece at a time:
      1. "Set k to 2 — everyone knows only their 1 nearest neighbor each
         side, same as cp4's ring. Can two of node 0's friends ever know
         each other here? Why or why not?"
      2. "Now set k to 4 — 2 friends each side. On paper, list node 0's 4
         friends. Of the 6 possible friendships among them, which ones
         ALREADY exist? How many?"
      3. "So node 0's clustering C₀ at k=4 is...?"
      4. "Now imagine this same k=4 ring has 1000 people instead of 12,
         everyone still with exactly 4 friends. Would C₀ change? Write it
         down: does clustering depend on N?"
      5. "But to reach someone on the OPPOSITE side of a 1000-person ring,
         about how many hops would it take, if each hop reaches k new
         people? Write down how L relates to N and to k — does it grow,
         shrink, or stay the same as each one changes?"
      6. "Photograph that page of working and upload it in the notebook —
         then tell me here when it's up. Or just type your reasoning to me,
         whichever is easier." (Then nb_view_image with widget
         "cp5_ring_paperwork_photo".)
    accept: |
      (1) k=2 -> C=0, with a reason (node 0's two friends aren't directly
      connected to each other — no triangle possible).
      (2)-(3) k=4 -> 3 of the 6 possible friendships already exist ->
      C₀ = 3/6 = 0.5 (must show the counting, not just the number).
      (4) Explicit statement that C does NOT depend on N (only on k).
      (5) Qualitative: L grows as N grows, L shrinks as k grows (exact
      constant not required — "roughly N divided by k" or "proportional to
      N/k" both pass).
      Photo of their paper work (cells/cp5_ring_paperwork.py), or typed
      reasoning as a fallback — same as cp4's photo/typed fallback.
    hints:
      - "At k=2, node 0's only two friends are its immediate left and right neighbor. Are THEY directly connected to each other, or two steps apart?"
      - "At k=4, node 0's friends are the two people on each side. Look only at pairs AMONG those 4 — ignore node 0 itself. Which pairs are close enough (1 or 2 steps apart) to already be friends?"
      - "If you swapped N=12 for N=1000 but kept k=4, would node 0's LOCAL neighborhood (its 4 friends) look any different?"
      - "Each hop reaches about k new people. To cross half the ring (about N/2 people), how many hops of size k does that take?"
    fresh_variants: |
      If an answer slips out, re-check with k=6 instead of k=4: 9 of the 15
      possible friendships already exist -> C₀ = 9/15 = 0.6.
    reveal_after: |
      Terminal: name the closed forms, crediting their own derivation —
      "you just found the k=4 term of a general formula": for a ring where
      everyone has k friends, clustering is C(k) = 3(k-2) / (4(k-1)) —
      independent of N — while path length is L(N,k) ≈ N / (2k), which
      DOES grow with N. That mismatch (C bounded, L unbounded as N grows)
      is exactly the puzzle the next checkpoint names.
    note: |
      ### 🔺 Clustering and path length on a ring — as formulas
      Three letters, in plain words: $N$ is how many people are in the ring,
      $k$ is how many friends each person has, $C$ is clustering — how often
      two of your friends know each other — and $L$ is the average distance,
      the typical number of steps between two people.

      On a ring where everyone has $k$ friends ($k/2$ per side), clustering
      is $C(k) = \frac{3(k-2)}{4(k-1)}$ — a function of $k$ ONLY, never $N$.
      $k=2$ gives $C=0$ (no triangles possible — cp4's plain ring); $k=4$
      gives $C=0.5$; $k=6$ gives $C=0.6$. Path length is different: it
      grows with the crowd, $L(N,k) \approx N / (2k)$ — more people, more
      hops, even though $k$ stays fixed.

      > **My work:** «their answers, verbatim»

  - id: cp5_tension
    goal: Student articulates the tension that makes small-world non-trivial,
          now grounded in the C(k)/L(N,k) facts just derived.
    build: none
    ask: |
      ONE world at a time: "So on a ring, C stays put but L keeps growing as
      N grows. Imagine a country-sized ring — everyone knows only their
      nearest few neighbors. What's good about living there, and what's
      bad?" After they answer, the RANDOM world (friends scattered
      completely at random) the same way.
    accept: |
      Ring: high, N-independent clustering / tight communities (good), path
      length that grows with N — long distances at country scale (bad).
      Random: short distances (good), essentially no clustering (bad). Any
      phrasing that captures both trade-offs, referencing the C(k)/L(N,k)
      facts from the last checkpoint, passes.
    hints:
      - "In the RING world, do your friends know each other? And per your own formula, what happens to L as the ring grows to country size?"
      - "In the RANDOM world, how fast can a letter travel? And do your friends know each other?"
    reveal_after: |
      Terminal, sharply: real social networks have BOTH high clustering AND
      short paths. Neither extreme world explains that. So how does nature
      do it?
    note: |
      ### ⚖️ The puzzle: clustered AND close?
      Same four letters as before: $C$ = clustering (how often two of your
      friends know each other), $L$ = average distance (typical number of
      steps between two people), $N$ = how many people there are, $k$ = how
      many friends each person has.

      **Ring world:** tight communities (high $C$, independent of $N$) but
      journeys that get longer and longer as $N$ grows ($L \approx N/(2k)$).
      **Random world:** short journeys (low $L$) but no community (low
      $C$). Real social networks somehow have BOTH high clustering and
      short paths — neither extreme world explains it.

      > **My take on the two worlds:** «their answer, verbatim»
