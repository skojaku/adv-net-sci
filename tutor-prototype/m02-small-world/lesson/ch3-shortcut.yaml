# Chapter 3 of 5 — One Extra Line (cp4, cp5_ring_formula, cp5_tension).
# The chapter title is deliberately vague: it is rendered as a visible
# notebook header and a terminal divider BEFORE cp4 asks where to put the
# cable, so it must not assert the chapter's conclusion.
# Follow checkpoints IN ORDER. Judge "accept" by meaning, not wording.
# "hints" are first rungs of a ladder — invent smaller rungs, never state answers.
# After logging the last checkpoint, call chapter_done with short handoff notes.

chapter:
  id: ch3
  title: "One Extra Line"
  goal: Student discovers that WHERE a link goes matters more than HOW MANY,
        derives on paper how clustering and path length scale with N and k on
        a ring, and can articulate the resulting tension.
checkpoints:

  - id: cp4_shortcut_drawing
    goal: Student discovers, with pen and paper, that WHERE a link goes matters
          more than HOW MANY links there are.
    build: |
      nb_add_template("cp4_upload") — the photo upload area
      (upload widget: cp4_photo).
    ask: |
      "Pen and paper time! 📝
      1. Draw 8 dots in a circle. Connect each dot to its neighbor on each
         side, so you get a ring.
      2. The two dots straight across from each other are 4 steps apart.
      3. You get ONE extra cable. Draw it where you think it shrinks travel
         distances across the whole ring the most.
      Photograph your drawing, drop it into the upload box in the notebook,
      and press the 📨 Send button under it — I'll see it straight away."
      ASK FOR THE PHOTO, nothing else. A typed description is accepted (see
      accept), but do NOT offer it up front — the drawing is the artifact.
      Only if they say they can't photograph do you fall back to "then tell
      me which two dots you connected, and why there."
    accept: |
      A long-range chord (opposite or near-opposite dots), with any reasoning
      about "connecting the far sides". The classic miss — connecting two dots
      that are already close — is NOT a fail: it is the perfect teaching
      moment (see reveal_after). Judge the reasoning, not the artwork.
    hints:
      - "Try your cable between two dots that are already close. Who benefits? Now try it between dots that are far apart. Who benefits now?"
      - "Which pair on your ring has the longest trip right now — and does your cable do anything at all for that pair?"
      - "Forget the whole ring for a second. Just you and the dot straight across: does your cable make YOUR trip to it shorter, or not?"
    fresh_variants: |
      If the answer slips out, run it again on a ring of 10 dots (opposite
      dots are 5 steps apart) — or on a 12-dot ring (opposite dots 6 apart)
      — and ask for TWO cables this time: "where do the two go, and why
      there?" Same discovery, new numbers, and the two-cable version makes
      them think about spacing rather than a single lucky choice.
    reveal_after: |
      nb_add_template("cp4_compare") — a radio-driven comparison: choosing
      "no cable / short cable / long cable" redraws the 8-ring and updates
      the average distance in the title.
      Terminal — the punchline, referencing THEIR cable, using the three
      numbers on screen (2.29 with no cable, 2.07 short, 1.96 long): ONE
      line either way, but the long one buys about half again as much. And
      the two do different jobs — a SHORT link closes a triangle
      (clustering up), a LONG one is a SHORTCUT that shortens trips right
      across the ring. On 8 dots the gap is modest; ask them what they'd
      expect on 800. This plain ring (each dot connects only to ITS TWO
      neighbors) has ZERO triangles before the cable — remember that, it
      matters next.
    note: |
      ### 🔌 One cable, two very different effects
      Same single line, two jobs. Between nearby dots it closes a
      **triangle** — clustering goes up. Across the ring it is a
      **shortcut** — trips get shorter for everyone at once. On this
      8-dot ring the average distance goes $2.29 \rightarrow 2.07$ with a
      short cable and $2.29 \rightarrow 1.96$ with a long one: about half
      again as much travel saved, from one line placed differently. WHERE
      a link goes matters more than HOW MANY links there are — and the
      bigger the ring, the wider that gap gets.

      > **My cable:** «which dots I connected, and why — written as mine,
      "I ran it from 0 to 4 because…". The placement comes from the drawing,
      so this slot is yours to describe; quote my reasoning word for word»

  - id: cp5_ring_formula
    goal: |
      Student derives, on paper, that a ring's clustering C depends only on
      the friend-count k (NOT on N), while its path length L depends on
      BOTH N and k — and explicitly corrects the "plain ring has no
      triangles" fact from cp4 into "a ring CAN have triangles once each
      person has more than 1 friend per side".
    build: |
      nb_add_template("cp5_ring_lattice") — a 12-dot ring with a friend-count
      slider k (2, 4, or 6); node 0 is rust and its k nearest neighbours are
      amber. It shows NO counts and NO clustering value: the counting is the
      student's job. The "check my count" box highlights the friendships
      among the amber dots — invite it only AFTER they have committed to a
      number, as a self-check.
      nb_add_template("cp5_ring_paperwork") — the photo upload area for their
      by-hand work (upload widget: cp5_ring_paperwork_photo).
    ask: |
      FIRST, before question 1, say what the whole checkpoint is: "Pen and
      paper out — everything you work out here goes on one page, and at the
      end you'll photograph it for me." Build BOTH templates now, so the
      upload area is waiting while they work. THE PAGE IS THE POINT: step 7
      is not optional, and no amount of good reasoning in the terminal
      replaces it.

      THEN, ONE piece at a time:
      1. "Set k to 2 — everyone knows only their 1 nearest neighbor each
         side, just like the ring you drew on paper. Can two of node 0's friends ever know
         each other here? Why or why not?"
      2. "Now set k to 4 — 2 friends each side. On paper, list node 0's 4
         friends. Of the 6 possible friendships among them, which ones
         ALREADY exist? How many?"
      3. "So node 0's clustering C₀ at k=4 is...?"
      4. "Now imagine this same k=4 ring has 1000 people instead of 12,
         everyone still with exactly 4 friends. Would C₀ change? Write it
         down: does clustering depend on N — the number of people in the
         ring?" (This is N's first appearance anywhere in the module, so
         say what it stands for the moment you write it.)
      5. "Now the OTHER measure. One hop along this ring carries you at most
         k/2 places around the circle — with k=4, two places. So on a
         1000-person ring, how many hops to reach the person straight
         across from you, half the ring away?"
         THEN STOP. This number is the checkpoint — do not work it out for
         them, out loud or in a scratchpad, and do not move to 6 until they
         have said one. The hints below exist for exactly this step.
      6. "That's the FARTHEST anyone has to go. The average trip, over all
         pairs, works out to about half of it. Write down how L relates to
         N and to k — does it grow, shrink, or stay put as each changes?"
      7. "Photograph that page of working, drop it into the upload box in the
         notebook, and press the 📨 Send button under it." (Their press
         starts your turn; then nb_view_image with widget
         "cp5_ring_paperwork_photo". If the photo does not show the work,
         ask them to redo it into the SAME box — it replaces the old one.)
         ASK FOR THE PHOTO, nothing else. Typed reasoning is accepted (see
         accept), but do NOT offer it up front — the derivation in their own
         hand is the artifact. Only if they say they can't photograph do you
         fall back to "then type me the two formulas and how you got them."
    accept: |
      (1) k=2 -> C=0, with a reason (node 0's two friends aren't directly
      connected to each other — no triangle possible).
      (2)-(3) k=4 -> 3 of the 6 possible friendships already exist ->
      C₀ = 3/6 = 0.5. They must show the counting, and the counting must add
      up: if they name fewer connected pairs than the total they claim, ask
      which pair they missed before accepting — a live run passed
      "-2&-1 connected, 1&2 connected ... so 3 out of 6" without noticing
      the third pair was never named.
      (4) Explicit statement that C does NOT depend on N (only on k).
      (5) The farthest trip is about N/k hops — half a ring (N/2 places)
      at k/2 places per hop. Accept 250 for N=1000, k=4, or "N over k".
      (6) L is about half of that: L ≈ N/(2k). Qualitative is enough —
      "grows with N, shrinks with k", or "roughly N over 2k". A student who
      only gets to N/k in (5) and stalls on the halving still passes (6) if
      they see L must be smaller than the farthest trip.
      Photo of their paper work (cells/cp5_ring_paperwork.py), or typed
      reasoning as a fallback — same as the drawing's photo/typed fallback.
    hints:
      - "At k=2, node 0's only two friends are its immediate left and right neighbor. Are THEY directly connected to each other, or two steps apart?"
      - "At k=4, node 0's friends are the two people on each side. Look only at pairs AMONG those 4 — ignore node 0 itself. Which pairs are close enough (1 or 2 steps apart) to already be friends?"
      - "If you swapped N=12 for N=1000 but kept k=4, would node 0's LOCAL neighborhood (its 4 friends) look any different?"
      - "Take it in two steps. First: half the ring is how many places? Second: one hop covers how many places? Now put the two together."
      - "You have the farthest trip. Most pairs are much closer than that — someone right next door is 1 hop. If the longest is that number and the shortest is 1, roughly where does the average sit?"
    fresh_variants: |
      Careful: the reveal puts the closed form C(k) = 3(k-2)/(4(k-1)) on
      screen, so asking for a ring's C at some new k is no longer a
      problem — it is substitution. A fresh round must ask for the COUNT
      instead: "the formula says C = 0.6 at k=6. Show me the counting
      behind it — how many friendships among node 0's 6 friends, out of how
      many possible?" (9 of 15.) Or move off the ring entirely and use the
      earlier clustering picture: Alice with 4 friends and 1 friendship
      among them -> 1 of 6.
    reveal_after: |
      Terminal: name the closed forms, crediting their own derivation —
      "you just found the k=4 term of a general formula": for a ring where
      everyone has k friends, clustering is C(k) = 3(k-2) / (4(k-1)) —
      independent of N — while the average path length is L(N,k) ≈ N/(2k),
      half the farthest trip they just worked out. (Check, N=1000 and k=4:
      farthest 250, average 125.4 — their N/k and N/2k both land.) That
      mismatch (C bounded, L unbounded as N grows) is exactly the puzzle
      the next checkpoint names.
    note: |
      ### 🔺 Clustering and path length on a ring — as formulas
      Four letters: $N$ = people in the ring, $k$ = friends each person
      has, $C$ = clustering (how often two of your friends know each
      other), $L$ = average distance (typical steps between two people).

      On a ring where everyone has $k$ friends ($k/2$ per side),
      $C(k) = \frac{3(k-2)}{4(k-1)}$ — a function of $k$ ONLY, never $N$
      ($k=2$ gives $C=0$; $k=4$ gives $C=0.5$). Path length grows with the
      crowd instead: the farthest trip is about $N/k$ hops, and the average
      about half that, $L \approx N/(2k)$.

      > **My work:** «their answers, verbatim»
      >
      > **On paper:** «what my photo of the derivation shows, written as
      mine — "I got N/k for the farthest trip". A photographed answer never
      reaches the transcript, so this slot is yours to describe»

  - id: cp5_tension
    goal: Student articulates the tension that makes small-world non-trivial,
          now grounded in the C(k)/L(N,k) facts just derived.
    build: none
    ask: |
      ONE world at a time, and point at THEIR two formulas each time —
      "what's good and bad about living there" on its own invites answers
      about peace and quiet, which are fine sentences and not this
      question.
      1. "Country-sized ring, say a million people, everyone knowing only
         their nearest few. Put your C formula on it first: do the people
         around you know each other?"
      2. Then, after they answer: "Now your L formula, same ring: how long
         does a message take to reach the far side?"
      3. Then the RANDOM world — everyone's friends scattered anywhere in
         the country: "Now L is tiny, a handful of steps to anyone. But
         what has happened to C — do your friends there know each other?"
      4. "So which of those two worlds is the one you actually live in?"
    accept: |
      (1)-(2) the RING world: C stays high however big it gets (tight
      neighbourhood), L grows with N (a message crawls).
      (3) the RANDOM world: L tiny, C near zero (no neighbourhood at all).
      Both trade-offs named, in any wording — the formulas do not have to be
      quoted, "your friends all know each other but nothing is nearby"
      passes for the ring, and (3) is a graded half, not a throwaway.
      (4) is a reality check, not a graded step: "neither / both" is the
      right instinct and is what sets up the next chapter. Do not press
      for a single answer.
    hints:
      - "In the RING world, do your friends know each other? And per your own formula, what happens to L as the ring grows to country size?"
      - "In the RANDOM world, how fast can a letter travel? And do your friends know each other?"
    fresh_variants: |
      If the answer slips out, ask for the same two-world comparison on a
      world they have not been handed: a 2000-person school where everyone
      knows the 30 people in their own year and nobody else. "Which of the
      two worlds is that closer to — and what does each of your formulas
      say about it?" (Ring-like: clustering high, because a year is a tight
      circle; distance large or worse, because nothing crosses between years.)
      Or, simpler: ask them to name one real network for EACH extreme —
      one that is clustered but slow to cross, one that is quick to cross
      with no communities at all.
    reveal_after: |
      Terminal, sharply: real social networks have BOTH high clustering AND
      short paths. Neither extreme world explains that. So how does nature
      do it?
    note: |
      ### ⚖️ The puzzle: clustered AND close?
      Same four letters as before: $C$ = clustering (how often two of your
      friends know each other), $L$ = average distance (typical number of
      steps between two people), $N$ = how many people there are, $k$ = how
      many friends each person has.

      **Ring world:** tight communities (high $C$, independent of $N$) but
      journeys that get longer and longer as $N$ grows ($L \approx N/(2k)$).
      **Random world:** short journeys (low $L$) but no community (low
      $C$). Real social networks somehow have BOTH high clustering and
      short paths — neither extreme world explains it.

      > **My take on the two worlds:** «their answers, verbatim»
