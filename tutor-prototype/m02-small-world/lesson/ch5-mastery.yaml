# Chapter 5 of 5 — Mastery Check (cp7-cp8). FINAL chapter.
# Follow checkpoints IN ORDER. Judge "accept" by meaning, not wording.
# "hints" are first rungs of a ladder — invent smaller rungs, never state answers.
# After cp8, chapter_done will tell you to run the Ending protocol (AGENTS.md).

chapter:
  id: ch5
  title: "Mastery Check"
  goal: Student can catch a flawed small-world claim and explain the
        phenomenon end to end.

checkpoints:

  - id: cp7_redteam
    goal: Student can catch a plausible-but-wrong small-world claim.
    build: none
    ask: |
      Quote this as a message from an AI assistant:
        "I analyzed your network. Its average clustering coefficient is 0.61,
         far higher than a random network's (0.01). Therefore this is a
         small-world network."
      "You're the reviewer who has to sign off on this. Do you? What would
      you check before signing?"
    accept: |
      Must notice that path length was never measured — high clustering alone
      is not enough. Gold answer cites the counterexample they already met:
      the p=0 ring (high clustering, LONG paths). Bonus: mentions comparing
      against a random baseline (the small-world index σ in the lecture notes).
    hints:
      - "Small-world needs TWO properties. The assistant measured how many?"
      - "You built a network in an earlier chapter with very high clustering and terrible distances. Which one?"
    fresh_variants: |
      If the answer slips out, hand them a SECOND flawed claim instead —
      same skill, new data:
      (a) "This 5000-person network has average path length 3.2, way below
      the 1200 you'd get on a ring. Therefore it's a small world." (Missing
      half: clustering was never measured — a purely random graph has short
      paths and no clustering at all.)
      (b) "Clustering is 0.61 and average path length is 3.4, so it's a small
      world." (Both measured, but neither compared to anything — 0.61 and
      3.4 mean nothing without the random baseline, which is what σ does.)
      Claim (a) is the mirror image of the scripted one; (b) is the harder
      step up. Judge exactly as above.
    reveal_after: |
      Terminal: verifying an AI's analysis requires knowing what the concept
      demands — exactly the skill this course grades. Point to the small-world
      index σ (clustering AND path length, both vs a random baseline) in the
      lecture notes as the proper check.
    note: |
      ### 🕵️ Reviewing an AI's claim
      "High clustering ⇒ small world" is NOT enough: small-world means BOTH
      high clustering AND short paths. My counterexample: the $p=0$ ring —
      very clustered, yet enormous distances. The proper check is the
      small-world index $\sigma$, one number that compares both $C$
      (clustering — how often two of your friends know each other) and $L$
      (average distance — the typical number of steps between two people)
      against a random network of the same size.

      > **My review of the AI's analysis:** «their answer, verbatim»

  - id: cp8_wrapup
    goal: Consolidation — student explains the phenomenon end to end.
    build: none
    ask: |
      "Last one. A friend asks: 'How can a letter cross a whole country in
      about six steps?' Explain it in about three sentences, your own words,
      no jargon required."
    accept: |
      Mentions (any wording): local links create clusters; a few long-range
      shortcuts exist; those shortcuts make everyone close. All three ->
      full pass. Two of three -> one gentle follow-up, then pass.
    hints:
      - "Take just the first sentence. Think about your own corner of the world: do most of your friends know each other?"
      - "Now the letter has to get OUT of that corner. Back in your drawing, which kind of cable moved it the farthest in one step?"
      - "Last sentence. Those far cables are rare — only about 1 in 100. Does the letter still need many steps once a few of them exist?"
    reveal_after: |
      This is the final checkpoint — call chapter_done, which will hand you
      the Ending protocol (session summary, congratulations, what's next:
      module m03 robustness and the σ index in the lecture notes). Remind
      them the notebook — the wave explorer, the cable comparison, the
      rewiring slider — is theirs to keep playing with.
    note: |
      ### 🎓 The whole story, in my own words
      > «their three-sentence explanation, verbatim»

      Local links make clusters; a few long-range shortcuts exist; those
      shortcuts pull everyone close. That's how a letter crosses a country
      in about six steps.
