<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modularity: Three Games</title>
    <style>
        body {
            margin: 0;
            padding: 16px 20px 0;
            font-family: 'Comic Sans MS', cursive;
            background-color: #000000;
            color: #ffffff;
        }
        h1 {
            text-align: center;
            margin: 0 0 14px;
        }
        .tabs {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .tabs button {
            font: inherit;
            font-size: 18px;
            padding: 8px 20px;
            background-color: #000000;
            color: #ffffff;
            border: 2px solid #555555;
            border-radius: 6px;
            cursor: pointer;
        }
        .tabs button[aria-selected="true"] {
            border-color: #FFD700;
            color: #FFD700;
        }
        .prompt {
            max-width: 760px;
            margin: 14px auto 0;
            text-align: center;
            font-size: 18px;
        }
        .restart {
            font: inherit;
            font-size: 14px;
            margin-left: 8px;
            padding: 2px 10px;
            background-color: #000000;
            color: #aaaaaa;
            border: 1px solid #555555;
            border-radius: 4px;
            cursor: pointer;
        }
        iframe {
            display: block;
            width: 860px;
            max-width: 100%;
            height: 1060px;
            margin: 0 auto;
            border: 0;
            background-color: #000000;
        }
    </style>
</head>
<body>
    <h1>🔍 Modularity: Three Games</h1>

    <div class="tabs" role="tablist">
        <button role="tab" data-tab="1">Game 1</button>
        <button role="tab" data-tab="2">Game 2</button>
        <button role="tab" data-tab="3">Game 3</button>
    </div>

    <section id="tab-1" role="tabpanel" hidden>
        <p class="prompt">
            You have four colors. Get Q as high as you can, then look at the groups you made.
            <button class="restart">↻ start over</button>
        </p>
        <iframe data-src="index.html?scoreType=modularity&numCommunities=4&randomness=1&dataFile=two-cliques.json" title="Game 1"></iframe>
    </section>

    <section id="tab-2" role="tabpanel" hidden>
        <p class="prompt">
            You have three colors. Get Q as high as you can, then look at the groups you made.
            <button class="restart">↻ start over</button>
        </p>
        <iframe data-src="index.html?scoreType=modularity&numCommunities=3&randomness=0.9&dataFile=two-cliques-big-clique.json" title="Game 2"></iframe>
    </section>

    <section id="tab-3" role="tabpanel" hidden>
        <p class="prompt">
            You have three colors. Get Q as high as you can, then look at the groups you made.
            <button class="restart">↻ start over</button>
        </p>
        <iframe data-src="index.html?scoreType=modularity&numCommunities=3&randomness=0.8&dataFile=random-net.json" title="Game 3"></iframe>
    </section>

    <script>
        // Each tab holds last year's game (index.html) with its original URL
        // parameters: Game 1 is "Four communities", Game 2 the resolution
        // limit, Game 3 a random network. Nothing a student sees (tab names,
        // prompts, the URL hash, the file name) says which is which.
        // A game loads the first time its tab opens and keeps its state when
        // the student switches tabs. The URL hash (#1, #2, #3) names the tab;
        // the panels' ids differ from it so the browser does not scroll the
        // tabs out of view when the page opens on a hash.
        const buttons = document.querySelectorAll(".tabs button");
        const panels = document.querySelectorAll("[role=tabpanel]");

        function fitHeight(frame) {
            try {
                frame.style.height = frame.contentDocument.documentElement.scrollHeight + 40 + "px";
            } catch (e) {
                // Opened from disk: the frame is not readable, keep the default height.
            }
        }

        function load(frame) {
            frame.onload = () => fitHeight(frame);
            frame.src = frame.dataset.src;
        }

        function show(id) {
            if (!document.getElementById("tab-" + id)) id = buttons[0].dataset.tab;
            buttons.forEach(b => b.setAttribute("aria-selected", b.dataset.tab === id));
            panels.forEach(p => {
                p.hidden = p.id !== "tab-" + id;
                const frame = p.querySelector("iframe");
                if (!p.hidden && !frame.getAttribute("src")) load(frame);
            });
            history.replaceState(null, "", "#" + id);
        }

        buttons.forEach(b => b.addEventListener("click", () => show(b.dataset.tab)));
        document.querySelectorAll(".restart").forEach(b =>
            b.addEventListener("click", () => load(b.closest("section").querySelector("iframe"))));
        show(location.hash.slice(1));
    </script>
</body>
</html>
