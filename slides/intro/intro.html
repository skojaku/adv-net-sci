<hr />
<div class="sub">A flu, a bank and the login program on your server fail in the same way, and that is not a coincidence</div>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-theme="0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6" lang="en-US" data-marpit-pagination="3" style="--paginate:true;--theme:0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6;" data-marpit-pagination-total="58">

  <div>Part 1: Introduction</div>
  <div class="count">01 / 04</div>
</div>
<h2 id="april-2009-a-new-flu-leaves-mexico">April 2009: a new flu leaves Mexico</h2>
<p>Nobody has immunity, and every border is a guess about where it goes next.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-marpit-fragments="4" data-paginate="true" data-class="mid" data-theme="0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6" lang="en-US" class="mid" data-marpit-pagination="6" style="--paginate:true;--class:mid;--theme:0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6;" data-marpit-pagination-total="58">
<h2 id="where-does-it-surface-first">Where does it surface first?</h2>
<hr />
<p>The 2009 H1N1 pandemic starts in Mexico. Name the first country outside Mexico with a confirmed case, and the second one.</p>
<ul>
<li data-marpit-fragment="1">Neighbours first, then outward in rings?</li>
<li data-marpit-fragment="2">The largest countries first?</li>
<li data-marpit-fragment="3">Something else?</li>
<li data-marpit-fragment="4"><em>Form a group and discuss. Thirty seconds.</em></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-class="mid" data-theme="0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6" lang="en-US" class="mid" data-marpit-pagination="7" style="--paginate:true;--class:mid;--theme:0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6;" data-marpit-pagination-total="58">
<h2 id="first-the-united-states-then-spain">First the United States. Then Spain.</h2>
<hr />
<p>Spain is nine thousand kilometres from Mexico City. Guatemala shares a border with Mexico, and was reached later.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-theme="0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6" lang="en-US" data-marpit-pagination="8" style="--paginate:true;--theme:0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6;" data-marpit-pagination-total="58">
<h2 id="kilometres-predict-nothing">Kilometres predict nothing</h2>
<hr />
<p>Arrival time against distance in kilometres. One dot per country.</p>
<div class="fig">
<p><img src="figures/flue-01.png" alt="" /></p>
<figcaption>A cloud, not a line, in all three panels (Brockmann and Helbing, Science, 2013).</figcaption>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-theme="0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6" lang="en-US" data-marpit-pagination="9" style="--paginate:true;--theme:0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6;" data-marpit-pagination-total="58">
<h2 id="flights-predict-it-exactly">Flights predict it exactly</h2>
<hr />
<p>The same arrival times, with distance now counted along air routes.</p>
<div class="fig">
<p><img src="figures/flue-02.png" alt="" /></p>
<figcaption>Same three panels, one axis changed, and every country falls on a line.</figcaption>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-theme="0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6" lang="en-US" data-marpit-pagination="10" style="--paginate:true;--theme:0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6;" data-marpit-pagination-total="58">

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-class="part" data-theme="0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6" lang="en-US" class="part" data-marpit-pagination="11" style="--paginate:true;--class:part;--theme:0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6;" data-marpit-pagination-total="58"><div class="band">
  <div>Part 2: The same story, everywhere</div>
  <div class="count">02 / 04</div>
</div>
<h2 id="epidemics-are-not-a-special-case">Epidemics are not a special case</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-marpit-fragments="3" data-paginate="true" data-theme="0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6" lang="en-US" data-marpit-pagination="12" style="--paginate:true;--theme:0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6;" data-marpit-pagination-total="58">
<h2 id="15-september-2008">15 September 2008</h2>
<hr />
<div class="cols">
<div>
<p>Lehman Brothers files for bankruptcy. One firm, out of thousands.</p>
<ul>
<li data-marpit-fragment="1">Within days, banks stop lending to each other worldwide.</li>
<li data-marpit-fragment="2">Why should one failure do that?</li>
<li data-marpit-fragment="3"><em>Form a group and discuss. Thirty seconds.</em></li>
</ul>
</div>
<div class="fig">
<p><img src="figures/lehman.jpg" alt="" /></p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-theme="0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6" lang="en-US" data-marpit-pagination="13" style="--paginate:true;--theme:0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6;" data-marpit-pagination-total="58">
<h2 id="banks-are-a-network">Banks are a network</h2>
<hr />
<p>Each dot is a bank; each line is money one bank owes another, due tomorrow morning.</p>
<div class="fig">
<p><img src="figures/interbank_1.png" alt="" /></p>
<figcaption>Your bank never lent Lehman a cent, and sees only its own neighbours.</figcaption>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-theme="0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6" lang="en-US" data-marpit-pagination="14" style="--paginate:true;--theme:0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6;" data-marpit-pagination-total="58">
<h2 id="the-default-walks">The default walks</h2>
<hr />
<p>Whoever lent to a failed bank is now missing money, and may fail in turn: <strong>cascading default</strong>.</p>
<div class="fig">
<p><img src="figures/interbank_2.png" alt="" /></p>
<figcaption>Red has failed. Nobody on the path saw the loss coming from four steps away.</figcaption>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-marpit-fragments="2" data-paginate="true" data-theme="0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6" lang="en-US" data-marpit-pagination="15" style="--paginate:true;--theme:0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6;" data-marpit-pagination-total="58">
<h2 id="29-march-2024">29 March 2024</h2>
<hr />
<div class="cols">
<div>
<p>A hobby project compresses files. One person maintains it, unpaid, for years.</p>
<ul>
<li data-marpit-fragment="1">How does a backdoor in that project reach the login program of nearly every Linux server on Earth?</li>
<li data-marpit-fragment="2"><em>Form a group and discuss. Thirty seconds.</em></li>
</ul>
</div>
<div class="fig">
<p><img src="figures/xkcd_dependency.png" alt="" /></p>
<figcaption>xkcd 2347, "Dependency".</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-theme="0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6" lang="en-US" data-marpit-pagination="16" style="--paginate:true;--theme:0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6;" data-marpit-pagination-total="58">
<h2 id="what-a-compression-library-touches">What a compression library touches</h2>
<hr />
<p>xz compresses files. Nothing about it is security-critical until you follow what links against it.</p>
<div class="fig">
<p><img src="figures/xz_1.png" alt="" /></p>
<figcaption>Each arrow reads "is built into". Four steps separate a compression library from the program that authenticates every remote login.</figcaption>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-theme="0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6" lang="en-US" data-marpit-pagination="17" style="--paginate:true;--theme:0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6;" data-marpit-pagination-total="58">
<h2 id="two-years-one-volunteer">Two years, one volunteer</h2>
<hr />
<p>Whoever maintains the first box in that chain controls everything downstream of it.</p>
<div class="fig">
<p><img src="figures/xz_2.png" alt="" /></p>
<figcaption>A new contributor helped for about two years, became a maintainer, and shipped hidden code in version 5.6.0 that reached sshd on Fedora and Debian test builds.</figcaption>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-theme="0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6" lang="en-US" data-marpit-pagination="18" style="--paginate:true;--theme:0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6;" data-marpit-pagination-total="58">
<h2 id="it-was-caught-by-half-a-second">It was caught by half a second</h2>
<hr />
<div class="fig">
<p><img src="figures/xz_3.png" alt="" /></p>
<figcaption>Andres Freund noticed logins to a test machine had slowed, went looking, and found the backdoor before it reached a stable release. Nobody had audited the trust; a stopwatch caught it.</figcaption>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-theme="0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6" lang="en-US" data-marpit-pagination="19" style="--paginate:true;--theme:0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6;" data-marpit-pagination-total="58">
<h2 id="how-the-backdoor-actually-worked">How the backdoor actually worked</h2>
<hr />
<div class="cols">
<div>
<p>A walk through the payload itself, if you want the detail.</p>
<p><a href="https://www.youtube.com/watch?v=aoag03mSuXQ">youtube.com/watch?v=aoag03mSuXQ</a></p>
</div>
<div class="fig">
<p><img src="figures/xz_video_thumb.jpg" alt="" /></p>
<figcaption>Click the link, or paste the id into YouTube.</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-theme="0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6" lang="en-US" data-marpit-pagination="20" style="--paginate:true;--theme:0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6;" data-marpit-pagination-total="58">
<h2 id="same-shape-three-worlds">Same shape, three worlds</h2>
<hr />
<p>Different material, one question: <strong>who is connected to whom?</strong></p>
<div class="fig">
<p><img src="figures/same_shape.png" alt="" /></p>
<figcaption>A virus travels the first, a loss the second, a backdoor the third. The reasoning that works on one works on the others.</figcaption>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-marpit-fragments="3" data-paginate="true" data-class="mid" data-theme="0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6" lang="en-US" class="mid" data-marpit-pagination="21" style="--paginate:true;--class:mid;--theme:0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6;" data-marpit-pagination-total="58">
<h2 id="your-turn-name-a-network">Your turn: name a network</h2>
<hr />
<ul>
<li data-marpit-fragment="1">Write down three networks you are part of right this minute.</li>
<li data-marpit-fragment="2">For each one, write one way it could fail.</li>
<li data-marpit-fragment="3"><em>One minute, on paper.</em></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-marpit-fragments="3" data-paginate="true" data-class="mid" data-theme="0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6" lang="en-US" class="mid" data-marpit-pagination="22" style="--paginate:true;--class:mid;--theme:0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6;" data-marpit-pagination-total="58">
<h2 id="lets-collect-a-few">Let's collect a few</h2>
<hr />
<p>Two failures, very different reach:</p>
<ul>
<li data-marpit-fragment="1">Your home router dies. You are offline; nobody else notices.</li>
<li data-marpit-fragment="2">Your bank's card processor dies. Every shop in town stops taking cards.</li>
<li data-marpit-fragment="3"><em>Which of yours is the router, and which is the processor?</em></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-theme="0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6" lang="en-US" data-marpit-pagination="23" style="--paginate:true;--theme:0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6;" data-marpit-pagination-total="58">
<h2 id="ones-that-are-easy-to-miss">Ones that are easy to miss</h2>
<hr />
<div class="cols">
<div>
<p>Remove one insect and the plants only it visits go with it.</p>
<p>Which plant here is safest? Which is one extinction away from trouble?</p>
</div>
<div class="fig">
<p><img src="figures/pollinator.png" alt="" /></p>
<figcaption>A line means that insect visits that plant.</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-theme="0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6" lang="en-US" data-marpit-pagination="24" style="--paginate:true;--theme:0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6;" data-marpit-pagination-total="58">
<h2 id="the-network-you-are-using-right-now">The network you are using right now</h2>
<hr />
<div class="cols">
<div>
<p>Eighty-six billion neurons. What you are following this sentence with is the wiring between them.</p>
</div>
<div class="fig">
<p><img src="figures/brain_tracts.jpg" alt="" /></p>
<figcaption>Long-distance fibre tracts of one human brain, reconstructed from diffusion MRI.</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-class="mid" data-theme="0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6" lang="en-US" class="mid" data-marpit-pagination="25" style="--paginate:true;--class:mid;--theme:0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6;" data-marpit-pagination-total="58">
<h2 id="four-more-with-their-failures">Four more, with their failures</h2>
<hr />
<ul>
<li>The power grid: one line sags into a tree in Ohio, and 50 million people lose power (2003).</li>
<li>Your gut: a few hundred bacterial species trading chemicals, and an antibiotic deletes nodes.</li>
<li>Shipping: one ship wedged in the Suez Canal, and European factories stop (2021).</li>
<li>Words: which word follows which, which is the only thing a language model ever sees.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-class="part" data-theme="0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6" lang="en-US" class="part" data-marpit-pagination="26" style="--paginate:true;--class:part;--theme:0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6;" data-marpit-pagination-total="58"><div class="band">
  <div>Part 3: What makes a network a network</div>
  <div class="count">03 / 04</div>
</div>
<h2 id="dots-and-lines-are-three-centuries-old">Dots and lines are three centuries old</h2>
<p>So what is new, and why does it need its own field?</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-marpit-fragments="3" data-paginate="true" data-theme="0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6" lang="en-US" data-marpit-pagination="27" style="--paginate:true;--theme:0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6;" data-marpit-pagination-total="58">
<h2 id="isnt-this-just-graph-theory">Isn't this just graph theory?</h2>
<hr />
<div class="cols">
<div>
<ul>
<li data-marpit-fragment="1">Mathematicians have studied dots and lines since Euler.</li>
<li data-marpit-fragment="2">Their favourite objects are regular: every node alike, every neighbourhood alike.</li>
<li data-marpit-fragment="3"><em>So what is left for us to do?</em></li>
</ul>
</div>
<div class="fig">
<p><img src="figures/regular_graph.png" alt="" /></p>
<figcaption>Every node here has the same neighbourhood, so one proof covers all of them.</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-theme="0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6" lang="en-US" data-marpit-pagination="28" style="--paginate:true;--theme:0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6;" data-marpit-pagination-total="58">
<h2 id="real-networks-are-not-like-that">Real networks are not like that</h2>
<hr />
<div class="cols">
<div>
<p>A handful of nodes carry an enormous share of the links. Most carry very few.</p>
<p>No two neighbourhoods look alike, so one proof no longer covers all of them.</p>
</div>
<div class="fig">
<p><img src="figures/internet_map.jpg" alt="" /></p>
<figcaption>Routed paths across the Internet, drawn by the Opte Project.</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-theme="0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6" lang="en-US" data-marpit-pagination="29" style="--paginate:true;--theme:0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6;" data-marpit-pagination-total="58">
<h2 id="for-2500-years-the-same-move">For 2500 years, the same move</h2>
<hr />
<p>Water, number, atoms, method: four attempts to reduce the world to something simpler.</p>
<div class="fig">
<p><img src="figures/philosophers.jpg" alt="" /></p>
<figcaption>Two millennia apart, one shared instinct: cut the world into its simplest parts.</figcaption>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-marpit-fragments="3" data-paginate="true" data-theme="0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6" lang="en-US" data-marpit-pagination="30" style="--paginate:true;--theme:0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6;" data-marpit-pagination-total="58">
<h2 id="the-reductionist-bet">The reductionist bet</h2>
<hr />
<div class="cols">
<div>
<ul>
<li data-marpit-fragment="1">Break the system into parts.</li>
<li data-marpit-fragment="2">Understand each part.</li>
<li data-marpit-fragment="3">Reassemble, and you understand the whole.</li>
</ul>
</div>
<div class="fig">
<p><img src="figures/digesting_duck.jpg" alt="" /></p>
<figcaption>Inside Vaucanson's duck, 1739: an automaton built to prove that digestion is clockwork.</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-marpit-fragments="3" data-paginate="true" data-theme="0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6" lang="en-US" data-marpit-pagination="31" style="--paginate:true;--theme:0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6;" data-marpit-pagination-total="58">
<h2 id="a-thought-experiment">A thought experiment</h2>
<hr />
<div class="cols">
<div>
<ul>
<li data-marpit-fragment="1">You are an alien scientist studying humans.</li>
<li data-marpit-fragment="2">You know every neuron and every synapse, exactly.</li>
<li data-marpit-fragment="3"><em>Can you say what this person will dream tonight?</em></li>
</ul>
</div>
<div class="fig">
<p><img src="figures/von_neumann.jpg" alt="" /></p>
<figcaption>John von Neumann, who was fond of this kind of question.</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-marpit-fragments="4" data-paginate="true" data-theme="0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6" lang="en-US" data-marpit-pagination="32" style="--paginate:true;--theme:0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6;" data-marpit-pagination-total="58">
<h2 id="knowing-the-parts-is-not-knowing-the-system">Knowing the parts is not knowing the system</h2>
<hr />
<div class="cols">
<div>
<ul>
<li data-marpit-fragment="1">Every neuron, but not the dream.</li>
<li data-marpit-fragment="2">Every person, but not the protest.</li>
<li data-marpit-fragment="3">Parts never act alone; they act on each other.</li>
<li data-marpit-fragment="4"><strong>The relationships are the object of study.</strong></li>
</ul>
</div>
<div class="fig">
<p><img src="figures/parts_vs_relations.png" alt="" /></p>
<figcaption>Same four parts in both rows. Only the lower row can carry anything between them.</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-theme="0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6" lang="en-US" data-marpit-pagination="33" style="--paginate:true;--theme:0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6;" data-marpit-pagination-total="58">
<h2 id="who-studied-relationships-first">Who studied relationships first?</h2>
<hr />
<div class="cols">
<div>
<p>In 1736 Euler was handed a puzzle about a walk through a city, and answered it by throwing the city away, keeping only what was connected to what.</p>
</div>
<div class="fig">
<p><img src="figures/euler.jpg" alt="" /></p>
<figcaption>Leonhard Euler, 1707–1783.</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-marpit-fragments="2" data-paginate="true" data-theme="0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6" lang="en-US" data-marpit-pagination="34" style="--paginate:true;--theme:0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6;" data-marpit-pagination-total="58">
<h2 id="seven-bridges-one-walk">Seven bridges, one walk</h2>
<hr />
<div class="cols">
<div>
<p>Königsberg had four landmasses joined by seven bridges.</p>
<ul>
<li data-marpit-fragment="1">Can you cross every bridge exactly once?</li>
<li data-marpit-fragment="2"><em>Two minutes, on paper.</em></li>
</ul>
</div>
<div class="fig">
<p><img src="figures/konigsberg.png" alt="" /></p>
<figcaption>Four landmasses, seven bridges, and nothing else about the city.</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-class="part" data-theme="0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6" lang="en-US" class="part" data-marpit-pagination="35" style="--paginate:true;--class:part;--theme:0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6;" data-marpit-pagination-total="58"><div class="band">
  <div>Part 4: How this course works</div>
  <div class="count">04 / 04</div>
</div>
<h2 id="the-rest-of-this-hour-is-logistics">The rest of this hour is logistics</h2>
<p>How the course is built, and why it is built that way.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-marpit-fragments="4" data-paginate="true" data-class="mid" data-theme="0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6" lang="en-US" class="mid" data-marpit-pagination="36" style="--paginate:true;--class:mid;--theme:0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6;" data-marpit-pagination-total="58">
<h2 id="what-you-will-be-able-to-do">What you will be able to do</h2>
<hr />
<ul>
<li data-marpit-fragment="1">Analyse real networks at real size.</li>
<li data-marpit-fragment="2">Use the concepts the field is built on.</li>
<li data-marpit-fragment="3">Apply AI tools to network problems, and check their answers.</li>
<li data-marpit-fragment="4">Read a network science paper, and design your own study.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-marpit-fragments="4" data-paginate="true" data-theme="0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6" lang="en-US" data-marpit-pagination="37" style="--paginate:true;--theme:0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6;" data-marpit-pagination-total="58">
<h2 id="learning-is-training">Learning is training</h2>
<hr />
<div class="cols">
<div>
<ul>
<li data-marpit-fragment="1">Nobody gets stronger by watching someone else lift.</li>
<li data-marpit-fragment="2">You get stronger by lifting, badly at first.</li>
<li data-marpit-fragment="3">Class is the gym: paper, pair programming, code that runs.</li>
<li data-marpit-fragment="4"><strong>Train until you can feel a concept</strong>, not just define it.</li>
</ul>
</div>
<div class="fig">
<p><img src="figures/deadlift.jpg" alt="" /></p>
<figcaption>The part that builds strength is the part that is hard.</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-marpit-fragments="3" data-paginate="true" data-class="mid" data-theme="0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6" lang="en-US" class="mid" data-marpit-pagination="38" style="--paginate:true;--class:mid;--theme:0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6;" data-marpit-pagination-total="58">
<h2 id="every-module-opens-on-paper">Every module opens on paper</h2>
<hr />
<div class="cols">
<div>
<ul>
<li data-marpit-fragment="1">You solve it alone first.</li>
<li data-marpit-fragment="2">Then you compare with the person beside you.</li>
<li data-marpit-fragment="3">Bring a pen.</li>
</ul>
</div>
<div class="fig">
<p><img src="figures/pen_paper.jpg" alt="" /></p>
<figcaption>No laptop for the first fifteen minutes: the mistake has to be yours before the fix means anything.</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-marpit-fragments="3" data-paginate="true" data-class="mid" data-theme="0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6" lang="en-US" class="mid" data-marpit-pagination="39" style="--paginate:true;--class:mid;--theme:0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6;" data-marpit-pagination-total="58">
<h2 id="play-it-before-you-learn-it">Play it before you learn it</h2>
<hr />
<ul>
<li data-marpit-fragment="1">Most modules ship an interactive game.</li>
<li data-marpit-fragment="2">Winning it needs the concept you have not been taught yet.</li>
<li data-marpit-fragment="3">You learn the concept by learning to win.</li>
</ul>
<p><a href="https://skojaku.github.io/adv-net-sci/assets/vis/vaccination-game.html">Open the vaccination game</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-marpit-fragments="4" data-paginate="true" data-class="mid" data-theme="0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6" lang="en-US" class="mid" data-marpit-pagination="40" style="--paginate:true;--class:mid;--theme:0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6;" data-marpit-pagination-total="58">
<h2 id="weekly-quiz">Weekly quiz</h2>
<hr />
<ul>
<li data-marpit-fragment="1">Every class opens with a short written quiz on last week. Online students submit through Brightspace.</li>
<li data-marpit-fragment="2">You work it out on paper, then submit through the course quiz form: the answers go in directly, and you photograph your working into the same form.</li>
<li data-marpit-fragment="3">Sign in with your Binghamton account. That is how the answer reaches your name.</li>
<li data-marpit-fragment="4">You may retake it, and your best attempt is the one that counts.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-marpit-fragments="4" data-paginate="true" data-class="mid" data-theme="0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6" lang="en-US" class="mid" data-marpit-pagination="41" style="--paginate:true;--class:mid;--theme:0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6;" data-marpit-pagination-total="58">
<h2 id="everything-is-handed-in-through-github">Everything is handed in through GitHub</h2>
<hr />
<ul>
<li data-marpit-fragment="1">You need a <strong>GitHub account</strong>, and you need to accept the invitation to the course organization. Until you do, no grade can reach you.</li>
<li data-marpit-fragment="2">Each assignment hands you a <strong>private repository</strong> of your own, through <strong>Classroom 50</strong>.</li>
<li data-marpit-fragment="3">You clone it, work in it, and <strong>push</strong> it back. Nothing is emailed and nothing is uploaded by hand.</li>
<li data-marpit-fragment="4">Two of them, from Module 2 on: one you do alone, one you do in a team.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-marpit-fragments="4" data-paginate="true" data-class="mid" data-theme="0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6" lang="en-US" class="mid" data-marpit-pagination="42" style="--paginate:true;--class:mid;--theme:0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6;" data-marpit-pagination-total="58">
<h2 id="pair-notebook-hand-in-the-conversation">Pair Notebook: hand in the conversation</h2>
<hr />
<ul>
<li data-marpit-fragment="1">One per module for modules 2 to 6, on your own.</li>
<li data-marpit-fragment="2">A module taught as a tutoring session: an <strong>AI tutor</strong> in your terminal, and a <strong>marimo</strong> notebook filling up beside it in your browser.</li>
<li data-marpit-fragment="3">Sixty to ninety minutes. Stop anywhere and pick it up later.</li>
<li data-marpit-fragment="4">What is read is how you reasoned, not whether your code ran. Needing hints is not penalized.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-marpit-fragments="4" data-paginate="true" data-class="mid" data-theme="0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6" lang="en-US" class="mid" data-marpit-pagination="43" style="--paginate:true;--class:mid;--theme:0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6;" data-marpit-pagination-total="58">
<h2 id="group-mini-project-the-same-ideas-on-real-data">Group Mini-Project: the same ideas, on real data</h2>
<hr />
<div class="note">
<p>Exactly one person accepts the assignment. Everybody else waits to be invited.</p>
</div>
<ul>
<li data-marpit-fragment="1">Teams of up to three, in class, for modules 2 to 6.</li>
<li data-marpit-fragment="2">One shared repository, <strong>autograded</strong> on every push, and one score for the whole team.</li>
<li data-marpit-fragment="3">Three teammates each clicking accept makes three one-person repositories that cannot be merged afterwards.</li>
<li data-marpit-fragment="4">Sort out who accepts before anyone clicks.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-marpit-fragments="4" data-paginate="true" data-class="mid" data-theme="0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6" lang="en-US" class="mid" data-marpit-pagination="44" style="--paginate:true;--class:mid;--theme:0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6;" data-marpit-pagination-total="58">
<h2 id="set-up-your-machine-once">Set up your machine, once</h2>
<hr />
<p>Twenty minutes, before the second week: <a href="https://skojaku.github.io/adv-net-sci/course/setup.html">skojaku.github.io/adv-net-sci/course/setup.html</a></p>
<ul>
<li data-marpit-fragment="1"><strong>git</strong> keeps the history of your work, and is what hands it in. On Windows, install <strong>Git for Windows</strong>: it brings Git Bash, a terminal that understands the same commands as a Mac.</li>
<li data-marpit-fragment="2"><strong>uv</strong> fetches Python and runs the notebooks, so you never install Python yourself.</li>
<li data-marpit-fragment="3"><strong>Node.js</strong> is what your AI tutor runs on.</li>
<li data-marpit-fragment="4">Your <strong>course API key</strong> arrives by email in the first week and goes in your shell profile.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-marpit-fragments="4" data-paginate="true" data-class="mid" data-theme="0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6" lang="en-US" class="mid" data-marpit-pagination="45" style="--paginate:true;--class:mid;--theme:0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6;" data-marpit-pagination-total="58">
<h2 id="student-lecture">Student Lecture</h2>
<hr />
<ul>
<li data-marpit-fragment="1">I publish a list of topics; you pick the one you like.</li>
<li data-marpit-fragment="2">You build a 15 to 20 minute lecture on it.</li>
<li data-marpit-fragment="3"><strong>An interactive part is required</strong>: a worksheet, an exercise the room does, live coding.</li>
<li data-marpit-fragment="4">A slide presentation on its own does not count.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-paginate="true" data-theme="0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6" lang="en-US" data-marpit-pagination="46" style="--paginate:true;--theme:0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6;" data-marpit-pagination-total="58">
<h2 id="where-the-grade-comes-from">Where the grade comes from</h2>
<hr />
<p>One square is one percent.</p>
<div class="fig">
<p><img src="figures/grading.png" alt="" /></p>
<figcaption>There are no bonus points this year: the hundred squares on this slide are the whole grade.</figcaption>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-marpit-fragments="4" data-paginate="true" data-class="mid" data-theme="0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6" lang="en-US" class="mid" data-marpit-pagination="47" style="--paginate:true;--class:mid;--theme:0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6;" data-marpit-pagination-total="58">
<h2 id="exam">Exam</h2>
<hr />
<ul>
<li data-marpit-fragment="1">One final exam covering all topics.</li>
<li data-marpit-fragment="2">Multiple choice, take-home.</li>
<li data-marpit-fragment="3">Submitted through Brightspace.</li>
<li data-marpit-fragment="4">Exam week: <strong>10 to 16 December 2026</strong>.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" data-marpit-fragments="3" data-paginate="true" data-class="mid" data-theme="0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6" lang="en-US" class="mid" data-marpit-pagination="48" style="--paginate:true;--class:mid;--theme:0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6;" data-marpit-pagination-total="58">
<h2 id="final-project">Final project</h2>
<hr />
<ul>
<li data-marpit-fragment="1">Individual, thirty percent of the grade.</li>
<li data-marpit-fragment="2">Anything in network science: a new method, a visualization, a case study, a literature review.</li>
<li data-marpit-fragment="3">Proposal <strong>Sun 27 Sep</strong> · presentations <strong>1 and 3 Dec</strong> · paper <strong>Sun 6 Dec</strong>.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" data-paginate="true" data-theme="0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6" lang="en-US" data-marpit-pagination="49" style="--paginate:true;--theme:0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6;" data-marpit-pagination-total="58">
<h2 id="from-a-previous-year-a-map-of-research-topics">From a previous year: a map of research topics</h2>
<hr />
<div class="cols">
<div>
<p>Papers are the nodes; a citation is a link.</p>
<p>Clusters are fields. The interesting papers are the ones sitting on a bridge between two of them.</p>
</div>
<div class="fig">
<p><img src="figures/sci-topic-net.png" alt="" /></p>
<figcaption>Each blob is a research community that nobody labelled in advance.</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="50" data-paginate="true" data-theme="0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6" lang="en-US" data-marpit-pagination="50" style="--paginate:true;--theme:0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6;" data-marpit-pagination-total="58">
<h2 id="from-a-previous-year-a-brain-wired-by-correlation">From a previous year: a brain, wired by correlation</h2>
<hr />
<div class="cols">
<div>
<p>Electrodes are the nodes. A link means two signals rise and fall together.</p>
<p>Nothing here is a physical wire; the network is inferred from the recording.</p>
</div>
<div class="fig">
<p><img src="figures/ecog.png" alt="" /></p>
<figcaption>Electrocorticography: electrodes resting directly on the cortex.</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="51" data-paginate="true" data-theme="0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6" lang="en-US" data-marpit-pagination="51" style="--paginate:true;--theme:0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6;" data-marpit-pagination-total="58">
<h2 id="from-a-previous-year-where-to-put-the-next-charger">From a previous year: where to put the next charger</h2>
<hr />
<div class="cols">
<div>
<p>Chargers are the nodes; a drivable hop is a link.</p>
<p>The question was which single new charger shortens the most journeys.</p>
</div>
<div class="fig">
<p><img src="figures/super-charger.png" alt="" /></p>
<figcaption>Tesla superchargers, with the road network as the thing that connects them.</figcaption>
</div>
</div>
</section>

<h2 id="where-everything-lives">Where everything lives</h2>
<hr />
<ul>
<li>Lecture notes: <a href="https://skojaku.github.io/adv-net-sci">skojaku.github.io/adv-net-sci</a></li>
<li>Everything else: <a href="https://github.com/skojaku/adv-net-sci/">github.com/skojaku/adv-net-sci</a></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="53" data-marpit-fragments="4" data-paginate="true" data-class="mid" data-theme="0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6" lang="en-US" class="mid" data-marpit-pagination="53" style="--paginate:true;--class:mid;--theme:0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6;" data-marpit-pagination-total="58">
<h2 id="discord">Discord</h2>
<hr />
<ul>
<li data-marpit-fragment="1">Questions about lectures, assignments and setup; announcements; finding teammates.</li>
<li data-marpit-fragment="2">Four channels: welcome, network-science, artifacts, random.</li>
<li data-marpit-fragment="3">Nothing on Discord is graded. Ask half-formed questions there; that is what it is for.</li>
<li data-marpit-fragment="4">The invitation link comes through Brightspace.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="54" data-paginate="true" data-class="mid" data-theme="0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6" lang="en-US" class="mid" data-marpit-pagination="54" style="--paginate:true;--class:mid;--theme:0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6;" data-marpit-pagination-total="58">
<h2 id="attendance">Attendance</h2>
<hr />
<ul>
<li>Attendance is taken every class.</li>
<li>Residential students: on paper, in the room.</li>
<li>Online students: the assignment submission in each module counts as your attendance.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="55" data-paginate="true" data-class="mid" data-theme="0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6" lang="en-US" class="mid" data-marpit-pagination="55" style="--paginate:true;--class:mid;--theme:0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6;" data-marpit-pagination-total="58">
<h2 id="missing-a-class">Missing a class</h2>
<hr />
<p>Two things, and you need both:</p>
<ul>
<li>Submit the absence form: <a href="https://forms.gle/yhzHoMSaKCRJXdGm7">forms.gle/yhzHoMSaKCRJXdGm7</a></li>
<li>Email me as well, ideally the day before.</li>
</ul>
<p><strong>An absence that is not on the form is not counted</strong>, however good the reason was.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="56" data-paginate="true" data-class="mid" data-theme="0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6" lang="en-US" class="mid" data-marpit-pagination="56" style="--paginate:true;--class:mid;--theme:0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6;" data-marpit-pagination-total="58">
<h2 id="policy">Policy</h2>
<hr />
<ul>
<li>Three credits means 6.5 or more hours of work a week outside class.</li>
<li>AI tools are allowed for learning; cite them when you use them in an assignment.</li>
<li>Back up your code; a lost laptop is not an extension.</li>
<li>Accommodations are available; academic dishonesty is not.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="57" data-marpit-fragments="3" data-paginate="true" data-class="mid" data-theme="0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6" lang="en-US" class="mid" data-marpit-pagination="57" style="--paginate:true;--class:mid;--theme:0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6;" data-marpit-pagination-total="58">
<h2 id="before-you-go">Before you go</h2>
<hr />
<p>Earlier you each wrote down three networks you belong to.</p>
<ul>
<li data-marpit-fragment="1">Which of them would you want to study for the project?</li>
<li data-marpit-fragment="2">What would you have to measure before you could say anything about it?</li>
<li data-marpit-fragment="3"><em>Bring one answer to the next class.</em></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="58" data-paginate="true" data-class="lead" data-theme="0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6" lang="en-US" class="lead" data-marpit-pagination="58" style="--paginate:true;--class:lead;--theme:0vb5dupt95yrg470vgjsjvmmrxinh4d5krnsj9h9pnr6;" data-marpit-pagination-total="58">
<h1 id="questions">Questions?</h1>
<hr />
<div class="sub">Next time: Euler, seven bridges, and the first proof about a network</div>
