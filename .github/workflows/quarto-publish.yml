on:
  workflow_dispatch:
  push:
    branches: main

name: Quarto Publish

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The note's SVGs are built, not committed. Without this the site renders
      # with broken image links.
      - name: Build figures
        run: |
          pip install -r tools/figures-requirements.txt
          bash tools/build_figures.sh

      - name: Render and Publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          path: lecture-note
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}