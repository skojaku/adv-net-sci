on:
  workflow_dispatch:
  push:
    branches: main

name: Quarto Publish

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The note's SVGs are built, not committed. Without this the site renders
      # with broken image links.
      - name: Build figures
        run: |
          pip install -r tools/figures-requirements.txt
          bash tools/build_figures.sh

      # --- pen-and-paper worksheets --------------------------------------
      # The PDFs are built here, not committed: a worksheet is regenerated
      # every time its .tex is touched, and thirteen binaries rewritten in
      # place are what makes a git repository heavy. `resources:` in
      # _quarto.yml copies whatever is on disk at render time, so the sheets
      # must exist before Quarto runs.
      #
      # The package set is the one the sheets \usepackage, plus:
      #   texlive-fonts-recommended  psnfss, and with it ZapfDingbats (pzdr).
      #                              Nothing asks for it by name, but hyperref
      #                              and tcolorbox between them do, and without
      #                              it xelatex drops into mktextfm and dies.
      #   texlive-fonts-extra        XCharter, which is the Charter m01 is set in.
      #
      # `--no-install-recommends` is deliberate: the full texlive-* recommends
      # graph is several gigabytes and pulls doc and source trees nobody reads.
      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-pictures \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texlive-plain-generic \
            latexmk \
            fontconfig

      # Excalifont is the house hand face and lives in tools/fonts/. Without
      # it every sheet falls back to Latin Modern and the printed worksheet
      # stops looking like the one on the instructor's laptop.
      - name: Install the house font
        run: |
          mkdir -p ~/.local/share/fonts
          cp tools/fonts/*.ttf ~/.local/share/fonts/
          fc-cache -f
          fc-list | grep -i excalifont
          # The two faces the sheets resolve to on a runner. Printed rather
          # than asserted: if either moves, the sheet still builds in some
          # other face and this line is what says which.
          kpsewhich XCharter-Roman.otf || echo "no XCharter under that name"
          kpsewhich pzdr.tfm || echo "no ZapfDingbats"

      # M01 and M02 are the modules whose sheets are published and linked from
      # the lecture note, so they are the ones whose build may fail the run.
      # Both halves of each go up — exercise and solutions — and `resources:`
      # in _quarto.yml copies whatever is on disk.
      - name: Build the published worksheets (m01, m02)
        run: |
          bash tools/build_worksheets.sh lecture-note/m01-euler_tour/pen-and-paper
          bash tools/build_worksheets.sh lecture-note/m02-small-world/pen-and-paper

      # M03-M09 are being reviewed and rewritten. They are still built, so a
      # sheet that stops compiling is visible in the log and its PDF can be
      # pulled from the artifact for proofreading — but a half-rewritten sheet
      # must not be able to block a publish.
      - name: Build the sheets under revision (m03-m09)
        continue-on-error: true
        run: bash tools/build_worksheets.sh lecture-note/m0[3-9]*/pen-and-paper

      - name: Collect every worksheet, published or not
        uses: actions/upload-artifact@v4
        with:
          name: pen-and-paper-worksheets
          path: lecture-note/m0*/pen-and-paper/*.pdf
          retention-days: 90

      # Everything else stays in the artifact and off the site: a sheet still
      # under revision must not be reachable from a link somebody found.
      - name: Publish the m01 and m02 sheets only
        run: |
          find lecture-note -path '*/pen-and-paper/*.pdf' \
               -not -path '*m01-euler_tour*' \
               -not -path '*m02-small-world*' -print -delete

      - name: Render and Publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          path: lecture-note
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
