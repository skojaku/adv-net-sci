# Links to the marimo notebooks that hold all executable code for this course.
#
# The lecture note itself contains no runnable code: it is prose, mathematics
# and static figures. Everything you actually run lives in a marimo notebook,
# and this file is the single place where those links are recorded.
#
# HOW TO FILL THIS IN
#   1. Convert the notebook:  marimo convert notebooks/<m>/coding.ipynb -o notebooks/<m>/coding.py
#   2. Upload it to https://molab.marimo.io
#   3. Paste the resulting URL below, replacing the TODO line.
#
# Pages refer to these as {{< var molab.m05 >}}, so once a URL is set here it is
# correct everywhere it appears. Anything still reading TODO points at this file
# so a reader who clicks it lands on an explanation rather than a 404.

molab:
  m01: TODO
  m01_sparse: TODO
  m02: "https://molab.marimo.io/notebooks/nb_G8bhHcHxi6um9CbHKwcq2d"
  m03: TODO
  m04: TODO
  m05: TODO
  m06: TODO
  m07: TODO
  m08: TODO
  m09: TODO
  m09_image: TODO
  m09_gcn: TODO

