</style></head><body><div class="bespoke-marp-osc"><button data-bespoke-marp-osc="prev" tabindex="-1" title="Previous slide">Previous slide</button><span data-bespoke-marp-osc="page"></span><button data-bespoke-marp-osc="next" tabindex="-1" title="Next slide">Next slide</button><button data-bespoke-marp-osc="fullscreen" tabindex="-1" title="Toggle fullscreen (f)">Toggle fullscreen</button><button data-bespoke-marp-osc="overview" tabindex="-1" title="Toggle overview view (o)">Toggle overview view</button><button data-bespoke-marp-osc="presenter" tabindex="-1" title="Open presenter view (p)">Open presenter view</button></div><div id=":$p"><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="1" data-paginate="true" data-class="lead" data-theme="it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r" lang="en-US" class="lead" data-marpit-pagination="1" style="--paginate:true;--class:lead;--theme:it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r;" data-marpit-pagination-total="91"><div class="eyebrow">Advanced Topics in Network Science · Module 02</div>
<h1 id="six-handshakes">Six Handshakes</h1>
<hr />
<div class="sub">Why the world is smaller than it has any right to be</div>
<div class="credit">Sadamori Kojaku · Binghamton University</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="2" data-paginate="true" data-class="mid" data-theme="it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r" lang="en-US" class="mid" data-marpit-pagination="2" style="--paginate:true;--class:mid;--theme:it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r;" data-marpit-pagination-total="91">
<h2 id="todays-question">Today's question</h2>
<hr />
<div class="formula">
<p>Why is a stranger on the other side of the world only about six handshakes away?</p>
</div>
<p><em>Write down your guess for the number now. We come back to it twice.</em></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-theme="it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r" lang="en-US" data-marpit-pagination="3" style="--paginate:true;--theme:it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r;" data-marpit-pagination-total="91">
<h2 id="roadmap-for-today">Roadmap for today</h2>
<hr />
<div class="steps-list">
<div><div class="i">01</div><div>The claim — a letter from Omaha, and 160 envelopes</div></div>
<div><div class="i">02</div><div>Measuring "six" — distance, average path length, diameter</div></div>
<div><div class="i">03</div><div>The other half — triangles and clustering</div></div>
<div><div class="i">04</div><div>The yardstick — a random baseline and the index sigma</div></div>
<div><div class="i">05</div><div>The mechanism — Watts–Strogatz rewiring</div></div>
<div><div class="i">06</div><div>Edge cases — the networks that break the definitions</div></div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-class="part" data-theme="it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r" lang="en-US" class="part" data-marpit-pagination="4" style="--paginate:true;--class:part;--theme:it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r;" data-marpit-pagination-total="91"><div class="band"><span>Part One</span><span class="count">01 / 06</span></div>
<h2 id="the-six-handshake-claim">The six-handshake claim</h2>
<p>A letter, a stranger, and 160 envelopes</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-theme="it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r" lang="en-US" data-marpit-pagination="5" style="--paginate:true;--theme:it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r;" data-marpit-pagination-total="91">
<h2 id="omaha-1967">Omaha, 1967</h2>
<hr />
<div class="cols">
<div>
<p>Stanley Milgram mails packets to people picked at random in Omaha, Nebraska and Wichita, Kansas.</p>
<p>Each packet names one target: a stockbroker who works in Boston.</p>
</div>
<div class="fig">
<p><img src="figures/milgram-map.png" alt="" style="width:520px;" /></p>
<figcaption>two thousand kilometres, and no address for the target</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-class="mid" data-theme="it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r" lang="en-US" class="mid" data-marpit-pagination="6" style="--paginate:true;--class:mid;--theme:it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r;" data-marpit-pagination-total="91">
<h2 id="the-one-rule">The one rule</h2>
<hr />
<div class="cols">
<div>
<p>You may not mail it to the target unless you know him personally.</p>
<p>Otherwise you pass it to <strong>one person you know on a first-name basis</strong> who might be closer.</p>
</div>
<div class="fig">
<p><img src="figures/milgram-rule.png" alt="" style="width:520px;" /></p>
<figcaption>every hop is a real acquaintance</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-class="mid" data-theme="it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r" lang="en-US" class="mid" data-marpit-pagination="7" style="--paginate:true;--class:mid;--theme:it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r;" data-marpit-pagination-total="91">
<h2 id="how-many-hands">How many hands?</h2>
<hr />
<p>A farmer in Omaha. A stockbroker outside Boston. Nothing in common.</p>
<div class="formula">
<p>How many people end up in the chain?</p>
</div>
<p><em>Hands up: two? six? twenty? a hundred?</em></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-theme="it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r" lang="en-US" data-marpit-pagination="8" style="--paginate:true;--theme:it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r;" data-marpit-pagination-total="91">
<h2 id="most-chains-died">Most chains died</h2>
<hr />
<p>Of the 160 packets that went out, 64 reached the target. The rest stalled somewhere in the middle of the country.</p>
<div class="fig tight">
<p><img src="figures/milgram-arrivals.png" alt="" style="width:1000px;" /></p>
<figcaption>red: the 64 completed chains — the only ones that carry data</figcaption>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-class="mid" data-theme="it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r" lang="en-US" class="mid" data-marpit-pagination="9" style="--paginate:true;--class:mid;--theme:it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r;" data-marpit-pagination-total="91">
<h2 id="the-ones-that-arrived-took-about-six-steps">The ones that arrived took about six steps</h2>
<hr />
<div class="fig">
<p><img src="figures/milgram-chain.png" alt="" style="width:1000px;" /></p>
<figcaption>one packet's route, hop by hop</figcaption>
</div>
<p>The median completed chain ran through roughly six links. Not sixty.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-class="mid" data-theme="it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r" lang="en-US" class="mid" data-marpit-pagination="10" style="--paginate:true;--class:mid;--theme:it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r;" data-marpit-pagination-total="91">
<h2 id="milgram-never-said-six-degrees">Milgram never said &quot;six degrees&quot;</h2>
<hr />
<div class="cols">
<div>
<p>The phrase belongs to the playwright <strong>John Guare</strong>, who used it as a title in 1990 — more than twenty years after the experiment.</p>
<div class="note">
<p>Milgram reported a median chain length. The slogan did the rest of the work.</p>
</div>
</div>
<div class="fig">
<p><img src="figures/six-degrees-timeline.png" alt="" style="width:520px;" /></p>
<figcaption>the result, then the phrase</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-class="mid" data-theme="it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r" lang="en-US" class="mid" data-marpit-pagination="11" style="--paginate:true;--class:mid;--theme:it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r;" data-marpit-pagination-total="91">
<h2 id="does-it-survive-eight-billion-people">Does it survive eight billion people?</h2>
<hr />
<p>1967: 160 letters, one target, one country.</p>
<div class="formula">
<p>Would the number grow if we ran it on the whole planet?</p>
</div>
<p><em>30 seconds with your neighbour — bigger, smaller, or the same?</em></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-marpit-fragments="3" data-paginate="true" data-theme="it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r" lang="en-US" data-marpit-pagination="12" style="--paginate:true;--theme:it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r;" data-marpit-pagination-total="91">
<h2 id="email-2003">Email, 2003</h2>
<hr />
<div class="cols">
<div>
<p>A Yahoo study restaged the experiment by email: <strong>more than 24,000 starters</strong>, 18 targets in 13 countries.</p>
<ul>
<li data-marpit-fragment="1">Only <strong>384</strong> chains completed.</li>
<li data-marpit-fragment="2">Those averaged about <strong>four</strong> steps.</li>
<li data-marpit-fragment="3">Correcting for the chains that died: five to seven.</li>
</ul>
</div>
<div class="fig">
<p><img src="figures/replication-yahoo.png" alt="" style="width:520px;" /></p>
<figcaption>the new measurement, in red</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-theme="it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r" lang="en-US" data-marpit-pagination="13" style="--paginate:true;--theme:it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r;" data-marpit-pagination-total="91">
<h2 id="facebook-2012">Facebook, 2012</h2>
<hr />
<div class="cols">
<div>
<p>Not a sample this time — the whole graph. <strong>721 million</strong> users and <strong>69 billion</strong> friendships, measured directly.</p>
<p>Average distance between two users: <strong>4.74</strong>.</p>
<p><em>Check that against the number you wrote down.</em></p>
</div>
<div class="fig">
<p><img src="figures/replication-facebook.png" alt="" style="width:520px;" /></p>
<figcaption>eight hundred times the people, still under five</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-theme="it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r" lang="en-US" data-marpit-pagination="14" style="--paginate:true;--theme:it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r;" data-marpit-pagination-total="91">
<h2 id="your-turn-wikirace">Your turn: Wikirace</h2>
<hr />
<div class="cols">
<div>
<p>Two random Wikipedia articles. Links only, no search box. Fewest clicks wins.</p>
<p>Play at <a href="https://wiki-race.com">wiki-race.com</a> — one round, then shout out your click count.</p>
</div>
<div class="fig">
<p><img src="figures/wikirace.png" alt="" style="width:520px;" /></p>
<figcaption>a route found by clicking, not by planning</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-class="mid" data-theme="it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r" lang="en-US" class="mid" data-marpit-pagination="15" style="--paginate:true;--class:mid;--theme:it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r;" data-marpit-pagination-total="91">
<h2 id="what-did-you-just-do">What did you just do?</h2>
<hr />
<p>You found a short route through a network of seven million articles — without ever seeing the network.</p>
<div class="formula">
<p>Is <em>finding</em> a short route the same as one <em>existing</em>?</p>
</div>
<p><em>30 seconds.</em></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-theme="it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r" lang="en-US" data-marpit-pagination="16" style="--paginate:true;--theme:it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r;" data-marpit-pagination-total="91">
<h2 id="finding-is-the-stronger-claim">Finding is the stronger claim</h2>
<hr />
<div class="fig tight">
<p><img src="figures/routing-vs-existence.png" alt="" style="width:1000px;" /></p>
<figcaption>red: a route that exists — the dashed box is everything the start node can actually see</figcaption>
</div>
<p>Milgram's subjects had no map. They <strong>routed</strong> on local knowledge alone, which is a harder thing than short routes merely existing.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-class="part" data-theme="it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r" lang="en-US" class="part" data-marpit-pagination="17" style="--paginate:true;--class:part;--theme:it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r;" data-marpit-pagination-total="91"><div class="band"><span>Part Two</span><span class="count">02 / 06</span></div>
<h2 id="measuring-six">Measuring &quot;six&quot;</h2>
<p>Turn the chain into a graph and count</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-class="mid" data-theme="it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r" lang="en-US" class="mid" data-marpit-pagination="18" style="--paginate:true;--class:mid;--theme:it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r;" data-marpit-pagination-total="91">
<h2 id="the-chain-is-a-graph">The chain is a graph</h2>
<hr />
<div class="fig">
<p><img src="figures/chain-graph.png" alt="" style="width:1000px;" /></p>
<figcaption>the same seven people from Part One</figcaption>
</div>
<p>Each person becomes a <strong>node</strong>; &quot;knows on a first-name basis&quot; becomes an <strong>edge</strong>. Everything else about them is gone.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-class="mid" data-theme="it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r" lang="en-US" class="mid" data-marpit-pagination="19" style="--paginate:true;--class:mid;--theme:it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r;" data-marpit-pagination-total="91">
<h2 id="distance">Distance</h2>
<hr />
<div class="cols">
<div>
<p>The <strong>distance</strong> <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>d</mi><mo stretchy="false">(</mo><mi>i</mi><mo separator="true">,</mo><mi>j</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">d(i,j)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal">d</span><span class="mopen">(</span><span class="mord mathnormal">i</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal" style="margin-right:0.0572em;">j</span><span class="mclose">)</span></span></span></span> is the number of <em>edges</em> on a shortest route between <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>i</mi></mrow><annotation encoding="application/x-tex">i</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6595em;"></span><span class="mord mathnormal">i</span></span></span></span> and <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>j</mi></mrow><annotation encoding="application/x-tex">j</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.854em;vertical-align:-0.1944em;"></span><span class="mord mathnormal" style="margin-right:0.0572em;">j</span></span></span></span>.</p>
<p>Not kilometres. Not people. Edges.</p>
</div>
<div class="fig">
<p><img src="figures/distance-def.png" alt="" style="width:520px;" /></p>
<figcaption>the same number in either direction</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-class="mid" data-theme="it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r" lang="en-US" class="mid" data-marpit-pagination="20" style="--paginate:true;--class:mid;--theme:it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r;" data-marpit-pagination-total="91">
<h2 id="what-is">What is <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>d</mi><mo stretchy="false">(</mo><mi>A</mi><mo separator="true">,</mo><mi>G</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">d(A,G)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal">d</span><span class="mopen">(</span><span class="mord mathnormal">A</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal">G</span><span class="mclose">)</span></span></span></span>?</h2>
<hr />
<div class="fig">
<p><img src="figures/chain-blank.png" alt="" style="width:1000px;" /></p>
<figcaption>ringed: the two ends of the chain</figcaption>
</div>
<p><em>Count the edges out loud, together.</em></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-class="mid" data-theme="it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r" lang="en-US" class="mid" data-marpit-pagination="21" style="--paginate:true;--class:mid;--theme:it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r;" data-marpit-pagination-total="91">
<h2 id="six">Six</h2>
<hr />
<div class="fig">
<p><img src="figures/distance-six.png" alt="" style="width:1000px;" /></p>
<figcaption>six edges from end to end</figcaption>
</div>
<p>Six edges, seven people. That is the number you wrote down at the start — and the shape the phrase &quot;six degrees&quot; describes.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-theme="it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r" lang="en-US" data-marpit-pagination="22" style="--paginate:true;--theme:it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r;" data-marpit-pagination-total="91">
<h2 id="a-shortcut-appears">A shortcut appears</h2>
<hr />
<div class="fig">
<p><img src="figures/chain-chord.png" alt="" style="width:1000px;" /></p>
<figcaption>red: one edge that was there all along</figcaption>
</div>
<p>It turns out the farmer already knew the teacher. One extra edge, no new people.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-theme="it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r" lang="en-US" data-marpit-pagination="23" style="--paginate:true;--theme:it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r;" data-marpit-pagination-total="91">
<h2 id="two-routes-one-distance">Two routes, one distance</h2>
<hr />
<div class="cols">
<div>
<p>Now there are two ways from <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>A</mi></mrow><annotation encoding="application/x-tex">A</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal">A</span></span></span></span> to <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>C</mi></mrow><annotation encoding="application/x-tex">C</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.0715em;">C</span></span></span></span> — one edge, or two.</p>
<p>Distance takes the <strong>minimum</strong>. The longer route still exists; it just does not count.</p>
</div>
<div class="fig">
<p><img src="figures/two-routes.png" alt="" style="width:520px;" /></p>
<figcaption>red: the shortest route — dashed gray: the route it replaces</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-class="mid" data-theme="it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r" lang="en-US" class="mid" data-marpit-pagination="24" style="--paginate:true;--class:mid;--theme:it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r;" data-marpit-pagination-total="91">
<h2 id="one-number-for-the-whole-network">One number for the whole network</h2>
<hr />
<p>Seven people make 21 pairs, and every pair has its own distance.</p>
<div class="formula">
<p>What single number would you report?</p>
</div>
<p><em>30 seconds with your neighbour.</em></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-theme="it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r" lang="en-US" data-marpit-pagination="25" style="--paginate:true;--theme:it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r;" data-marpit-pagination-total="91">
<h2 id="average-path-length">Average path length</h2>
<hr />
<div class="cols">
<div>
<p>The <strong>average path length</strong> <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mover accent="true"><mi>L</mi><mo>ˉ</mo></mover></mrow><annotation encoding="application/x-tex">\bar L</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8201em;"></span><span class="mord accent"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8201em;"><span style="top:-3em;"><span class="pstrut" style="height:3em;"></span><span class="mord mathnormal">L</span></span><span style="top:-3.2523em;"><span class="pstrut" style="height:3em;"></span><span class="accent-body" style="left:-0.2222em;"><span class="mord">ˉ</span></span></span></span></span></span></span></span></span></span> is the mean of <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>d</mi><mo stretchy="false">(</mo><mi>i</mi><mo separator="true">,</mo><mi>j</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">d(i,j)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal">d</span><span class="mopen">(</span><span class="mord mathnormal">i</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal" style="margin-right:0.0572em;">j</span><span class="mclose">)</span></span></span></span> over every pair of nodes.</p>
<p>For the plain chain: <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mover accent="true"><mi>L</mi><mo>ˉ</mo></mover><mo>=</mo><mn>8</mn><mi mathvariant="normal">/</mi><mn>3</mn><mo>=</mo><mn>2.67</mn></mrow><annotation encoding="application/x-tex">\bar L = 8/3 = 2.67</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8201em;"></span><span class="mord accent"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8201em;"><span style="top:-3em;"><span class="pstrut" style="height:3em;"></span><span class="mord mathnormal">L</span></span><span style="top:-3.2523em;"><span class="pstrut" style="height:3em;"></span><span class="accent-body" style="left:-0.2222em;"><span class="mord">ˉ</span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord">8/3</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">2.67</span></span></span></span>.</p>
</div>
<div class="fig">
<p><img src="figures/apl-chain.png" alt="" style="width:520px;" /></p>
<figcaption>one dot per pair — red: the mean</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-theme="it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r" lang="en-US" data-marpit-pagination="26" style="--paginate:true;--theme:it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r;" data-marpit-pagination-total="91">
<h2 id="one-more-shortcut">One more shortcut</h2>
<hr />
<div class="fig">
<p><img src="figures/chain-shortcut.png" alt="" style="width:1000px;" /></p>
<figcaption>black: the chord from two slides ago — red: the new long edge</figcaption>
</div>
<p>A second long edge, again with no new people. This is the whole small-world story in miniature.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-theme="it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r" lang="en-US" data-marpit-pagination="27" style="--paginate:true;--theme:it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r;" data-marpit-pagination-total="91">
<h2 id="the-average-collapses">The average collapses</h2>
<hr />
<div class="cols">
<div>
<p>Two extra edges out of 21 pairs, and <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mover accent="true"><mi>L</mi><mo>ˉ</mo></mover></mrow><annotation encoding="application/x-tex">\bar L</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8201em;"></span><span class="mord accent"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8201em;"><span style="top:-3em;"><span class="pstrut" style="height:3em;"></span><span class="mord mathnormal">L</span></span><span style="top:-3.2523em;"><span class="pstrut" style="height:3em;"></span><span class="accent-body" style="left:-0.2222em;"><span class="mord">ˉ</span></span></span></span></span></span></span></span></span></span> falls from 2.67 to 1.81.</p>
<div class="note">
<p>Notice which pairs moved: the far ones. The neighbours were already close.</p>
</div>
</div>
<div class="fig">
<p><img src="figures/apl-shortcut.png" alt="" style="width:520px;" /></p>
<figcaption>same axis as before — the tail is gone</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-theme="it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r" lang="en-US" data-marpit-pagination="28" style="--paginate:true;--theme:it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r;" data-marpit-pagination-total="91">
<h2 id="diameter">Diameter</h2>
<hr />
<div class="fig">
<p><img src="figures/diameter.png" alt="" style="width:1000px;" /></p>
<figcaption>red: the worst pair in the network</figcaption>
</div>
<p>The <strong>diameter</strong> is the largest distance in the network — the worst case, not the average.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-theme="it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r" lang="en-US" data-marpit-pagination="29" style="--paginate:true;--theme:it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r;" data-marpit-pagination-total="91">
<h2 id="your-turn-worksheet-a">Your turn: worksheet A</h2>
<hr />
<div class="fig">
<p><img src="figures/worksheet-a.png" alt="" style="width:1000px;" /></p>
<figcaption>the acquaintance network, unlabelled</figcaption>
</div>
<p>On paper: the three distances above, then the diameter of the whole network. <em>Four minutes.</em></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-theme="it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r" lang="en-US" data-marpit-pagination="30" style="--paginate:true;--theme:it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r;" data-marpit-pagination-total="91">
<h2 id="worksheet-a--check">Worksheet A — check</h2>
<hr />
<div class="fig">
<p><img src="figures/worksheet-a-answer.png" alt="" style="width:1000px;" /></p>
<figcaption>the four answers, on the network</figcaption>
</div>
<p>The diameter is the largest distance in the whole network — not the largest of the three you just computed.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-class="part" data-theme="it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r" lang="en-US" class="part" data-marpit-pagination="31" style="--paginate:true;--class:part;--theme:it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r;" data-marpit-pagination-total="91"><div class="band"><span>Part Three</span><span class="count">03 / 06</span></div>
<h2 id="the-other-half">The other half</h2>
<p>Short routes are only half of what makes a small world</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-class="mid" data-theme="it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r" lang="en-US" class="mid" data-marpit-pagination="32" style="--paginate:true;--class:mid;--theme:it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r;" data-marpit-pagination-total="91">
<h2 id="do-your-friends-know-each-other">Do your friends know each other?</h2>
<hr />
<p>Pick two of your friends at random.</p>
<div class="formula">
<p>What are the odds that those two know each other?</p>
</div>
<p><em>Compare with your neighbour — is your answer near zero, or nowhere near?</em></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-class="mid" data-theme="it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r" lang="en-US" class="mid" data-marpit-pagination="33" style="--paginate:true;--class:mid;--theme:it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r;" data-marpit-pagination-total="91">
<h2 id="triangles">Triangles</h2>
<hr />
<div class="cols">
<div>
<p>Three nodes, all three edges present: a <strong>triangle</strong>.</p>
</div>
<div class="fig">
<p><img src="figures/triangle-only.png" alt="" style="width:520px;" /></p>
<figcaption>the smallest closed thing a network can hold</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-theme="it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r" lang="en-US" data-marpit-pagination="34" style="--paginate:true;--theme:it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r;" data-marpit-pagination-total="91">
<h2 id="open-and-closed-triplets">Open and closed triplets</h2>
<hr />
<div class="cols">
<div>
<p>Two edges meeting at a node form a <strong>triplet</strong>, counted at that shared <strong>centre</strong> node.</p>
<p>Closed if the third edge is there, open if it is not.</p>
<p>So one triangle holds three closed triplets — one centred at each corner.</p>
</div>
<div class="fig">
<p><img src="figures/triangle-triplet.png" alt="" style="width:520px;" /></p>
<figcaption>closed and open, side by side</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-theme="it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r" lang="en-US" data-marpit-pagination="35" style="--paginate:true;--theme:it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r;" data-marpit-pagination-total="91">
<h2 id="one-neighbourhood">One neighbourhood</h2>
<hr />
<div class="cols">
<div>
<p>Node <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>A</mi></mrow><annotation encoding="application/x-tex">A</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal">A</span></span></span></span> has five friends.</p>
<p>The question is not about <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>A</mi></mrow><annotation encoding="application/x-tex">A</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal">A</span></span></span></span>'s edges. It is about the edges among those five.</p>
</div>
<div class="fig">
<p><img src="figures/ego-graph.png" alt="" style="width:520px;" /></p>
<figcaption>five friends, no links between them drawn yet</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-theme="it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r" lang="en-US" data-marpit-pagination="36" style="--paginate:true;--theme:it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r;" data-marpit-pagination-total="91">
<h2 id="how-many-pairs-could-be-linked">How many pairs could be linked?</h2>
<hr />
<div class="cols">
<div>
<p>Every dashed line is a friendship that <em>could</em> exist among <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>A</mi></mrow><annotation encoding="application/x-tex">A</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal">A</span></span></span></span>'s five friends.</p>
<p><em>Take 20 seconds — no formula, just count.</em></p>
</div>
<div class="fig">
<p><img src="figures/ego-pairs.png" alt="" style="width:520px;" /></p>
<figcaption>count them</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-marpit-fragments="1" data-paginate="true" data-theme="it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r" lang="en-US" data-marpit-pagination="37" style="--paginate:true;--theme:it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r;" data-marpit-pagination-total="91">
<h2 id="ten">Ten</h2>
<hr />
<div class="cols">
<div>
<p>With <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>k</mi></mrow><annotation encoding="application/x-tex">k</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6944em;"></span><span class="mord mathnormal" style="margin-right:0.0315em;">k</span></span></span></span> friends there are</p>
<p><span class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mrow><mo fence="true">(</mo><mfrac linethickness="0px"><mi>k</mi><mn>2</mn></mfrac><mo fence="true">)</mo></mrow><mo>=</mo><mfrac><mrow><mi>k</mi><mo stretchy="false">(</mo><mi>k</mi><mo>−</mo><mn>1</mn><mo stretchy="false">)</mo></mrow><mn>2</mn></mfrac></mrow><annotation encoding="application/x-tex">\binom{k}{2} = \frac{k(k-1)}{2} 
</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:2.4em;vertical-align:-0.95em;"></span><span class="mord"><span class="mopen delimcenter" style="top:0em;"><span class="delimsizing size3">(</span></span><span class="mfrac"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:1.3714em;"><span style="top:-2.314em;"><span class="pstrut" style="height:3em;"></span><span class="mord"><span class="mord">2</span></span></span><span style="top:-3.677em;"><span class="pstrut" style="height:3em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0315em;">k</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.686em;"><span></span></span></span></span></span><span class="mclose delimcenter" style="top:0em;"><span class="delimsizing size3">)</span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:2.113em;vertical-align:-0.686em;"></span><span class="mord"><span class="mopen nulldelimiter"></span><span class="mfrac"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:1.427em;"><span style="top:-2.314em;"><span class="pstrut" style="height:3em;"></span><span class="mord"><span class="mord">2</span></span></span><span style="top:-3.23em;"><span class="pstrut" style="height:3em;"></span><span class="frac-line" style="border-bottom-width:0.04em;"></span></span><span style="top:-3.677em;"><span class="pstrut" style="height:3em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0315em;">k</span><span class="mopen">(</span><span class="mord mathnormal" style="margin-right:0.0315em;">k</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">−</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mord">1</span><span class="mclose">)</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.686em;"><span></span></span></span></span></span><span class="mclose nulldelimiter"></span></span></span></span></span></span></p><p>possible edges among them.</p>
<ul>
<li data-marpit-fragment="1">Here: <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>5</mn><mo>×</mo><mn>4</mn><mi mathvariant="normal">/</mi><mn>2</mn><mo>=</mo><mn>10</mn></mrow><annotation encoding="application/x-tex">5 \times 4 / 2 = 10</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.7278em;vertical-align:-0.0833em;"></span><span class="mord">5</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">×</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord">4/2</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">10</span></span></span></span>.</li>
</ul>
</div>
<div class="fig">
<p><img src="figures/ego-pairs-count.png" alt="" style="width:520px;" /></p>
<figcaption>the dashed lines are possibilities, not edges</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-marpit-fragments="1" data-paginate="true" data-theme="it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r" lang="en-US" data-marpit-pagination="38" style="--paginate:true;--theme:it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r;" data-marpit-pagination-total="91">
<h2 id="local-clustering-coefficient">Local clustering coefficient</h2>
<hr />
<div class="cols">
<div>
<div class="formula">
<p><span class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>C</mi><mi>i</mi></msub><mo>=</mo><mfrac><mrow><mtext>edges among </mtext><mi>i</mi><mtext>’s neighbours</mtext></mrow><mrow><msub><mi>k</mi><mi>i</mi></msub><mo stretchy="false">(</mo><msub><mi>k</mi><mi>i</mi></msub><mo>−</mo><mn>1</mn><mo stretchy="false">)</mo><mi mathvariant="normal">/</mi><mn>2</mn></mrow></mfrac></mrow><annotation encoding="application/x-tex">C_i = \frac{\text{edges among } i\text{&#x27;s neighbours}}{k_i(k_i-1)/2} 
</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0715em;">C</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3117em;"><span style="top:-2.55em;margin-left:-0.0715em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">i</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:2.3074em;vertical-align:-0.936em;"></span><span class="mord"><span class="mopen nulldelimiter"></span><span class="mfrac"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:1.3714em;"><span style="top:-2.314em;"><span class="pstrut" style="height:3em;"></span><span class="mord"><span class="mord"><span class="mord mathnormal" style="margin-right:0.0315em;">k</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3117em;"><span style="top:-2.55em;margin-left:-0.0315em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">i</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mopen">(</span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0315em;">k</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3117em;"><span style="top:-2.55em;margin-left:-0.0315em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">i</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">−</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mord">1</span><span class="mclose">)</span><span class="mord">/2</span></span></span><span style="top:-3.23em;"><span class="pstrut" style="height:3em;"></span><span class="frac-line" style="border-bottom-width:0.04em;"></span></span><span style="top:-3.677em;"><span class="pstrut" style="height:3em;"></span><span class="mord"><span class="mord text"><span class="mord">edges among </span></span><span class="mord mathnormal">i</span><span class="mord text"><span class="mord">’s neighbours</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.936em;"><span></span></span></span></span></span><span class="mclose nulldelimiter"></span></span></span></span></span></span></p></div>
<ul>
<li data-marpit-fragment="1">Count the edges that do exist among the neighbours, then divide by every pair that could have been there.</li>
</ul>
</div>
<div class="fig">
<p><img src="figures/ego-clustering.png" alt="" style="width:520px;" /></p>
<figcaption>red: the two that exist — gray: the eight that do not</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-class="mid" data-theme="it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r" lang="en-US" class="mid" data-marpit-pagination="39" style="--paginate:true;--class:mid;--theme:it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r;" data-marpit-pagination-total="91">
<h2 id="back-to-the-matrix">Back to the matrix</h2>
<hr />
<p>In Module 01 we found that <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo stretchy="false">(</mo><msup><mi mathvariant="bold">A</mi><mn>2</mn></msup><msub><mo stretchy="false">)</mo><mrow><mi>i</mi><mi>j</mi></mrow></msub></mrow><annotation encoding="application/x-tex">(\mathbf{A}^2)_{ij}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1.1002em;vertical-align:-0.2861em;"></span><span class="mopen">(</span><span class="mord"><span class="mord mathbf">A</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8141em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">2</span></span></span></span></span></span></span></span><span class="mclose"><span class="mclose">)</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3117em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight" style="margin-right:0.0572em;">ij</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.2861em;"><span></span></span></span></span></span></span></span></span></span> counts walks of length two from <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>i</mi></mrow><annotation encoding="application/x-tex">i</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6595em;"></span><span class="mord mathnormal">i</span></span></span></span> to <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>j</mi></mrow><annotation encoding="application/x-tex">j</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.854em;vertical-align:-0.1944em;"></span><span class="mord mathnormal" style="margin-right:0.0572em;">j</span></span></span></span>.</p>
<div class="formula">
<p>So what does the <em>diagonal</em> entry <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo stretchy="false">(</mo><msup><mi mathvariant="bold">A</mi><mn>3</mn></msup><msub><mo stretchy="false">)</mo><mrow><mi>i</mi><mi>i</mi></mrow></msub></mrow><annotation encoding="application/x-tex">(\mathbf{A}^3)_{ii}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1.0641em;vertical-align:-0.25em;"></span><span class="mopen">(</span><span class="mord"><span class="mord mathbf">A</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8141em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">3</span></span></span></span></span></span></span></span><span class="mclose"><span class="mclose">)</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3117em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight">ii</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span> count?</p>
</div>
<p><em>30 seconds.</em></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-theme="it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r" lang="en-US" data-marpit-pagination="40" style="--paginate:true;--theme:it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r;" data-marpit-pagination-total="91">
<h2 id="closed-walks-of-length-three">Closed walks of length three</h2>
<hr />
<div class="cols">
<div>
<p>A closed 3-walk from <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>i</mi></mrow><annotation encoding="application/x-tex">i</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6595em;"></span><span class="mord mathnormal">i</span></span></span></span> can only be a triangle through <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>i</mi></mrow><annotation encoding="application/x-tex">i</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6595em;"></span><span class="mord mathnormal">i</span></span></span></span> — and every triangle can be walked two ways.</p>
</div>
<div class="fig">
<p><img src="figures/a3-walks.png" alt="" style="width:520px;" /></p>
<figcaption>red one way round, gold the other</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-theme="it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r" lang="en-US" data-marpit-pagination="41" style="--paginate:true;--theme:it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r;" data-marpit-pagination-total="91">
<h2 id="clustering-in-matrix-form">Clustering, in matrix form</h2>
<hr />
<div class="cols">
<div>
<p>Each triangle is counted twice, and the denominator doubles to match:</p>
<div class="formula">
<p><span class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>C</mi><mi>i</mi></msub><mo>=</mo><mfrac><mrow><mo stretchy="false">(</mo><msup><mi mathvariant="bold">A</mi><mn>3</mn></msup><msub><mo stretchy="false">)</mo><mrow><mi>i</mi><mi>i</mi></mrow></msub></mrow><mrow><msub><mi>k</mi><mi>i</mi></msub><mo stretchy="false">(</mo><msub><mi>k</mi><mi>i</mi></msub><mo>−</mo><mn>1</mn><mo stretchy="false">)</mo></mrow></mfrac></mrow><annotation encoding="application/x-tex">C_i = \frac{(\mathbf{A}^3)_{ii}}{k_i(k_i-1)} 
</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0715em;">C</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3117em;"><span style="top:-2.55em;margin-left:-0.0715em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">i</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:2.4271em;vertical-align:-0.936em;"></span><span class="mord"><span class="mopen nulldelimiter"></span><span class="mfrac"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:1.4911em;"><span style="top:-2.314em;"><span class="pstrut" style="height:3em;"></span><span class="mord"><span class="mord"><span class="mord mathnormal" style="margin-right:0.0315em;">k</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3117em;"><span style="top:-2.55em;margin-left:-0.0315em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">i</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mopen">(</span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0315em;">k</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3117em;"><span style="top:-2.55em;margin-left:-0.0315em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">i</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">−</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mord">1</span><span class="mclose">)</span></span></span><span style="top:-3.23em;"><span class="pstrut" style="height:3em;"></span><span class="frac-line" style="border-bottom-width:0.04em;"></span></span><span style="top:-3.677em;"><span class="pstrut" style="height:3em;"></span><span class="mord"><span class="mopen">(</span><span class="mord"><span class="mord mathbf">A</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8141em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">3</span></span></span></span></span></span></span></span><span class="mclose"><span class="mclose">)</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3117em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight">ii</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.936em;"><span></span></span></span></span></span><span class="mclose nulldelimiter"></span></span></span></span></span></span></p></div>
</div>
<div class="fig">
<p><img src="figures/a3-formula.png" alt="" style="width:520px;" /></p>
<figcaption>one triangle, degree two</figcaption>
</div>
</div>
</section>

<h2 id="averaging-over-nodes">Averaging over nodes</h2>
<hr />
<div class="fig">
<p><img src="figures/cbar-milgram.png" alt="" style="width:1000px;" /></p>
<figcaption>the seven people from Part One, again</figcaption>
</div>
<p>The <strong>average local clustering</strong> <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mover accent="true"><mi>C</mi><mo>ˉ</mo></mover><mo>=</mo><mfrac><mn>1</mn><mi>n</mi></mfrac><msub><mo>∑</mo><mi>i</mi></msub><msub><mi>C</mi><mi>i</mi></msub></mrow><annotation encoding="application/x-tex">\bar C = \frac{1}{n}\sum_i C_i</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8201em;"></span><span class="mord accent"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8201em;"><span style="top:-3em;"><span class="pstrut" style="height:3em;"></span><span class="mord mathnormal" style="margin-right:0.0715em;">C</span></span><span style="top:-3.2523em;"><span class="pstrut" style="height:3em;"></span><span class="accent-body" style="left:-0.1667em;"><span class="mord">ˉ</span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1.1901em;vertical-align:-0.345em;"></span><span class="mord"><span class="mopen nulldelimiter"></span><span class="mfrac"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.8451em;"><span style="top:-2.655em;"><span class="pstrut" style="height:3em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight">n</span></span></span></span><span style="top:-3.23em;"><span class="pstrut" style="height:3em;"></span><span class="frac-line" style="border-bottom-width:0.04em;"></span></span><span style="top:-3.394em;"><span class="pstrut" style="height:3em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">1</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.345em;"><span></span></span></span></span></span><span class="mclose nulldelimiter"></span></span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mop"><span class="mop op-symbol small-op" style="position:relative;top:0em;">∑</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.162em;"><span style="top:-2.4003em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">i</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.2997em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0715em;">C</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3117em;"><span style="top:-2.55em;margin-left:-0.0715em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">i</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span> gives every node the same weight — hub or leaf.</p>
</section>

<h2 id="a-windmill">A windmill</h2>
<hr />
<div class="fig">
<p><img src="figures/windmill-cbar.png" alt="" style="width:1000px;" /></p>
<figcaption>ten blade nodes, one hub</figcaption>
</div>
<ul>
<li data-marpit-fragment="1">Every blade node sees a perfectly closed neighbourhood; the hub sees almost none.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-class="mid" data-theme="it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r" lang="en-US" class="mid" data-marpit-pagination="44" style="--paginate:true;--class:mid;--theme:it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r;" data-marpit-pagination-total="91">
<h2 id="is-092-a-fair-summary">Is 0.92 a fair summary?</h2>
<hr />
<p>Ten nodes with <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>C</mi><mi>i</mi></msub><mo>=</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">C_i = 1</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0715em;">C</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3117em;"><span style="top:-2.55em;margin-left:-0.0715em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">i</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">1</span></span></span></span> outvote one hub with <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>C</mi><mi>i</mi></msub><mo>=</mo><mn>1</mn><mi mathvariant="normal">/</mi><mn>9</mn></mrow><annotation encoding="application/x-tex">C_i = 1/9</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0715em;">C</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3117em;"><span style="top:-2.55em;margin-left:-0.0715em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">i</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord">1/9</span></span></span></span>.</p>
<div class="formula">
<p>Would you call this network 92% clustered?</p>
</div>
<p><em>Turn to your neighbour. What is the average hiding?</em></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-marpit-fragments="1" data-paginate="true" data-theme="it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r" lang="en-US" data-marpit-pagination="45" style="--paginate:true;--theme:it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r;" data-marpit-pagination-total="91">
<h2 id="global-clustering">Global clustering</h2>
<hr />
<p>Count objects instead of averaging nodes: <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>C</mi><mo>=</mo><mn>3</mn><mo>×</mo><mi mathvariant="normal">#</mi><mtext>triangles</mtext><mtext> </mtext><mi mathvariant="normal">/</mi><mtext> </mtext><mi mathvariant="normal">#</mi><mtext>triplets</mtext></mrow><annotation encoding="application/x-tex">C = 3 \times \#\text{triangles} \,/\, \#\text{triplets}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.0715em;">C</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.7278em;vertical-align:-0.0833em;"></span><span class="mord">3</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">×</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord">#</span><span class="mord text"><span class="mord">triangles</span></span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord">/</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord">#</span><span class="mord text"><span class="mord">triplets</span></span></span></span></span>.</p>
<div class="fig tight">
<p><img src="figures/transitivity-def.png" alt="" style="width:1000px;" /></p>
</div>
<ul>
<li data-marpit-fragment="1">For the windmill that comes to <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>15</mn><mi mathvariant="normal">/</mi><mn>55</mn><mo>=</mo><mn>0.27</mn></mrow><annotation encoding="application/x-tex">15/55 = 0.27</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord">15/55</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">0.27</span></span></span></span>.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-marpit-fragments="2" data-paginate="true" data-theme="it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r" lang="en-US" data-marpit-pagination="46" style="--paginate:true;--theme:it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r;" data-marpit-pagination-total="91">

<hr />
<div class="fig">

</div>
<ul>
<li data-marpit-fragment="1"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mover accent="true"><mi>C</mi><mo>ˉ</mo></mover></mrow><annotation encoding="application/x-tex">\bar C</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8201em;"></span><span class="mord accent"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8201em;"><span style="top:-3em;"><span class="pstrut" style="height:3em;"></span><span class="mord mathnormal" style="margin-right:0.0715em;">C</span></span><span style="top:-3.2523em;"><span class="pstrut" style="height:3em;"></span><span class="accent-body" style="left:-0.1667em;"><span class="mord">ˉ</span></span></span></span></span></span></span></span></span></span> weights nodes: the blades outvote the hub.</li>
<li data-marpit-fragment="2"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>C</mi></mrow><annotation encoding="application/x-tex">C</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.0715em;">C</span></span></span></span> weights triplets: the hub owns most of them.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-paginate="true" data-theme="it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r" lang="en-US" data-marpit-pagination="47" style="--paginate:true;--theme:it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r;" data-marpit-pagination-total="91">

<li data-marpit-fragment="2"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>C</mi><mi>B</mi></msub><mo>=</mo><mn>1</mn><mi mathvariant="normal">/</mi><mn>3</mn></mrow><annotation encoding="application/x-tex">C_B = 1/3</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0715em;">C</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3283em;"><span style="top:-2.55em;margin-left:-0.0715em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight" style="margin-right:0.0502em;">B</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord">1/3</span></span></span></span> — one of <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>B</mi></mrow><annotation encoding="application/x-tex">B</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.0502em;">B</span></span></span></span>'s three pairs is closed</li>
<li data-marpit-fragment="3"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>C</mi><mi>D</mi></msub><mo>=</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">C_D = 0</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0715em;">C</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3283em;"><span style="top:-2.55em;margin-left:-0.0715em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight" style="margin-right:0.0278em;">D</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">0</span></span></span></span> — <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>D</mi></mrow><annotation encoding="application/x-tex">D</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.0278em;">D</span></span></span></span>'s friends are strangers</li>
</ul>

<h2 id="the-paradox">The paradox</h2>
<hr />
<div class="fig tight">
<p><img src="figures/paradox.png" alt="" style="width:1000px;" /></p>

</div>
<p>High clustering means your edges stay local. Local wiring should put the far side of the world many, many hops away. Facebook measures 4.74.</p>

<h2 id="score-it-naively">Score it naively</h2>
<hr />
<p>Small-world means high <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mover accent="true"><mi>C</mi><mo>ˉ</mo></mover></mrow><annotation encoding="application/x-tex">\bar C</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8201em;"></span><span class="mord accent"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8201em;"><span style="top:-3em;"><span class="pstrut" style="height:3em;"></span><span class="mord mathnormal" style="margin-right:0.0715em;">C</span></span><span style="top:-3.2523em;"><span class="pstrut" style="height:3em;"></span><span class="accent-body" style="left:-0.1667em;"><span class="mord">ˉ</span></span></span></span></span></span></span></span></span></span> and low <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mover accent="true"><mi>L</mi><mo>ˉ</mo></mover></mrow><annotation encoding="application/x-tex">\bar L</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8201em;"></span><span class="mord accent"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8201em;"><span style="top:-3em;"><span class="pstrut" style="height:3em;"></span><span class="mord mathnormal">L</span></span><span style="top:-3.2523em;"><span class="pstrut" style="height:3em;"></span><span class="accent-body" style="left:-0.2222em;"><span class="mord">ˉ</span></span></span></span></span></span></span></span></span></span>, so try the obvious index:</p>
<div class="formula">
<p><span class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>s</mi><mo>=</mo><mover accent="true"><mi>C</mi><mo>ˉ</mo></mover><mi mathvariant="normal">/</mi><mover accent="true"><mi>L</mi><mo>ˉ</mo></mover><mspace width="2em"/><mtext>high is small-world?</mtext></mrow><annotation encoding="application/x-tex">s = \bar C / \bar L \qquad \text{high is small-world?} 
</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal">s</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1.0701em;vertical-align:-0.25em;"></span><span class="mord accent"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8201em;"><span style="top:-3em;"><span class="pstrut" style="height:3em;"></span><span class="mord mathnormal" style="margin-right:0.0715em;">C</span></span><span style="top:-3.2523em;"><span class="pstrut" style="height:3em;"></span><span class="accent-body" style="left:-0.1667em;"><span class="mord">ˉ</span></span></span></span></span></span></span><span class="mord">/</span><span class="mord accent"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8201em;"><span style="top:-3em;"><span class="pstrut" style="height:3em;"></span><span class="mord mathnormal">L</span></span><span style="top:-3.2523em;"><span class="pstrut" style="height:3em;"></span><span class="accent-body" style="left:-0.2222em;"><span class="mord">ˉ</span></span></span></span></span></span></span><span class="mspace" style="margin-right:2em;"></span><span class="mord text"><span class="mord">high is small-world?</span></span></span></span></span></span></p></div>
<p><em>30 seconds: find a network that breaks this.</em></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="52" data-paginate="true" data-theme="it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r" lang="en-US" data-marpit-pagination="52" style="--paginate:true;--theme:it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r;" data-marpit-pagination-total="91">
<h2 id="the-complete-graph-breaks-it">The complete graph breaks it</h2>
<hr />
<div class="cols">
<div>
<p>Join every pair, and the naive index hits <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>s</mi><mo>=</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">s = 1</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal">s</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">1</span></span></span></span> — the largest value it can take.</p>
<p>For the least interesting network there is.</p>
</div>
<div class="fig">
<p><img src="figures/complete-graph.png" alt="" style="width:520px;" /></p>
<figcaption>maximum score, zero insight</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="53" data-paginate="true" data-theme="it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r" lang="en-US" data-marpit-pagination="53" style="--paginate:true;--theme:it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r;" data-marpit-pagination-total="91">
