<h2 id="erd%C5%91s%E2%80%93r%C3%A9nyi">Erdős–Rényi <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>G</mi><mo stretchy="false">(</mo><mi>n</mi><mo separator="true">,</mo><mi>p</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">G(n,p)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal">G</span><span class="mopen">(</span><span class="mord mathnormal">n</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal">p</span><span class="mclose">)</span></span></span></span></h2>
<hr />
<div class="cols">
<div>
<p>So we need a structureless network of the same size to compare against.</p>
<p>Take <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>n</mi></mrow><annotation encoding="application/x-tex">n</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal">n</span></span></span></span> nodes and connect each pair independently with probability <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>p</mi></mrow><annotation encoding="application/x-tex">p</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.625em;vertical-align:-0.1944em;"></span><span class="mord mathnormal">p</span></span></span></span>.</p>
</div>
<div class="fig">
<p><img src="figures/er-coin.png" alt="" style="width:520px;" /></p>
<figcaption>red: the pairs whose coin came up heads</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="54" data-paginate="true" data-class="mid" data-theme="it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r" lang="en-US" class="mid" data-marpit-pagination="54" style="--paginate:true;--class:mid;--theme:it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r;" data-marpit-pagination-total="91">
<h2 id="what-is-in-a-random-graph">What is <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>C</mi><mi>i</mi></msub></mrow><annotation encoding="application/x-tex">C_i</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0715em;">C</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3117em;"><span style="top:-2.55em;margin-left:-0.0715em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">i</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span> in a random graph?</h2>
<hr />
<p>Node <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>i</mi></mrow><annotation encoding="application/x-tex">i</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6595em;"></span><span class="mord mathnormal">i</span></span></span></span> has <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>k</mi></mrow><annotation encoding="application/x-tex">k</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6944em;"></span><span class="mord mathnormal" style="margin-right:0.0315em;">k</span></span></span></span> neighbours, so <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>k</mi><mo stretchy="false">(</mo><mi>k</mi><mo>−</mo><mn>1</mn><mo stretchy="false">)</mo><mi mathvariant="normal">/</mi><mn>2</mn></mrow><annotation encoding="application/x-tex">k(k-1)/2</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.0315em;">k</span><span class="mopen">(</span><span class="mord mathnormal" style="margin-right:0.0315em;">k</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">−</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord">1</span><span class="mclose">)</span><span class="mord">/2</span></span></span></span> pairs among them.</p>
<div class="formula">
<p>What fraction of those pairs do you expect to be linked?</p>
</div>
<p><em>30 seconds. Does the answer depend on <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>k</mi></mrow><annotation encoding="application/x-tex">k</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6944em;"></span><span class="mord mathnormal" style="margin-right:0.0315em;">k</span></span></span></span>?</em></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="55" data-paginate="true" data-theme="it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r" lang="en-US" data-marpit-pagination="55" style="--paginate:true;--theme:it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r;" data-marpit-pagination-total="91">
<h2 id=""><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>C</mi><mrow><mi mathvariant="normal">r</mi><mi mathvariant="normal">a</mi><mi mathvariant="normal">n</mi><mi mathvariant="normal">d</mi></mrow></msub><mo>=</mo><mi>p</mi></mrow><annotation encoding="application/x-tex">C_{\mathrm{rand}} = p</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0715em;">C</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3361em;"><span style="top:-2.55em;margin-left:-0.0715em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight"><span class="mord mathrm mtight">rand</span></span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.625em;vertical-align:-0.1944em;"></span><span class="mord mathnormal">p</span></span></span></span></h2>
<hr />
<div class="cols">
<div>
<p>Each neighbour pair is its own independent coin with the same <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>p</mi></mrow><annotation encoding="application/x-tex">p</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.625em;vertical-align:-0.1944em;"></span><span class="mord mathnormal">p</span></span></span></span>, so the expected fraction is <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>p</mi></mrow><annotation encoding="application/x-tex">p</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.625em;vertical-align:-0.1944em;"></span><span class="mord mathnormal">p</span></span></span></span> — whatever the degree.</p>
<p>A node has <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>n</mi><mo>−</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">n-1</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6667em;vertical-align:-0.0833em;"></span><span class="mord mathnormal">n</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">−</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">1</span></span></span></span> coins of its own, so its <strong>average degree</strong> is <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo stretchy="false">⟨</mo><mi>k</mi><mo stretchy="false">⟩</mo><mo>=</mo><mi>p</mi><mo stretchy="false">(</mo><mi>n</mi><mo>−</mo><mn>1</mn><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\langle k \rangle = p(n-1)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">⟨</span><span class="mord mathnormal" style="margin-right:0.0315em;">k</span><span class="mclose">⟩</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal">p</span><span class="mopen">(</span><span class="mord mathnormal">n</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">−</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord">1</span><span class="mclose">)</span></span></span></span>:</p>
<div class="formula">
<p><span class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>C</mi><mrow><mi mathvariant="normal">r</mi><mi mathvariant="normal">a</mi><mi mathvariant="normal">n</mi><mi mathvariant="normal">d</mi></mrow></msub><mo>=</mo><mi>p</mi><mo>=</mo><mfrac><mrow><mo stretchy="false">⟨</mo><mi>k</mi><mo stretchy="false">⟩</mo></mrow><mrow><mi>n</mi><mo>−</mo><mn>1</mn></mrow></mfrac></mrow><annotation encoding="application/x-tex">C_{\mathrm{rand}} = p = \frac{\langle k \rangle}{n-1} 
</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0715em;">C</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3361em;"><span style="top:-2.55em;margin-left:-0.0715em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight"><span class="mord mathrm mtight">rand</span></span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.625em;vertical-align:-0.1944em;"></span><span class="mord mathnormal">p</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:2.1963em;vertical-align:-0.7693em;"></span><span class="mord"><span class="mopen nulldelimiter"></span><span class="mfrac"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:1.427em;"><span style="top:-2.314em;"><span class="pstrut" style="height:3em;"></span><span class="mord"><span class="mord mathnormal">n</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">−</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mord">1</span></span></span><span style="top:-3.23em;"><span class="pstrut" style="height:3em;"></span><span class="frac-line" style="border-bottom-width:0.04em;"></span></span><span style="top:-3.677em;"><span class="pstrut" style="height:3em;"></span><span class="mord"><span class="mopen">⟨</span><span class="mord mathnormal" style="margin-right:0.0315em;">k</span><span class="mclose">⟩</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.7693em;"><span></span></span></span></span></span><span class="mclose nulldelimiter"></span></span></span></span></span></span></p></div>
</div>
<div class="fig">
<p><img src="figures/er-clustering.png" alt="" style="width:520px;" /></p>
<figcaption>ten pairs, ten independent coins</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="56" data-paginate="true" data-class="mid" data-theme="it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r" lang="en-US" class="mid" data-marpit-pagination="56" style="--paginate:true;--class:mid;--theme:it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r;" data-marpit-pagination-total="91">
<h2 id="how-far-can-150-friends-reach">How far can 150 friends reach?</h2>
<hr />
<p>Everyone on Earth has about 150 acquaintances, wired at random.</p>
<div class="formula">
<p>After <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>L</mi></mrow><annotation encoding="application/x-tex">L</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal">L</span></span></span></span> steps, how many people have you reached?</p>
</div>
<p><em>30 seconds — say it as a formula, not a number.</em></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="57" data-paginate="true" data-theme="it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r" lang="en-US" data-marpit-pagination="57" style="--paginate:true;--theme:it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r;" data-marpit-pagination-total="91">
<h2 id="the-fan-out">The fan-out</h2>
<hr />
<div class="fig tight">
<p><img src="figures/fanout.png" alt="" style="width:1000px;" /></p>
<figcaption>one step reaches k friends, two steps k squared</figcaption>
</div>
<p>In a sparse random graph you almost never come back to someone you have met, so the count multiplies at every step.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="58" data-paginate="true" data-theme="it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r" lang="en-US" data-marpit-pagination="58" style="--paginate:true;--theme:it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r;" data-marpit-pagination-total="91">
<h2 id="four-and-a-half-steps">Four and a half steps</h2>
<hr />
<p>Set <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo stretchy="false">⟨</mo><mi>k</mi><msup><mo stretchy="false">⟩</mo><mi>L</mi></msup><mo>=</mo><mi>n</mi></mrow><annotation encoding="application/x-tex">\langle k \rangle^L = n</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1.0913em;vertical-align:-0.25em;"></span><span class="mopen">⟨</span><span class="mord mathnormal" style="margin-right:0.0315em;">k</span><span class="mclose"><span class="mclose">⟩</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8413em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">L</span></span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal">n</span></span></span></span> and solve: <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>L</mi><mrow><mi mathvariant="normal">r</mi><mi mathvariant="normal">a</mi><mi mathvariant="normal">n</mi><mi mathvariant="normal">d</mi></mrow></msub><mo>≈</mo><mi>ln</mi><mo>⁡</mo><mi>n</mi><mi mathvariant="normal">/</mi><mi>ln</mi><mo>⁡</mo><mo stretchy="false">⟨</mo><mi>k</mi><mo stretchy="false">⟩</mo></mrow><annotation encoding="application/x-tex">L_{\mathrm{rand}} \approx \ln n / \ln \langle k \rangle</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal">L</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3361em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight"><span class="mord mathrm mtight">rand</span></span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">≈</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mop">ln</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal">n</span><span class="mord">/</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mop">ln</span><span class="mopen">⟨</span><span class="mord mathnormal" style="margin-right:0.0315em;">k</span><span class="mclose">⟩</span></span></span></span>.</p>
<div class="fig tight">
<p><img src="figures/fanout-solve.png" alt="" style="width:1000px;" /></p>
<figcaption>red: the world's population, at 150 friends each</figcaption>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="59" data-paginate="true" data-theme="it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r" lang="en-US" data-marpit-pagination="59" style="--paginate:true;--theme:it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r;" data-marpit-pagination-total="91">
<h2 id="short-is-free-clustered-is-not">Short is free. Clustered is not.</h2>
<hr />
<div class="cols">
<div>
<p>Randomness hands you short routes for nothing — and hands you almost no triangles, because <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>C</mi><mrow><mi mathvariant="normal">r</mi><mi mathvariant="normal">a</mi><mi mathvariant="normal">n</mi><mi mathvariant="normal">d</mi></mrow></msub><mo>=</mo><mo stretchy="false">⟨</mo><mi>k</mi><mo stretchy="false">⟩</mo><mi mathvariant="normal">/</mi><mo stretchy="false">(</mo><mi>n</mi><mo>−</mo><mn>1</mn><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">C_{\mathrm{rand}} = \langle k \rangle/(n-1)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0715em;">C</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3361em;"><span style="top:-2.55em;margin-left:-0.0715em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight"><span class="mord mathrm mtight">rand</span></span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">⟨</span><span class="mord mathnormal" style="margin-right:0.0315em;">k</span><span class="mclose">⟩</span><span class="mord">/</span><span class="mopen">(</span><span class="mord mathnormal">n</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">−</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord">1</span><span class="mclose">)</span></span></span></span> goes to zero as the network grows.</p>
<p>That is why the two properties together are surprising, and why <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mover accent="true"><mi>L</mi><mo>ˉ</mo></mover></mrow><annotation encoding="application/x-tex">\bar L</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8201em;"></span><span class="mord accent"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8201em;"><span style="top:-3em;"><span class="pstrut" style="height:3em;"></span><span class="mord mathnormal">L</span></span><span style="top:-3.2523em;"><span class="pstrut" style="height:3em;"></span><span class="accent-body" style="left:-0.2222em;"><span class="mord">ˉ</span></span></span></span></span></span></span></span></span></span> alone proves nothing.</p>
</div>
<div class="fig">
<p><img src="figures/free-vs-not.png" alt="" style="width:520px;" /></p>
<figcaption>twelve nodes wired at random</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="60" data-paginate="true" data-class="mid" data-theme="it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r" lang="en-US" class="mid" data-marpit-pagination="60" style="--paginate:true;--class:mid;--theme:it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r;" data-marpit-pagination-total="91">
<h2 id="the-small-world-index">The small-world index</h2>
<hr />
<div class="cols">
<div>
<p>Normalise both halves against that random baseline:</p>
<div class="formula">
<p><span class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>σ</mi><mo>=</mo><mfrac><mrow><mi>C</mi><mi mathvariant="normal">/</mi><msub><mi>C</mi><mrow><mi mathvariant="normal">r</mi><mi mathvariant="normal">a</mi><mi mathvariant="normal">n</mi><mi mathvariant="normal">d</mi></mrow></msub></mrow><mrow><mi>L</mi><mi mathvariant="normal">/</mi><msub><mi>L</mi><mrow><mi mathvariant="normal">r</mi><mi mathvariant="normal">a</mi><mi mathvariant="normal">n</mi><mi mathvariant="normal">d</mi></mrow></msub></mrow></mfrac></mrow><annotation encoding="application/x-tex">\sigma = \frac{C/C_{\mathrm{rand}}}{L/L_{\mathrm{rand}}} 
</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">σ</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:2.363em;vertical-align:-0.936em;"></span><span class="mord"><span class="mopen nulldelimiter"></span><span class="mfrac"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:1.427em;"><span style="top:-2.314em;"><span class="pstrut" style="height:3em;"></span><span class="mord"><span class="mord mathnormal">L</span><span class="mord">/</span><span class="mord"><span class="mord mathnormal">L</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3361em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight"><span class="mord mathrm mtight">rand</span></span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span><span style="top:-3.23em;"><span class="pstrut" style="height:3em;"></span><span class="frac-line" style="border-bottom-width:0.04em;"></span></span><span style="top:-3.677em;"><span class="pstrut" style="height:3em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0715em;">C</span><span class="mord">/</span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0715em;">C</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3361em;"><span style="top:-2.55em;margin-left:-0.0715em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight"><span class="mord mathrm mtight">rand</span></span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.936em;"><span></span></span></span></span></span><span class="mclose nulldelimiter"></span></span></span></span></span></span></p></div>
<p><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>σ</mi><mo>&gt;</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">\sigma &gt; 1</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.5782em;vertical-align:-0.0391em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">σ</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">&gt;</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">1</span></span></span></span> is a small world; <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>σ</mi><mo>≈</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">\sigma \approx 1</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4831em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">σ</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">≈</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">1</span></span></span></span> is random-like.</p>
</div>
<div class="fig">
<p><img src="figures/sigma-def.png" alt="" style="width:520px;" /></p>
<figcaption>red: the small-world side of 1</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="61" data-paginate="true" data-theme="it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r" lang="en-US" data-marpit-pagination="61" style="--paginate:true;--theme:it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r;" data-marpit-pagination-total="91">
<h2 id="your-turn-three-real-networks">Your turn: three real networks</h2>
<hr />
<div class="fig tight">
<p><img src="figures/ws1998-dots.png" alt="" style="width:1000px;" /></p>
<figcaption>gray: the path-length ratio — red: the clustering ratio, log axis</figcaption>
</div>
<p>Pick one row. Read both ratios off the axis and compute <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>σ</mi></mrow><annotation encoding="application/x-tex">\sigma</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">σ</span></span></span></span> yourself. <em>Two minutes.</em></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="62" data-paginate="true" data-theme="it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r" lang="en-US" data-marpit-pagination="62" style="--paginate:true;--theme:it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r;" data-marpit-pagination-total="91">
<h2 id="all-three-are-small-worlds">All three are small worlds</h2>
<hr />
<div class="fig tight">
<p><img src="figures/ws1998-sigma.png" alt="" style="width:1000px;" /></p>
<figcaption>every network sits far to the right of the random baseline</figcaption>
</div>
<p>Path length is barely 1.2–1.5 times the random baseline. Clustering is 6 to 3000 times it. That gap <em>is</em> the small-world property.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="63" data-paginate="true" data-class="part" data-theme="it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r" lang="en-US" class="part" data-marpit-pagination="63" style="--paginate:true;--class:part;--theme:it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r;" data-marpit-pagination-total="91"><div class="band"><span>Part Five</span><span class="count">05 / 06</span></div>
<h2 id="the-mechanism">The mechanism</h2>
<p>&quot;What I cannot create, I do not understand&quot; — Feynman</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="64" data-paginate="true" data-class="mid" data-theme="it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r" lang="en-US" class="mid" data-marpit-pagination="64" style="--paginate:true;--class:mid;--theme:it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r;" data-marpit-pagination-total="91">
<h2 id="could-you-build-one">Could you build one?</h2>
<hr />
<p>Measuring a property is not explaining it. So build a network that has both.</p>
<div class="formula">
<p>High clustering <em>and</em> short routes. What is your first move?</p>
</div>
<p><em>Turn to your neighbour — 60 seconds, then we try the two obvious answers.</em></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="65" data-paginate="true" data-theme="it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r" lang="en-US" data-marpit-pagination="65" style="--paginate:true;--theme:it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r;" data-marpit-pagination-total="91">
<h2 id="obvious-answer-1-wire-locally">Obvious answer 1: wire locally</h2>
<hr />
<div class="cols">
<div>
<p>Put <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>n</mi></mrow><annotation encoding="application/x-tex">n</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal">n</span></span></span></span> nodes on a ring and join each to its <strong>4 nearest neighbours</strong>. Neighbours share neighbours, so triangles are everywhere.</p>
<p><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mover accent="true"><mi>C</mi><mo>ˉ</mo></mover><mo>=</mo><mn>0.5</mn></mrow><annotation encoding="application/x-tex">\bar C = 0.5</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8201em;"></span><span class="mord accent"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8201em;"><span style="top:-3em;"><span class="pstrut" style="height:3em;"></span><span class="mord mathnormal" style="margin-right:0.0715em;">C</span></span><span style="top:-3.2523em;"><span class="pstrut" style="height:3em;"></span><span class="accent-body" style="left:-0.1667em;"><span class="mord">ˉ</span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">0.5</span></span></span></span> — as clustered as a real friendship network.</p>
</div>
<div class="fig">
<p><img src="figures/ring-lattice.png" alt="" style="width:520px;" /></p>
<figcaption>every edge is short</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="66" data-marpit-fragments="3" data-paginate="true" data-theme="it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r" lang="en-US" data-marpit-pagination="66" style="--paginate:true;--theme:it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r;" data-marpit-pagination-total="91">
<h2 id="but-it-is-enormous">But it is enormous</h2>
<hr />
<div class="cols">
<div>
<p>Crossing a ring lattice means walking around it, two nodes at a time.</p>
<ul>
<li data-marpit-fragment="1">16 nodes: 4 hops to the far side.</li>
<li data-marpit-fragment="2">1000 nodes: <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mover accent="true"><mi>L</mi><mo>ˉ</mo></mover><mo>≈</mo><mn>125</mn></mrow><annotation encoding="application/x-tex">\bar L \approx 125</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8201em;"></span><span class="mord accent"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8201em;"><span style="top:-3em;"><span class="pstrut" style="height:3em;"></span><span class="mord mathnormal">L</span></span><span style="top:-3.2523em;"><span class="pstrut" style="height:3em;"></span><span class="accent-body" style="left:-0.2222em;"><span class="mord">ˉ</span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">≈</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">125</span></span></span></span>.</li>
<li data-marpit-fragment="3">Distance grows linearly with <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>n</mi></mrow><annotation encoding="application/x-tex">n</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal">n</span></span></span></span> — the opposite of what we measured.</li>
</ul>
</div>
<div class="fig">
<p><img src="figures/ring-distance.png" alt="" style="width:520px;" /></p>
<figcaption>red: the longest shortest route</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="67" data-marpit-fragments="2" data-paginate="true" data-theme="it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r" lang="en-US" data-marpit-pagination="67" style="--paginate:true;--theme:it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r;" data-marpit-pagination-total="91">
<h2 id="obvious-answer-2-wire-at-random">Obvious answer 2: wire at random</h2>
<hr />
<div class="cols">
<div>
<p>Same nodes, same number of edges, shuffled.</p>
<ul>
<li data-marpit-fragment="1">Routes get short immediately, and the clustering falls with them: 0.50 to 0.24 — at sixteen nodes, only a halving.</li>
<li data-marpit-fragment="2">Grow the network and <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo stretchy="false">⟨</mo><mi>k</mi><mo stretchy="false">⟩</mo><mi mathvariant="normal">/</mi><mo stretchy="false">(</mo><mi>n</mi><mo>−</mo><mn>1</mn><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\langle k \rangle/(n-1)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">⟨</span><span class="mord mathnormal" style="margin-right:0.0315em;">k</span><span class="mclose">⟩</span><span class="mord">/</span><span class="mopen">(</span><span class="mord mathnormal">n</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">−</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord">1</span><span class="mclose">)</span></span></span></span> takes it to nothing, while the ring stays at 0.50 forever.</li>
</ul>
</div>
<div class="fig">
<p><img src="figures/random-graph.png" alt="" style="width:520px;" /></p>
<figcaption>short routes, and a quarter of the closure</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="68" data-paginate="true" data-theme="it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r" lang="en-US" data-marpit-pagination="68" style="--paginate:true;--theme:it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r;" data-marpit-pagination-total="91">
<h2 id="the-trade-off">The trade-off</h2>
<hr />
<div class="fig tight">
<p><img src="figures/lattice-vs-random.png" alt="" style="width:1000px;" /></p>
<figcaption>the two extremes, same nodes and same edge count</figcaption>
</div>
<p>Each extreme buys one property with the other. Real networks refuse to choose — so the answer must be somewhere in between.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="69" data-paginate="true" data-class="mid" data-theme="it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r" lang="en-US" class="mid" data-marpit-pagination="69" style="--paginate:true;--class:mid;--theme:it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r;" data-marpit-pagination-total="91">
<h2 id="how-would-you-cheat">How would you cheat?</h2>
<hr />
<p>You are holding the lattice. You want to keep its triangles and shorten its routes.</p>
<div class="formula">
<p>What is the cheapest edit you can make?</p>
</div>
<p><em>30 seconds — how many edges would you touch?</em></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="70" data-marpit-fragments="2" data-paginate="true" data-theme="it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r" lang="en-US" data-marpit-pagination="70" style="--paginate:true;--theme:it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r;" data-marpit-pagination-total="91">
<h2 id="rewire-with-probability">Rewire with probability <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>p</mi></mrow><annotation encoding="application/x-tex">p</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.625em;vertical-align:-0.1944em;"></span><span class="mord mathnormal">p</span></span></span></span></h2>
<hr />
<div class="cols">
<div>
<p>Walk the lattice edge by edge. With probability <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>p</mi></mrow><annotation encoding="application/x-tex">p</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.625em;vertical-align:-0.1944em;"></span><span class="mord mathnormal">p</span></span></span></span>, detach one end and reattach it to a node chosen at random.</p>
<ul>
<li data-marpit-fragment="1"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>p</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">p = 0</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.625em;vertical-align:-0.1944em;"></span><span class="mord mathnormal">p</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">0</span></span></span></span> leaves the lattice untouched.</li>
<li data-marpit-fragment="2"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>p</mi><mo>=</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">p = 1</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.625em;vertical-align:-0.1944em;"></span><span class="mord mathnormal">p</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">1</span></span></span></span> destroys it completely.</li>
</ul>
</div>
<div class="fig">
<p><img src="figures/ws-rewire-step.png" alt="" style="width:520px;" /></p>
<figcaption>one edge moved; every other edge stays exactly where it was</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="71" data-paginate="true" data-theme="it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r" lang="en-US" data-marpit-pagination="71" style="--paginate:true;--theme:it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r;" data-marpit-pagination-total="91">
<h2 id="watch-it-happen">Watch it happen</h2>
<hr />
<div class="cols">
<div>
<p>Six edges move. The ring survives; a handful of long chords now cut across it.</p>
<div class="note">
<p>Each red chord is one friendship that happens to reach far — the friend who moved abroad.</p>
</div>
</div>
<div class="fig">
<p><img src="figures/ws-rewire.gif" alt="" style="width:520px;" /></p>
<figcaption>one rewiring per frame</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="72" data-paginate="true" data-class="mid" data-theme="it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r" lang="en-US" class="mid" data-marpit-pagination="72" style="--paginate:true;--class:mid;--theme:it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r;" data-marpit-pagination-total="91">
<h2 id="predict-the-two-curves">Predict the two curves</h2>
<hr />
<p>Sweep <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>p</mi></mrow><annotation encoding="application/x-tex">p</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.625em;vertical-align:-0.1944em;"></span><span class="mord mathnormal">p</span></span></span></span> from 0 to 1 and track clustering and path length, each against its lattice value.</p>
<div class="formula">
<p>Do <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>C</mi></mrow><annotation encoding="application/x-tex">C</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.0715em;">C</span></span></span></span> and <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>L</mi></mrow><annotation encoding="application/x-tex">L</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal">L</span></span></span></span> fall together, or does one go first?</p>
</div>
<p><em>Sketch both curves in your notes before the next slide.</em></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="73" data-paginate="true" data-theme="it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r" lang="en-US" data-marpit-pagination="73" style="--paginate:true;--theme:it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r;" data-marpit-pagination-total="91">
<h2 id="they-do-not-fall-together">They do not fall together</h2>
<hr />
<div class="fig tight">
<p><img src="figures/ws-sweep.png" alt="" style="width:1000px;" /></p>
<figcaption>measured on 400 nodes, averaged over six runs</figcaption>
</div>
<p><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>L</mi></mrow><annotation encoding="application/x-tex">L</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal">L</span></span></span></span> collapses while <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>C</mi></mrow><annotation encoding="application/x-tex">C</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.0715em;">C</span></span></span></span> is still essentially untouched. A few random edges are enough to shorten everything, and far too few to break the triangles.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="74" data-paginate="true" data-theme="it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r" lang="en-US" data-marpit-pagination="74" style="--paginate:true;--theme:it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r;" data-marpit-pagination-total="91">
<h2 id="the-small-world-band">The small-world band</h2>
<hr />
<div class="fig tight">
<p><img src="figures/ws-band.png" alt="" style="width:1000px;" /></p>
<figcaption>gold: two decades of rewiring where both hold</figcaption>
</div>
<p>The gap is not a knife edge — it is two orders of magnitude wide. Any network that rewires a little at all lands inside it.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="75" data-paginate="true" data-theme="it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r" lang="en-US" data-marpit-pagination="75" style="--paginate:true;--theme:it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r;" data-marpit-pagination-total="91">
<h2 id="why-shortcuts-are-so-cheap">Why shortcuts are so cheap</h2>
<hr />
<div class="cols">
<div>
<p>One long edge serves an entire arc of nodes at once, and it costs at most a couple of triangles.</p>
<p>That asymmetry is the whole mechanism.</p>
</div>
<div class="fig">
<p><img src="figures/shortcut-effect.png" alt="" style="width:520px;" /></p>
<figcaption>the lattice underneath is untouched</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="76" data-paginate="true" data-theme="it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r" lang="en-US" data-marpit-pagination="76" style="--paginate:true;--theme:it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r;" data-marpit-pagination-total="91">
<h2 id="your-turn-drag-yourself">Your turn: drag <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>p</mi></mrow><annotation encoding="application/x-tex">p</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.625em;vertical-align:-0.1944em;"></span><span class="mord mathnormal">p</span></span></span></span> yourself</h2>
<hr />
<div class="cols">
<div>
<p>Open the Watts–Strogatz widget in the Module 02 notebook and sweep <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>p</mi></mrow><annotation encoding="application/x-tex">p</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.625em;vertical-align:-0.1944em;"></span><span class="mord mathnormal">p</span></span></span></span> by hand.</p>
<p>Find the smallest <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>p</mi></mrow><annotation encoding="application/x-tex">p</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.625em;vertical-align:-0.1944em;"></span><span class="mord mathnormal">p</span></span></span></span> where <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>L</mi></mrow><annotation encoding="application/x-tex">L</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal">L</span></span></span></span> has already collapsed and <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>C</mi></mrow><annotation encoding="application/x-tex">C</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.0715em;">C</span></span></span></span> has not.</p>
</div>
<div class="fig">
<p><img src="figures/ws-widget.png" alt="" style="width:520px;" /></p>
<figcaption>the ring at fourteen percent rewiring</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="77" data-paginate="true" data-class="part" data-theme="it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r" lang="en-US" class="part" data-marpit-pagination="77" style="--paginate:true;--class:part;--theme:it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r;" data-marpit-pagination-total="91"><div class="band"><span>Part Six</span><span class="count">06 / 06</span></div>
<h2 id="edge-cases-and-what-survives-them">Edge cases, and what survives them</h2>
<p>The networks that break the definitions — and the one signature that does not break</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="78" data-paginate="true" data-class="mid" data-theme="it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r" lang="en-US" class="mid" data-marpit-pagination="78" style="--paginate:true;--class:mid;--theme:it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r;" data-marpit-pagination-total="91">
<h2 id="what-if-two-nodes-are-not-connected">What if two nodes are not connected?</h2>
<hr />
<div class="cols">
<div>
<p><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mover accent="true"><mi>L</mi><mo>ˉ</mo></mover></mrow><annotation encoding="application/x-tex">\bar L</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8201em;"></span><span class="mord accent"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8201em;"><span style="top:-3em;"><span class="pstrut" style="height:3em;"></span><span class="mord mathnormal">L</span></span><span style="top:-3.2523em;"><span class="pstrut" style="height:3em;"></span><span class="accent-body" style="left:-0.2222em;"><span class="mord">ˉ</span></span></span></span></span></span></span></span></span></span> averages <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>d</mi><mo stretchy="false">(</mo><mi>i</mi><mo separator="true">,</mo><mi>j</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">d(i,j)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal">d</span><span class="mopen">(</span><span class="mord mathnormal">i</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal" style="margin-right:0.0572em;">j</span><span class="mclose">)</span></span></span></span> over every pair. This network has pairs with no route between them at all.</p>
<p><em>30 seconds — what should the average do with those pairs?</em></p>
</div>
<div class="fig">
<p><img src="figures/disconnected.png" alt="" style="width:520px;" /></p>
<figcaption>ringed: one such pair</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="79" data-marpit-fragments="2" data-paginate="true" data-theme="it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r" lang="en-US" data-marpit-pagination="79" style="--paginate:true;--theme:it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r;" data-marpit-pagination-total="91">
<h2 id="and-the-average-dies-with-it"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>d</mi><mo>=</mo><mi mathvariant="normal">∞</mi></mrow><annotation encoding="application/x-tex">d = \infty</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6944em;"></span><span class="mord mathnormal">d</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord">∞</span></span></span></span>, and the average dies with it</h2>
<hr />
<div class="cols">
<div>
<p>One unreachable pair makes <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mover accent="true"><mi>L</mi><mo>ˉ</mo></mover></mrow><annotation encoding="application/x-tex">\bar L</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8201em;"></span><span class="mord accent"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8201em;"><span style="top:-3em;"><span class="pstrut" style="height:3em;"></span><span class="mord mathnormal">L</span></span><span style="top:-3.2523em;"><span class="pstrut" style="height:3em;"></span><span class="accent-body" style="left:-0.2222em;"><span class="mord">ˉ</span></span></span></span></span></span></span></span></span></span> infinite, however short everything else is.</p>
<ul>
<li data-marpit-fragment="1">In practice: measure on the <strong>largest connected component</strong>.</li>
<li data-marpit-fragment="2">Or average the reciprocals <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>1</mn><mi mathvariant="normal">/</mi><mi>d</mi></mrow><annotation encoding="application/x-tex">1/d</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord">1/</span><span class="mord mathnormal">d</span></span></span></span> instead, which treats <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="normal">∞</mi></mrow><annotation encoding="application/x-tex">\infty</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord">∞</span></span></span></span> as 0.</li>
</ul>
</div>
<div class="fig">
<p><img src="figures/disconnected-answer.png" alt="" style="width:520px;" /></p>
<figcaption>two components, and no edge between them</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="80" data-paginate="true" data-class="mid" data-theme="it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r" lang="en-US" class="mid" data-marpit-pagination="80" style="--paginate:true;--class:mid;--theme:it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r;" data-marpit-pagination-total="91">
<h2 id="what-is-for-a-node-with-one-friend">What is <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>C</mi><mi>i</mi></msub></mrow><annotation encoding="application/x-tex">C_i</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0715em;">C</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3117em;"><span style="top:-2.55em;margin-left:-0.0715em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">i</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span> for a node with one friend?</h2>
<hr />
<div class="cols">
<div>
<p><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>C</mi><mi>i</mi></msub></mrow><annotation encoding="application/x-tex">C_i</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0715em;">C</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3117em;"><span style="top:-2.55em;margin-left:-0.0715em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">i</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span> divides by <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>k</mi><mi>i</mi></msub><mo stretchy="false">(</mo><msub><mi>k</mi><mi>i</mi></msub><mo>−</mo><mn>1</mn><mo stretchy="false">)</mo><mi mathvariant="normal">/</mi><mn>2</mn></mrow><annotation encoding="application/x-tex">k_i(k_i-1)/2</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0315em;">k</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3117em;"><span style="top:-2.55em;margin-left:-0.0315em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">i</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mopen">(</span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0315em;">k</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3117em;"><span style="top:-2.55em;margin-left:-0.0315em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">i</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">−</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord">1</span><span class="mclose">)</span><span class="mord">/2</span></span></span></span> — the number of pairs among the neighbours.</p>
<p><em>30 seconds with your neighbour before we write anything down.</em></p>
</div>
<div class="fig">
<p><img src="figures/degree-one.png" alt="" style="width:520px;" /></p>
<figcaption>ringed: degree one</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="81" data-marpit-fragments="2" data-paginate="true" data-theme="it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r" lang="en-US" data-marpit-pagination="81" style="--paginate:true;--theme:it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r;" data-marpit-pagination-total="91">
<h2 id="zero-over-zero--a-convention-not-a-fact">Zero over zero — a convention, not a fact</h2>
<hr />
<div class="cols">
<div>
<p>No pairs among the neighbours, so numerator and denominator are both zero. <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>C</mi><mi>i</mi></msub></mrow><annotation encoding="application/x-tex">C_i</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0715em;">C</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3117em;"><span style="top:-2.55em;margin-left:-0.0715em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">i</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span> is genuinely <strong>undefined</strong>.</p>
<ul>
<li data-marpit-fragment="1">The usual convention: set it to zero.</li>
<li data-marpit-fragment="2">That drags <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mover accent="true"><mi>C</mi><mo>ˉ</mo></mover></mrow><annotation encoding="application/x-tex">\bar C</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8201em;"></span><span class="mord accent"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8201em;"><span style="top:-3em;"><span class="pstrut" style="height:3em;"></span><span class="mord mathnormal" style="margin-right:0.0715em;">C</span></span><span style="top:-3.2523em;"><span class="pstrut" style="height:3em;"></span><span class="accent-body" style="left:-0.1667em;"><span class="mord">ˉ</span></span></span></span></span></span></span></span></span></span> down in networks full of leaves.</li>
</ul>
</div>
<div class="fig">
<p><img src="figures/degree-one-answer.png" alt="" style="width:520px;" /></p>
<figcaption>a leaf — and real networks are full of them</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="82" data-paginate="true" data-class="mid" data-theme="it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r" lang="en-US" class="mid" data-marpit-pagination="82" style="--paginate:true;--class:mid;--theme:it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r;" data-marpit-pagination-total="91">
<h2 id="is-any-real-network-anti-small-world">Is any real network anti-small-world?</h2>
<hr />
<div class="cols">
<div>
<p><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>σ</mi><mo>&lt;</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">\sigma &lt; 1</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.5782em;vertical-align:-0.0391em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">σ</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">&lt;</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">1</span></span></span></span> needs long routes <em>and</em> clustering below the random baseline.</p>
<p>The ring lattice has the long routes. Is it enough?</p>
<p><em>30 seconds — which half of the ratio wins?</em></p>
</div>
<div class="fig">
<p><img src="figures/sigma-lt-1-q.png" alt="" style="width:520px;" /></p>
<figcaption>sixteen nodes, four neighbours each</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="83" data-paginate="true" data-theme="it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r" lang="en-US" data-marpit-pagination="83" style="--paginate:true;--theme:it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r;" data-marpit-pagination-total="91">
<h2 id="not-the-lattice">Not the lattice</h2>
<hr />
<div class="cols">
<div>
<p><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>σ</mi><mo>&gt;</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">\sigma &gt; 1</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.5782em;vertical-align:-0.0391em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">σ</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">&gt;</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">1</span></span></span></span>: the ring lattice's clustering advantage beats its distance penalty.</p>
<p><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>σ</mi><mo>≈</mo><mn>5</mn></mrow><annotation encoding="application/x-tex">\sigma \approx 5</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4831em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">σ</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">≈</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">5</span></span></span></span> for a ring of a thousand nodes; even the 16-node ring scores 1.56.</p>
</div>
<div class="fig">
<p><img src="figures/ring-lattice.png" alt="" style="width:520px;" /></p>
<figcaption>clustering wins the ratio, even here</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="84" data-paginate="true" data-theme="it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r" lang="en-US" data-marpit-pagination="84" style="--paginate:true;--theme:it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r;" data-marpit-pagination-total="91">
<h2 id="you-have-to-kill-the-triangles">You have to kill the triangles</h2>
<hr />
<div class="cols">
<div>
<p>You need clustering under the random baseline — and random is already near zero.</p>
<div class="formula">
<p>Count the triplets centred on one intersection. How many are closed?</p>
</div>
<p><em>60 seconds on paper.</em></p>
</div>
<div class="fig">
<p><img src="figures/grid-no-triangles.png" alt="" style="width:520px;" /></p>
<figcaption>every face is a square</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="85" data-paginate="true" data-theme="it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r" lang="en-US" data-marpit-pagination="85" style="--paginate:true;--theme:it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r;" data-marpit-pagination-total="91">
<h2 id="six-triplets-none-closed">Six triplets, none closed</h2>
<hr />
<div class="cols">
<div>
<p>An intersection has four neighbours, so <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mrow><mo fence="true">(</mo><mfrac linethickness="0px"><mn>4</mn><mn>2</mn></mfrac><mo fence="true">)</mo></mrow><mo>=</mo><mn>6</mn></mrow><annotation encoding="application/x-tex">\binom{4}{2} = 6</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1.2451em;vertical-align:-0.35em;"></span><span class="mord"><span class="mopen delimcenter" style="top:0em;"><span class="delimsizing size1">(</span></span><span class="mfrac"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.8951em;"><span style="top:-2.355em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">2</span></span></span></span><span style="top:-3.144em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">4</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.345em;"><span></span></span></span></span></span><span class="mclose delimcenter" style="top:0em;"><span class="delimsizing size1">)</span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">6</span></span></span></span> triplets are centred on it — and no two of those four are joined to each other.</p>
<p>Nothing closes. <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>C</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">C = 0</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.0715em;">C</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">0</span></span></span></span>, and <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>σ</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">\sigma = 0</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">σ</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">0</span></span></span></span> with it.</p>
</div>
<div class="fig">
<p><img src="figures/grid-no-triangles.png" alt="" style="width:520px;" /></p>
<figcaption>no diagonals anywhere — so every triplet stays open</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="86" data-paginate="true" data-class="mid" data-theme="it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r" lang="en-US" class="mid" data-marpit-pagination="86" style="--paginate:true;--class:mid;--theme:it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r;" data-marpit-pagination-total="91">
<h2 id="or--the-same-thing"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>G</mi><mo stretchy="false">(</mo><mi>n</mi><mo separator="true">,</mo><mi>m</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">G(n,m)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal">G</span><span class="mopen">(</span><span class="mord mathnormal">n</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal">m</span><span class="mclose">)</span></span></span></span> or <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>G</mi><mo stretchy="false">(</mo><mi>n</mi><mo separator="true">,</mo><mi>p</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">G(n,p)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal">G</span><span class="mopen">(</span><span class="mord mathnormal">n</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal">p</span><span class="mclose">)</span></span></span></span> — the same thing?</h2>
<hr />
<div class="fig tight">
<p><img src="figures/gnm-gnp.png" alt="" style="width:1000px;" /></p>
<figcaption>two recipes for "a random graph"</figcaption>
</div>
<p><em>30 seconds: does it matter which one you normalise against?</em></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="87" data-paginate="true" data-theme="it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r" lang="en-US" data-marpit-pagination="87" style="--paginate:true;--theme:it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r;" data-marpit-pagination-total="91">
<h2 id="almost--but-only-one-has-independent-edges">Almost — but only one has independent edges</h2>
<hr />
<div class="fig tight">
<p><img src="figures/gnm-gnp-answer.png" alt="" style="width:1000px;" /></p>
<figcaption>fixing the edge count couples the edges to each other</figcaption>
</div>
<p>Fix <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>m</mi></mrow><annotation encoding="application/x-tex">m</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal">m</span></span></span></span> and the edges stop being independent: using one up makes the rest less likely — and independence is what let us write <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>C</mi><mrow><mi mathvariant="normal">r</mi><mi mathvariant="normal">a</mi><mi mathvariant="normal">n</mi><mi mathvariant="normal">d</mi></mrow></msub><mo>=</mo><mi>p</mi></mrow><annotation encoding="application/x-tex">C_{\mathrm{rand}} = p</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0715em;">C</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3361em;"><span style="top:-2.55em;margin-left:-0.0715em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight"><span class="mord mathrm mtight">rand</span></span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.625em;vertical-align:-0.1944em;"></span><span class="mord mathnormal">p</span></span></span></span>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="88" data-paginate="true" data-theme="it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r" lang="en-US" data-marpit-pagination="88" style="--paginate:true;--theme:it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r;" data-marpit-pagination-total="91">
<h2 id="the-same-signature-everywhere">The same signature everywhere</h2>
<hr />
<div class="fig tight">
<p><img src="figures/universality.png" alt="" style="width:1000px;" /></p>
<figcaption>the three networks of Watts and Strogatz, by domain</figcaption>
</div>
<p>Film collaborations, a power grid, and a worm's nervous system. Nothing social connects them — and all three are small worlds.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="89" data-paginate="true" data-theme="it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r" lang="en-US" data-marpit-pagination="89" style="--paginate:true;--theme:it8tltg02p9ea7d6wnl0oxxkvo58ojgi0sb3wrdzbz0r;" data-marpit-pagination-total="91">
<h2 id="one-map">One map</h2>
<hr />
<div class="fig tight">
