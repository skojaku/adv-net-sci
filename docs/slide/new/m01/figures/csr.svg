<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420">
  <!-- small adjacency matrix -->
  <g font-family="Libre Baskerville, Georgia, serif" font-size="18" fill="#000000">
    <text x="40" y="36" font-size="20" font-weight="700">A (dense)</text>
    <!-- grid 5x5 -->
    <g stroke="#dddddd" stroke-width="1" fill="none">
      <rect x="40" y="56" width="200" height="200"/>
      <path d="M80 56 V256 M120 56 V256 M160 56 V256 M200 56 V256"/>
      <path d="M40 96 H240 M40 136 H240 M40 176 H240 M40 216 H240"/>
    </g>
    <g text-anchor="middle" dominant-baseline="central" font-size="16">
      <!-- row 0 -->
      <text x="60" y="76" fill="#b3b3b3">0</text>
      <text x="100" y="76" fill="#3959A6">1</text>
      <text x="140" y="76" fill="#3959A6">1</text>
      <text x="180" y="76" fill="#b3b3b3">0</text>
      <text x="220" y="76" fill="#b3b3b3">0</text>
      <!-- row 1 -->
      <text x="60" y="116" fill="#3959A6">1</text>
      <text x="100" y="116" fill="#b3b3b3">0</text>
      <text x="140" y="116" fill="#3959A6">1</text>
      <text x="180" y="116" fill="#3959A6">1</text>
      <text x="220" y="116" fill="#b3b3b3">0</text>
      <!-- row 2 -->
      <text x="60" y="156" fill="#3959A6">1</text>
      <text x="100" y="156" fill="#3959A6">1</text>
      <text x="140" y="156" fill="#b3b3b3">0</text>
      <text x="180" y="156" fill="#b3b3b3">0</text>
      <text x="220" y="156" fill="#3959A6">1</text>
      <!-- row 3 -->
      <text x="60" y="196" fill="#b3b3b3">0</text>
      <text x="100" y="196" fill="#3959A6">1</text>
      <text x="140" y="196" fill="#b3b3b3">0</text>
      <text x="180" y="196" fill="#b3b3b3">0</text>
      <text x="220" y="196" fill="#3959A6">1</text>
      <!-- row 4 -->
      <text x="60" y="236" fill="#b3b3b3">0</text>
      <text x="100" y="236" fill="#b3b3b3">0</text>
      <text x="140" y="236" fill="#3959A6">1</text>
      <text x="180" y="236" fill="#3959A6">1</text>
      <text x="220" y="236" fill="#b3b3b3">0</text>
    </g>
  </g>

  <!-- arrow -->
  <path d="M280 156 H340" stroke="#3959A6" stroke-width="4" fill="none"/>
  <path d="M330 146 L350 156 L330 166" fill="#3959A6"/>

  <!-- CSR arrays -->
  <g font-family="Libre Baskerville, Georgia, serif" fill="#000000">
    <text x="380" y="36" font-size="20" font-weight="700">CSR</text>

    <text x="380" y="80" font-size="16" fill="#3959A6" letter-spacing="0.12em">DATA</text>
    <rect x="380" y="92" width="480" height="40" fill="#f7f4f1" stroke="#dddddd"/>
    <g font-size="15" text-anchor="middle" dominant-baseline="central">
      <text x="400" y="112">1</text><text x="440" y="112">1</text>
      <text x="480" y="112">1</text><text x="520" y="112">1</text><text x="560" y="112">1</text>
      <text x="600" y="112">1</text><text x="640" y="112">1</text><text x="680" y="112">1</text>
      <text x="720" y="112">1</text><text x="760" y="112">1</text>
      <text x="800" y="112">1</text><text x="840" y="112">1</text>
    </g>

    <text x="380" y="168" font-size="16" fill="#3959A6" letter-spacing="0.12em">INDICES</text>
    <rect x="380" y="180" width="480" height="40" fill="#f7f4f1" stroke="#dddddd"/>
    <g font-size="15" text-anchor="middle" dominant-baseline="central">
      <text x="400" y="200">1</text><text x="440" y="200">2</text>
      <text x="480" y="200">0</text><text x="520" y="200">2</text><text x="560" y="200">3</text>
      <text x="600" y="200">0</text><text x="640" y="200">1</text><text x="680" y="200">4</text>
      <text x="720" y="200">1</text><text x="760" y="200">4</text>
      <text x="800" y="200">2</text><text x="840" y="200">3</text>
    </g>

    <text x="380" y="256" font-size="16" fill="#3959A6" letter-spacing="0.12em">INDPTR</text>
    <rect x="380" y="268" width="280" height="40" fill="#f7f4f1" stroke="#dddddd"/>
    <g font-size="15" text-anchor="middle" dominant-baseline="central">
      <text x="403" y="288">0</text>
      <text x="450" y="288">2</text>
      <text x="497" y="288">5</text>
      <text x="544" y="288">8</text>
      <text x="591" y="288">10</text>
      <text x="638" y="288">12</text>
    </g>
  </g>

  <text x="450" y="360" font-family="Caveat, cursive" font-size="28" fill="#6b6b6b" text-anchor="middle">
    row i lives in data[indptr[i] : indptr[i+1]]
  </text>
  <text x="450" y="400" font-family="Caveat, cursive" font-size="26" fill="#B14434" text-anchor="middle">
    O(n^2) -&gt; O(m + n)
  </text>
</svg>
