<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300">
  <!-- even degree -->
  <g>
    <circle cx="160" cy="140" r="36" fill="#3959A6"/>
    <g stroke="#c8c1ba" stroke-width="5">
      <line x1="160" y1="140" x2="80" y2="60"/>
      <line x1="160" y1="140" x2="240" y2="60"/>
      <line x1="160" y1="140" x2="80" y2="220"/>
      <line x1="160" y1="140" x2="240" y2="220"/>
    </g>
    <g fill="#b4aca4">
      <circle cx="80" cy="60" r="16"/>
      <circle cx="240" cy="60" r="16"/>
      <circle cx="80" cy="220" r="16"/>
      <circle cx="240" cy="220" r="16"/>
    </g>
    <text x="160" y="280" font-family="Caveat, cursive" font-size="30" fill="#3959A6" text-anchor="middle">even (k = 4): pass through</text>
  </g>
  <!-- odd degree -->
  <g>
    <circle cx="520" cy="140" r="36" fill="#B14434"/>
    <g stroke="#c8c1ba" stroke-width="5">
      <line x1="520" y1="140" x2="440" y2="60"/>
      <line x1="520" y1="140" x2="600" y2="60"/>
      <line x1="520" y1="140" x2="520" y2="240"/>
    </g>
    <g fill="#b4aca4">
      <circle cx="440" cy="60" r="16"/>
      <circle cx="600" cy="60" r="16"/>
      <circle cx="520" cy="240" r="16"/>
    </g>
    <text x="520" y="280" font-family="Caveat, cursive" font-size="30" fill="#B14434" text-anchor="middle">odd (k = 3): leftover edge</text>
  </g>
</svg>
