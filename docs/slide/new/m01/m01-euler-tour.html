<h1 id="seven-bridges">Seven Bridges</h1>
<hr />
<div class="sub">A stroll, a puzzle, and the birth of graph theory</div>
<div class="credit">Sadamori Kojaku · Binghamton University</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="2" data-paginate="true" data-theme="m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i" lang="en-US" data-marpit-pagination="2" style="--paginate:true;--theme:m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i;" data-marpit-pagination-total="80">
<h2 id="roadmap-for-today">Roadmap for today</h2>
<hr />
<div class="steps-list">
<div><div class="i">01</div><div>The puzzle — seven bridges, one frustrating walk</div></div>
<div><div class="i">02</div><div>Abstraction — landmasses → nodes, bridges → edges</div></div>
<div><div class="i">03</div><div>Degree and Euler — parity decides what is possible</div></div>
<div><div class="i">04</div><div>Vocabulary — walk, trail, path, circuit, cycle</div></div>
<div><div class="i">05</div><div>Connectivity — components and the giant component</div></div>
<div><div class="i">06</div><div>Direction — in/out-degree, the directed Euler condition, strong vs. weak reachability</div></div>
<div><div class="i">07</div><div>Representation — edge lists, adjacency, sparsity, CSR</div></div>
<div><div class="i">08</div><div>Edge cases — the graphs that break the rules</div></div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-class="part" data-theme="m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i" lang="en-US" class="part" data-marpit-pagination="3" style="--paginate:true;--class:part;--theme:m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i;" data-marpit-pagination-total="80"><div class="band"><span>Part One</span><span class="count">01 / 08</span></div>
<h2 id="the-puzzle">The puzzle</h2>
<p>An 18th-century Sunday stroll that mathematics could not ignore</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-theme="m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i" lang="en-US" data-marpit-pagination="4" style="--paginate:true;--theme:m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i;" data-marpit-pagination-total="80">
<h2 id="the-k%C3%B6nigsberg-bridge-problem">The Königsberg bridge problem</h2>
<hr />
<div class="cols">
<div>
<p>18th-century Königsberg (today Kaliningrad). Two islands in the Pregel, linked to the mainland by <strong>seven bridges</strong>.</p>
<div class="formula">
<p>Cross each bridge <strong>exactly once</strong> and <strong>return to the start</strong>?</p>
</div>
<div class="note">
<p>Nobody could find such a walk. More importantly: nobody could <em>prove</em> it was impossible.</p>
</div>
</div>
<div class="fig">
<p><img src="figures/konigsberg-map.png" alt="" style="width:520px;" /></p>
<figcaption>the shape you're about to erase</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-theme="m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i" lang="en-US" data-marpit-pagination="5" style="--paginate:true;--theme:m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i;" data-marpit-pagination-total="80">
<h2 id="your-turn">Your turn</h2>
<hr />
<div class="cols">
<div>
<p>Take <strong>ten minutes</strong>. Trace a route — or work the pen-and-paper worksheet.</p>
<p><a href="http://estebanmoro.org/pdf/netsci_for_kids/the_konisberg_bridges.pdf">Worksheet (Esteban Moro)</a></p>
<div class="note">
<p>Ask yourself: What information is essential — bridge length? Island size? How do you move from &quot;I can't find a path&quot; to &quot;a path cannot exist&quot;?</p>
</div>
</div>
<div class="fig">
<p><img src="figures/konigsberg-sketch.png" alt="" style="width:520px;" /></p>
<figcaption>four landmasses, same layout as the engraving</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-class="part" data-theme="m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i" lang="en-US" class="part" data-marpit-pagination="6" style="--paginate:true;--class:part;--theme:m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i;" data-marpit-pagination-total="80"><div class="band"><span>Part Two</span><span class="count">02 / 08</span></div>
<h2 id="abstraction">Abstraction</h2>
<p>Strip the map until only relationships remain</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-theme="m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i" lang="en-US" data-marpit-pagination="7" style="--paginate:true;--theme:m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i;" data-marpit-pagination-total="80">
<h2 id="what-can-you-throw-away">What can you throw away?</h2>
<hr />
<div class="cols">
<div>
<p>Look at the sketch again. The puzzle is still the puzzle if you erase almost everything about it.</p>
<div class="note">
<p>Turn to your neighbor — 30 seconds. Does the puzzle depend on bridge length? Island area? River width? Which bank you start from?</p>
</div>
</div>
<div class="fig">
<p><img src="figures/konigsberg-sketch.png" alt="" style="width:520px;" /></p>
<figcaption>what actually matters here?</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-theme="m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i" lang="en-US" data-marpit-pagination="8" style="--paginate:true;--theme:m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i;" data-marpit-pagination-total="80">
<h2 id="eulers-move--the-city">Euler's move — the city</h2>
<hr />
<div class="cols">
<div>
<p>Euler looked at this same map and asked the same question. His answer: throw away everything except <strong>what connects to what</strong>.</p>
<p>Geography, distance, shape — all of it is about to go.</p>
</div>
<div class="fig">
<p><img src="figures/abstraction-1-map.png" alt="" style="width:520px;" /></p>
<figcaption>N, A, B, S now labelled — the cut comes next</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-theme="m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i" lang="en-US" data-marpit-pagination="9" style="--paginate:true;--theme:m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i;" data-marpit-pagination-total="80">
<h2 id="eulers-move--each-landmass-becomes-a-node">Euler's move — each landmass becomes a node</h2>
<hr />
<div class="cols">
<div>
<p>Four landmasses. Four dots. A landmass's size, its shape, its area — all gone. Only a bare label remains.</p>
</div>
<div class="fig">
<p><img src="figures/abstraction-2-nodes.png" alt="" style="width:520px;" /></p>
<figcaption>four dots, still no lines between them</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-theme="m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i" lang="en-US" data-marpit-pagination="10" style="--paginate:true;--theme:m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i;" data-marpit-pagination-total="80">
<h2 id="eulers-move--each-bridge-becomes-an-edge">Euler's move — each bridge becomes an edge</h2>
<hr />
<div class="cols">
<div>
<p>Every bridge is now just a line joining two dots. What is left is a new mathematical object: a <strong>graph</strong>.</p>
<div class="note">
<p>1736: this abstraction founds <strong>graph theory</strong> — the substrate for social, transport, brain, and Internet analysis.</p>
</div>
</div>
<div class="fig">
<p><img src="figures/abstraction-3-graph.png" alt="" style="width:520px;" /></p>
<figcaption>seven edges in all — two pairs doubled, island A touching five</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-theme="m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i" lang="en-US" data-marpit-pagination="11" style="--paginate:true;--theme:m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i;" data-marpit-pagination-total="80">
<h2 id="a-graph-written-down">A graph, written down</h2>
<hr />
<div class="cols">
<div>
<div class="formula">
<p><span class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>G</mi><mo>=</mo><mo stretchy="false">(</mo><mi>V</mi><mo separator="true">,</mo><mi>E</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">G = (V, E) 
</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal">G</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">(</span><span class="mord mathnormal" style="margin-right:0.2222em;">V</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal" style="margin-right:0.0576em;">E</span><span class="mclose">)</span></span></span></span></span></p></div>
<p><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>V</mi></mrow><annotation encoding="application/x-tex">V</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.2222em;">V</span></span></span></span> = nodes · <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>E</mi></mrow><annotation encoding="application/x-tex">E</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.0576em;">E</span></span></span></span> = edges (pairs of nodes).</p>
<p>For Königsberg: four landmasses, seven bridges.</p>
</div>
<div class="fig">
<p><img src="figures/abstraction-3-graph.png" alt="" style="width:520px;" /></p>
<figcaption>the abstracted city</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-theme="m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i" lang="en-US" data-marpit-pagination="12" style="--paginate:true;--theme:m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i;" data-marpit-pagination-total="80">
<h2 id="your-turn-abstract-a-transit-line">Your turn: abstract a transit line</h2>
<hr />
<p>Picture a small bus line: three stops — <strong>Depot</strong>, <strong>Mall</strong>, <strong>Park</strong> — a Depot–Mall leg, a Mall–Park leg, and an express Depot–Park run that skips Mall.</p>
<div class="formula">
<p>Decide with your neighbor: what are the nodes? What are the edges? Does the express route change Mall's degree?</p>
</div>
<p><em>Take two minutes — sketch it as dots and lines.</em></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-marpit-fragments="2" data-paginate="true" data-theme="m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i" lang="en-US" data-marpit-pagination="13" style="--paginate:true;--theme:m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i;" data-marpit-pagination-total="80">
<h2 id="two-bridges-one-pair">Two bridges, one pair</h2>
<hr />
<div class="cols">
<div>
<p>Königsberg has two bridges between island A and bank N — and two more between A and bank S. Count each one, or collapse the pair?</p>
<ul>
<li data-marpit-fragment="1">Both count. Each bridge is its own edge.</li>
<li data-marpit-fragment="2">Collapse them into one and you are solving a <strong>different</strong> puzzle — one with fewer crossings to make.</li>
</ul>
</div>
<div class="fig">
<p><img src="figures/multigraph-bridges.png" alt="" style="width:520px;" /></p>
<figcaption>N–A, doubled — two bridges, one pair</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-theme="m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i" lang="en-US" data-marpit-pagination="14" style="--paginate:true;--theme:m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i;" data-marpit-pagination-total="80">
<h2 id="an-edge-to-itself">An edge to itself</h2>
<hr />
<div class="cols">
<div>
<p>A <strong>self-loop</strong> is an edge that starts and ends at the same node — a bridge, in principle, from a landmass back to itself.</p>
<p>Königsberg has none. But graphs in general do, and the definition needs to allow for them.</p>
</div>
<div class="fig">
<p><img src="figures/selfloop.png" alt="" style="width:520px;" /></p>
<figcaption>both ends attach here</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-class="part" data-theme="m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i" lang="en-US" class="part" data-marpit-pagination="15" style="--paginate:true;--class:part;--theme:m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i;" data-marpit-pagination-total="80"><div class="band"><span>Part Three</span><span class="count">03 / 08</span></div>
<h2 id="degree-and-eulers-theorem">Degree and Euler’s theorem</h2>
<p>Parity is the whole argument</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-theme="m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i" lang="en-US" data-marpit-pagination="16" style="--paginate:true;--theme:m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i;" data-marpit-pagination-total="80">
<h2 id="degree">Degree</h2>
<hr />
<div class="cols">
<div>
<p>The <strong>degree</strong> <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>k</mi><mi>i</mi></msub></mrow><annotation encoding="application/x-tex">k_i</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8444em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0315em;">k</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3117em;"><span style="top:-2.55em;margin-left:-0.0315em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">i</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span> is the number of edges attached to node <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>i</mi></mrow><annotation encoding="application/x-tex">i</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6595em;"></span><span class="mord mathnormal">i</span></span></span></span>.</p>
<p>Count every edge touching the node — nothing more, nothing less.</p>
</div>
<div class="fig">
<p><img src="figures/degree-definition.png" alt="" style="width:520px;" /></p>
<figcaption>the arms: degree 1 each. The center: degree 4.</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-theme="m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i" lang="en-US" data-marpit-pagination="17" style="--paginate:true;--theme:m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i;" data-marpit-pagination-total="80">
<h2 id="you-are-mid-walk-how-many-edges-do-you-use">You are mid-walk. How many edges do you use?</h2>
<hr />
<p>Suppose your walk crosses every bridge exactly once. You arrive at a node in the middle of that walk. Later, you leave it again.</p>
<div class="formula">
<p>How many edges does that node use, just to let you pass through?</p>
</div>
<p><em>Take 30 seconds. Count on your fingers if you have to.</em></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-theme="m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i" lang="en-US" data-marpit-pagination="18" style="--paginate:true;--theme:m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i;" data-marpit-pagination-total="80">
<h2 id="edges-come-in-pairs">Edges come in pairs</h2>
<hr />
<div class="cols">
<div>
<p>Arrive by one edge, leave by another. Every time you pass through a node, you spend two edges — one in, one out.</p>
<p>An interior node consumes its edges <strong>two at a time</strong>.</p>
</div>
<div class="fig">
<p><img src="figures/parity-even.png" alt="" style="width:520px;" /></p>
<figcaption>even: every edge finds a partner</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-theme="m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i" lang="en-US" data-marpit-pagination="19" style="--paginate:true;--theme:m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i;" data-marpit-pagination-total="80">
<h2 id="what-if-the-degree-is-odd">What if the degree is odd?</h2>
<hr />
<div class="formula">
<p>One edge can’t find a partner. What does that force?</p>
</div>
<p><em>30 seconds — think about where that leftover edge has to go.</em></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-theme="m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i" lang="en-US" data-marpit-pagination="20" style="--paginate:true;--theme:m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i;" data-marpit-pagination-total="80">
<h2 id="one-edge-left-over">One edge left over</h2>
<hr />
<div class="cols">
<div>
<p>Pair up the edges and one is left standing alone. That leftover edge has nowhere to go <strong>except</strong> the start or the end of your walk.</p>
<p>An odd-degree node must be where you <strong>begin</strong> or where you <strong>finish</strong>.</p>
</div>
<div class="fig">
<p><img src="figures/parity-odd.png" alt="" style="width:520px;" /></p>
<figcaption>three edges at this node: one pair, one leftover</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-theme="m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i" lang="en-US" data-marpit-pagination="21" style="--paginate:true;--theme:m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i;" data-marpit-pagination-total="80">
<h2 id="a-graph-with-such-a-walk-has-at-most-two-odd-nodes">A graph with such a walk has at most two odd nodes</h2>
<hr />
<div class="cols">
<div>
<div class="formula">
<p>If a walk crosses every edge exactly once, then</p>
<p><span class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi mathvariant="normal">#</mi><mo stretchy="false">{</mo><mtext>odd-degree nodes in the graph</mtext><mo stretchy="false">}</mo><mo>≤</mo><mn>2</mn></mrow><annotation encoding="application/x-tex">\#\{\text{odd-degree nodes in the graph}\} \leq 2 
</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord">#</span><span class="mopen">{</span><span class="mord text"><span class="mord">odd-degree nodes in the graph</span></span><span class="mclose">}</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">≤</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">2</span></span></span></span></span></p></div>
<div class="note">
<p>A walk that uses every edge exactly once has exactly two ends — a start and a finish. Only those two spots can absorb a leftover edge, so the graph itself can have at most two odd-degree nodes.</p>
</div>
</div>
<div class="fig">
<p><img src="figures/parity-bound.png" alt="" style="width:480px;" /></p>
<figcaption>six nodes; only the two red ends are odd</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-theme="m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i" lang="en-US" data-marpit-pagination="22" style="--paginate:true;--theme:m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i;" data-marpit-pagination-total="80">
<h2 id="your-turn-count-k%C3%B6nigsberg">Your turn: count Königsberg</h2>
<hr />
<div class="cols">
<div>
<p>Count the bridges touching each landmass. How many landmasses have an <strong>odd</strong> count?</p>
<p>Hands up when you have an answer — possible, or impossible?</p>
</div>
<div class="fig">
<p><img src="figures/konigsberg-blank.png" alt="" style="width:520px;" /></p>
<figcaption>same graph, no counts shown</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-marpit-fragments="4" data-paginate="true" data-theme="m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i" lang="en-US" data-marpit-pagination="23" style="--paginate:true;--theme:m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i;" data-marpit-pagination-total="80">
<h2 id="the-verdict">The verdict</h2>
<hr />
<div class="cols">
<div>
<ul>
<li data-marpit-fragment="1">Degrees: <strong>three, three, five, three</strong></li>
<li data-marpit-fragment="2">All four <strong>odd</strong></li>
<li data-marpit-fragment="3">A walk <strong>that crosses every bridge exactly once</strong> allows at most two odd nodes</li>
<li data-marpit-fragment="4"><strong>Impossible.</strong></li>
</ul>
</div>
<div class="fig">
<p><img src="figures/konigsberg-degrees.png" alt="" style="width:520px;" /></p>
<figcaption>now labelled — red marks odd degree</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-theme="m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i" lang="en-US" data-marpit-pagination="24" style="--paginate:true;--theme:m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i;" data-marpit-pagination-total="80">
<h2 id="eulerian-path">Eulerian path</h2>
<hr />
<div class="cols">
<div>
<p>An <strong>Eulerian path</strong> uses every edge exactly once. On a graph you can get around, one exists exactly when <strong>0 or 2</strong> nodes have odd degree.</p>
<div class="note">
<p>We've shown only that more than two odd nodes breaks it. That the condition is also <em>enough</em> — a path always exists whenever it holds — we use without proving.</p>
</div>
</div>
<div class="fig">
<p><img src="figures/euler-path-example.png" alt="" style="width:520px;" /></p>
<figcaption>two odd nodes: start and end</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-theme="m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i" lang="en-US" data-marpit-pagination="25" style="--paginate:true;--theme:m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i;" data-marpit-pagination-total="80">
<h2 id="what-if-you-must-return-to-where-you-started">What if you must return to where you started?</h2>
<hr />
<div class="formula">
<p>Add one requirement: the walk must end back where it began. What happens to the “exactly two odd” case?</p>
</div>
<p><em>30 seconds.</em></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-marpit-fragments="2" data-paginate="true" data-theme="m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i" lang="en-US" data-marpit-pagination="26" style="--paginate:true;--theme:m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i;" data-marpit-pagination-total="80">
<h2 id="eulerian-circuit">Eulerian circuit</h2>
<hr />
<div class="cols">
<div>
<p>Ending back where you began removes the ends — no start, no finish, just one loop. There’s no node left over to absorb a leftover edge.</p>
<ul>
<li data-marpit-fragment="1">The “exactly two odd” case disappears. For an <strong>Eulerian circuit</strong>, every node must be even.</li>
<li data-marpit-fragment="2">Königsberg fails either way — four odd nodes is neither 0 nor 2.</li>
</ul>
</div>
<div class="fig">
<p><img src="figures/euler-circuit-example.png" alt="" style="width:520px;" /></p>
<figcaption>cross all six edges, end where you began</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-theme="m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i" lang="en-US" data-marpit-pagination="27" style="--paginate:true;--theme:m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i;" data-marpit-pagination-total="80">
<h2 id="which-two-bridges-would-you-destroy">Which two bridges would you destroy?</h2>
<hr />
<div class="cols">
<div>
<p>You want to make the walk possible. Which two bridges do you remove?</p>
<p><em>Turn to your neighbor — 30 seconds.</em></p>
</div>
<div class="fig">
<p><img src="figures/konigsberg-degrees.png" alt="" style="width:520px;" /></p>
<figcaption>work from the degrees</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-marpit-fragments="2" data-paginate="true" data-theme="m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i" lang="en-US" data-marpit-pagination="28" style="--paginate:true;--theme:m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i;" data-marpit-pagination-total="80">
<h2 id="a-tragic-epilogue">A tragic epilogue</h2>
<hr />
<div class="cols">
<div>
<p>World War II. Königsberg is bombed and two bridges are destroyed.</p>
<ul>
<li data-marpit-fragment="1">Five bridges remain. Only <strong>two</strong> landmasses are left odd.</li>
<li data-marpit-fragment="2">The 200-year impossible walk becomes possible — by accident of war.</li>
</ul>
</div>
<div class="fig">
<p><img src="figures/konigsberg-bombed.png" alt="" style="width:520px;" /></p>
<figcaption>two odd → now possible</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-class="part" data-theme="m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i" lang="en-US" class="part" data-marpit-pagination="29" style="--paginate:true;--class:part;--theme:m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i;" data-marpit-pagination-total="80"><div class="band"><span>Part Four</span><span class="count">04 / 08</span></div>
<h2 id="vocabulary">Vocabulary</h2>
<p>Name the journeys precisely</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-theme="m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i" lang="en-US" data-marpit-pagination="30" style="--paginate:true;--theme:m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i;" data-marpit-pagination-total="80">
<h2 id="walk">Walk</h2>
<hr />
<div class="cols">
<div>
<p>A <strong>walk</strong> is any route through the graph. Nodes may repeat. Edges may repeat. Nothing is off-limits.</p>
</div>
<div class="fig">
<p><img src="figures/campus-walk.png" alt="" style="width:520px;" /></p>
<figcaption>the route: Dorm → Cafe → Gym → Cafe → Lib</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-theme="m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i" lang="en-US" data-marpit-pagination="31" style="--paginate:true;--theme:m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i;" data-marpit-pagination-total="80">
<h2 id="trail">Trail</h2>
<hr />
<div class="cols">
<div>
<p>A <strong>trail</strong> is a walk that never uses the same edge twice.</p>
<p>The <em>node</em> may still repeat — you can pass through the same corner without walking the same street again.</p>
</div>
<div class="fig">
<p><img src="figures/campus-trail.png" alt="" style="width:520px;" /></p>
<figcaption>the route: Lib → Gym → Dorm → Cafe → Gym</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-marpit-fragments="2" data-paginate="true" data-theme="m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i" lang="en-US" data-marpit-pagination="32" style="--paginate:true;--theme:m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i;" data-marpit-pagination-total="80">
<h2 id="path">Path</h2>
<hr />
<div class="cols">
<div>
<p>A <strong>path</strong> is a walk that never uses the same node twice — and so never the same edge either.</p>
<div class="note">
<ul>
<li data-marpit-fragment="1">Every path is a trail. Not every trail is a path.</li>
<li data-marpit-fragment="2">That's also why the <strong>Eulerian path</strong> from earlier — which revisits nodes — is really an Eulerian <em>trail</em>. The name predates this vocabulary; it stuck anyway.</li>
</ul>
</div>
</div>
<div class="fig">
<p><img src="figures/campus-path.png" alt="" style="width:520px;" /></p>
<figcaption>the route: Lib → Cafe → Dorm → Gym</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-theme="m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i" lang="en-US" data-marpit-pagination="33" style="--paginate:true;--theme:m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i;" data-marpit-pagination-total="80">
<h2 id="your-turn-find-a-trail-that-is-not-a-path">Your turn: find a trail that is not a path</h2>
<hr />
<div class="cols">
<div>
<p>Trace one on the campus graph.</p>
<p>Hands up when you have it.</p>
</div>
<div class="fig">
<p><img src="figures/campus-base.png" alt="" style="width:520px;" /></p>
<figcaption>no arrows this time — you pick the direction</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-theme="m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i" lang="en-US" data-marpit-pagination="34" style="--paginate:true;--theme:m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i;" data-marpit-pagination-total="80">
<h2 id="circuit">Circuit</h2>
<hr />
<div class="cols">
<div>
<p>A <strong>circuit</strong> is a closed trail — back to the start, no edge repeated.</p>
</div>
<div class="fig">
<p><img src="figures/circuit.png" alt="" style="width:520px;" /></p>
<figcaption>a node may be revisited; an edge may not</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-theme="m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i" lang="en-US" data-marpit-pagination="35" style="--paginate:true;--theme:m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i;" data-marpit-pagination-total="80">
<h2 id="cycle">Cycle</h2>
<hr />
<div class="cols">
<div>
<p>A <strong>cycle</strong> is a closed path — back to the start, no node repeated.</p>
</div>
<div class="fig">
<p><img src="figures/cycle.png" alt="" style="width:520px;" /></p>
<figcaption>stricter than a walk or a trail — nothing repeats (red: the cycle traced)</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-theme="m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i" lang="en-US" data-marpit-pagination="36" style="--paginate:true;--theme:m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i;" data-marpit-pagination-total="80">
<h2 id="your-turn-one-trail-both-triangles">Your turn: one trail, both triangles</h2>
<hr />
<div class="cols">
<div>
<p>Six edges, two triangles, not touching. Trace one trail — no edge repeated — that covers every edge at right.</p>
<p><em>30 seconds — try it. Hands up: possible, or impossible?</em></p>
</div>
<div class="fig">
<p><img src="figures/edge-disconnected.png" alt="" style="width:520px;" /></p>
<figcaption>two triangles, no edge between them</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-class="part" data-theme="m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i" lang="en-US" class="part" data-marpit-pagination="37" style="--paginate:true;--class:part;--theme:m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i;" data-marpit-pagination-total="80"><div class="band"><span>Part Five</span><span class="count">05 / 08</span></div>
<h2 id="connectivity">Connectivity</h2>
<p>Euler’s theorem quietly assumed you can get everywhere</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-marpit-fragments="2" data-paginate="true" data-theme="m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i" lang="en-US" data-marpit-pagination="38" style="--paginate:true;--theme:m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i;" data-marpit-pagination-total="80">
<h2 id="can-you-get-from-any-node-to-any-other">Can you get from any node to any other?</h2>
<hr />
<ul>
<li data-marpit-fragment="1">A graph is <strong>connected</strong> when a path exists between every pair of nodes — every reachability argument since Euler has been quietly assuming this.</li>
<li data-marpit-fragment="2">The two-triangle graph from a moment ago already failed this test — no trail could cross between them. The graph below fails it too, for a different reason.</li>
</ul>
<div class="fig tight">
<p><img src="figures/connected-vs-not.png" alt="" style="width:760px;" /></p>
<figcaption>one missing edge splits five nodes into two pieces</figcaption>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-marpit-fragments="2" data-paginate="true" data-theme="m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i" lang="en-US" data-marpit-pagination="39" style="--paginate:true;--theme:m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i;" data-marpit-pagination-total="80">
<h2 id="components">Components</h2>
<hr />
<ul>
<li data-marpit-fragment="1">When the answer is no, the graph splits into <strong>connected components</strong> — maximal sets of mutually reachable nodes.</li>
<li data-marpit-fragment="2">A single isolated node counts too — a component of one, with nowhere to go.</li>
</ul>
<div class="fig">
<p><img src="figures/components-band.png" alt="" style="width:760px;" /></p>
<figcaption>three components, no edge crosses between them</figcaption>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-marpit-fragments="3" data-paginate="true" data-theme="m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i" lang="en-US" data-marpit-pagination="40" style="--paginate:true;--theme:m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i;" data-marpit-pagination-total="80">
<h2 id="your-turn-run-the-sweep">Your turn: run the sweep</h2>
<hr />
<ul>
<li data-marpit-fragment="1">Pick an unvisited node and mark it.</li>
<li data-marpit-fragment="2">Visit its unvisited neighbors, and theirs, until you get stuck.</li>
<li data-marpit-fragment="3">Everything you touched is one component — if nodes remain, start again.</li>
</ul>
<div class="fig tight">
<p><img src="figures/components-bare.png" alt="" style="width:760px;" /></p>
<figcaption>trace it yourself — how many sweeps in all?</figcaption>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-marpit-fragments="3" data-paginate="true" data-theme="m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i" lang="en-US" data-marpit-pagination="41" style="--paginate:true;--theme:m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i;" data-marpit-pagination-total="80">
<h2 id="three-sweeps-three-components">Three sweeps, three components</h2>
<hr />
<ul>
<li data-marpit-fragment="1">Sweep 1 clears the eight-node ladder.</li>
<li data-marpit-fragment="2">Sweep 2 clears the triangle.</li>
<li data-marpit-fragment="3">Sweep 3 finds the lone node.</li>
</ul>
<div class="fig tight">
<p><img src="figures/sweep-3.png" alt="" style="width:760px;" /></p>
<figcaption>dashed boxes mark each swept component — numbering restarts at 1</figcaption>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-theme="m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i" lang="en-US" data-marpit-pagination="42" style="--paginate:true;--theme:m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i;" data-marpit-pagination-total="80">
<h2 id="a-component-has-1000-nodes-is-it-giant">A component has 1,000 nodes. Is it giant?</h2>
<hr />
<p>You find a component with exactly 1,000 nodes inside it.</p>
<div class="formula">
<p>Giant, or not? What would you need to know before you could answer?</p>
</div>
<p><em>Take 30 seconds.</em></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-marpit-fragments="2" data-paginate="true" data-theme="m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i" lang="en-US" data-marpit-pagination="43" style="--paginate:true;--theme:m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i;" data-marpit-pagination-total="80">
<h2 id="the-giant-component">The giant component</h2>
<hr />
<div class="cols">
<div>
<p>It depends on <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>N</mi></mrow><annotation encoding="application/x-tex">N</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.109em;">N</span></span></span></span>. The same 1,000 nodes are giant in a network of 1,200 — and negligible in one of ten million.</p>
<ul>
<li data-marpit-fragment="1">A component is <strong>giant</strong> when it holds a <strong>finite fraction</strong> of all nodes as <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>N</mi></mrow><annotation encoding="application/x-tex">N</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.109em;">N</span></span></span></span> grows.</li>
<li data-marpit-fragment="2">In practice we extract the giant component and work there — <em>whether</em> one exists at all is Module 3's question.</li>
</ul>
</div>
<div class="fig">
<p><img src="figures/giant-scale.png" alt="" style="width:520px;" /></p>
<figcaption>83% of the network on the left, 0.01% on the right</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-class="part" data-theme="m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i" lang="en-US" class="part" data-marpit-pagination="44" style="--paginate:true;--class:part;--theme:m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i;" data-marpit-pagination-total="80"><div class="band"><span>Part Six</span><span class="count">06 / 08</span></div>
<h2 id="direction">Direction</h2>
<p>Point every edge one way — degree, Euler's condition, and connectivity all split in two</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-paginate="true" data-theme="m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i" lang="en-US" data-marpit-pagination="45" style="--paginate:true;--theme:m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i;" data-marpit-pagination-total="80">
<h2 id="edges-with-direction">Edges with direction</h2>
<hr />
<div class="cols">
<div>
<p>In a <strong>directed</strong> graph, each edge has an orientation. Reachability need not run both ways — you can get from A to B without any way back.</p>
</div>
<div class="fig">
<p><img src="figures/directed-arrows.png" alt="" style="width:520px;" /></p>
<figcaption>C receives from both A and B; nothing leaves C</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-paginate="true" data-theme="m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i" lang="en-US" data-marpit-pagination="46" style="--paginate:true;--theme:m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i;" data-marpit-pagination-total="80">
<h2 id="what-breaks-when-edges-have-direction">What breaks when edges have direction?</h2>
<hr />
<p><strong>Degree</strong> has counted edges at a node so far without asking which way they point.</p>
<div class="formula">
<p>Once edges have direction, degree splits — into what?</p>
</div>
<p><em>30 seconds.</em></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-paginate="true" data-theme="m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i" lang="en-US" data-marpit-pagination="47" style="--paginate:true;--theme:m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i;" data-marpit-pagination-total="80">
<h2 id="in-degree-and-out-degree">In-degree and out-degree</h2>
<hr />
<div class="cols">
<div>
<p>Each node now has two counts: <strong>in-degree</strong>, edges arriving, and <strong>out-degree</strong>, edges leaving.</p>
</div>
<div class="fig">
<p><img src="figures/directed-indegree.png" alt="" style="width:520px;" /></p>
<figcaption>A→B→C→A — each arrow both leaves and arrives once</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" data-paginate="true" data-theme="m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i" lang="en-US" data-marpit-pagination="48" style="--paginate:true;--theme:m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i;" data-marpit-pagination-total="80">
<h2 id="strongly-connected">Strongly connected</h2>
<hr />
<div class="cols">
<div>
<p>A directed path from every node to every other node — direction respected the whole way.</p>
</div>
<div class="fig">
<p><img src="figures/directed-strong.png" alt="" style="width:520px;" /></p>
<figcaption>A→B→C→A: one loop reaches every node from every node</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" data-paginate="true" data-theme="m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i" lang="en-US" data-marpit-pagination="49" style="--paginate:true;--theme:m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i;" data-marpit-pagination-total="80">
<h2 id="weakly-connected">Weakly connected</h2>
<hr />
<div class="cols">
<div>
<p>Connected once you ignore direction. A weaker requirement — every strongly connected graph is weakly connected, but the converse fails.</p>
<div class="note">
<p>One-way streets get you out, not necessarily back.</p>
</div>
</div>
<div class="fig">
<p><img src="figures/directed-weak.png" alt="" style="width:520px;" /></p>
<figcaption>no directed route returns to A</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="50" data-paginate="true" data-theme="m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i" lang="en-US" data-marpit-pagination="50" style="--paginate:true;--theme:m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i;" data-marpit-pagination-total="80">
<h2 id="what-replaces-odd-once-edges-point">What replaces &quot;odd&quot; once edges point?</h2>
<hr />
<div class="formula">
<p>Königsberg's rule was about odd degrees. What plays that role once edges carry direction?</p>
</div>
<p><em>30 seconds.</em></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="51" data-marpit-fragments="3" data-paginate="true" data-theme="m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i" lang="en-US" data-marpit-pagination="51" style="--paginate:true;--theme:m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i;" data-marpit-pagination-total="80">
<h2 id="total-degree-is-the-wrong-quantity">Total degree is the wrong quantity</h2>
<hr />
<div class="cols">
<div>
<p>The undirected rule counted total degree. Try the same idea here: add in-degree and out-degree, check for even.</p>
<ul>
<li data-marpit-fragment="1">A: in 0, out 2 → total 2, &quot;even.&quot;</li>
<li data-marpit-fragment="2">B: in 2, out 0 → total 2, &quot;even.&quot;</li>
<li data-marpit-fragment="3">Both pass that test — yet nothing ever enters A, and nothing ever leaves B.</li>
</ul>
<div class="note">
<p>Total degree hides direction. What has to balance is in and out, separately, at every node.</p>
</div>
</div>
<div class="fig">
<p><img src="figures/directed-parity-counterexample.png" alt="" style="width:520px;" /></p>
<figcaption>A: in 0, out 2 — B: in 2, out 0 — both "even," neither balanced</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="52" data-marpit-fragments="2" data-paginate="true" data-theme="m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i" lang="en-US" data-marpit-pagination="52" style="--paginate:true;--theme:m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i;" data-marpit-pagination-total="80">
<h2 id="the-directed-euler-condition">The directed Euler condition</h2>
<hr />
<div class="cols">
<div>
<p>Euler's condition splits into two cases by how in-degree and out-degree balance at every node — not by their sum.</p>
<ul>
<li data-marpit-fragment="1"><strong>Closed tour:</strong> connected once you ignore direction, and in-degree equals out-degree at every node.</li>
<li data-marpit-fragment="2"><strong>Trail:</strong> connected once you ignore direction, and exactly one node has out − in = 1 (the start), one has in − out = 1 (the end), every other node balances.</li>
</ul>
</div>
<div class="fig">
<p><img src="figures/directed-strong.png" alt="" style="width:520px;" /></p>
<figcaption>A→B→C→A: in = out = 1 at every node — a closed tour</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="53" data-paginate="true" data-theme="m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i" lang="en-US" data-marpit-pagination="53" style="--paginate:true;--theme:m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i;" data-marpit-pagination-total="80">
<h2 id="your-turn-does-a-closed-tour-survive">Your turn: does a closed tour survive?</h2>
<hr />
<div class="cols">
<div>
<p>Add one more arc to this triangle — anywhere to anywhere, your choice.</p>
<p>Does the closed tour still exist? Does a trail?</p>
<p><em>Turn to your neighbor — 30 seconds.</em></p>
</div>
<div class="fig">
<p><img src="figures/directed-strong.png" alt="" style="width:520px;" /></p>
<figcaption>A→B→C→A — add one arc and re-check</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="54" data-paginate="true" data-class="part" data-theme="m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i" lang="en-US" class="part" data-marpit-pagination="54" style="--paginate:true;--class:part;--theme:m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i;" data-marpit-pagination-total="80"><div class="band"><span>Part Seven</span><span class="count">07 / 08</span></div>
<h2 id="representation">Representation</h2>
<p>How you store a network shapes what you can ask it</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="55" data-paginate="true" data-theme="m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i" lang="en-US" data-marpit-pagination="55" style="--paginate:true;--theme:m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i;" data-marpit-pagination-total="80">
<h2 id="how-would-you-store-a-network">How would you store a network?</h2>
<hr />
<p>You have a million nodes, and you need to answer <em>who are node 7's neighbors?</em> — a billion times.</p>
<div class="formula">
<p>How would you lay this out in memory?</p>
</div>
<p><em>30 seconds with your neighbor.</em></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="56" data-paginate="true" data-theme="m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i" lang="en-US" data-marpit-pagination="56" style="--paginate:true;--theme:m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i;" data-marpit-pagination-total="80">
<h2 id="edge-list">Edge list</h2>
<hr />
<div class="cols">
<div>
<p>The simplest option: a list of pairs, one per edge. Compact on disk — but finding node 1's neighbors (highlighted) means scanning every pair, since edges aren't grouped by node.</p>
</div>
<div class="fig">
<p><img src="figures/store-edgelist.png" alt="" style="width:520px;" /></p>
<figcaption>node 1's edges: rows 0, 2, 3</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="57" data-paginate="true" data-theme="m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i" lang="en-US" data-marpit-pagination="57" style="--paginate:true;--theme:m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i;" data-marpit-pagination-total="80">
<h2 id="adjacency-list">Adjacency list</h2>
<hr />
<div class="cols">
<div>
<p>Store each node's neighbors directly. Node 1's neighbors are node 1's row — no scanning, the answer is immediate.</p>
</div>
<div class="fig">
<p><img src="figures/store-adjlist.png" alt="" style="width:520px;" /></p>
<figcaption>same three neighbors as the edge list, now sitting together</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="58" data-paginate="true" data-theme="m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i" lang="en-US" data-marpit-pagination="58" style="--paginate:true;--theme:m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i;" data-marpit-pagination-total="80">
<h2 id="adjacency-matrix">Adjacency matrix</h2>
<hr />
<div class="cols">
<div>
<p><span class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>A</mi><mrow><mi>i</mi><mi>j</mi></mrow></msub><mo>=</mo><mrow><mo fence="true">{</mo><mtable rowspacing="0.36em" columnalign="left left" columnspacing="1em"><mtr><mtd><mstyle scriptlevel="0" displaystyle="false"><mn>1</mn></mstyle></mtd><mtd><mstyle scriptlevel="0" displaystyle="false"><mrow><mi>i</mi><mo>∼</mo><mi>j</mi></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle scriptlevel="0" displaystyle="false"><mn>0</mn></mstyle></mtd><mtd><mstyle scriptlevel="0" displaystyle="false"><mtext>otherwise</mtext></mstyle></mtd></mtr></mtable></mrow></mrow><annotation encoding="application/x-tex">A_{ij} =
\begin{cases}
1 &amp; i \sim j \\
0 &amp; \text{otherwise}
\end{cases}
</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.9694em;vertical-align:-0.2861em;"></span><span class="mord"><span class="mord mathnormal">A</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3117em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight" style="margin-right:0.0572em;">ij</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.2861em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:3em;vertical-align:-1.25em;"></span><span class="minner"><span class="mopen delimcenter" style="top:0em;"><span class="delimsizing size4">{</span></span><span class="mord"><span class="mtable"><span class="col-align-l"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:1.69em;"><span style="top:-3.69em;"><span class="pstrut" style="height:3.008em;"></span><span class="mord"><span class="mord">1</span></span></span><span style="top:-2.25em;"><span class="pstrut" style="height:3.008em;"></span><span class="mord"><span class="mord">0</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:1.19em;"><span></span></span></span></span></span><span class="arraycolsep" style="width:1em;"></span><span class="col-align-l"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:1.69em;"><span style="top:-3.69em;"><span class="pstrut" style="height:3.008em;"></span><span class="mord"><span class="mord mathnormal">i</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">∼</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mord mathnormal" style="margin-right:0.0572em;">j</span></span></span><span style="top:-2.25em;"><span class="pstrut" style="height:3.008em;"></span><span class="mord"><span class="mord text"><span class="mord">otherwise</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:1.19em;"><span></span></span></span></span></span></span></span><span class="mclose nulldelimiter"></span></span></span></span></span></span></p><p>An <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>n</mi><mo>×</mo><mi>n</mi></mrow><annotation encoding="application/x-tex">n \times n</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6667em;vertical-align:-0.0833em;"></span><span class="mord mathnormal">n</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">×</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal">n</span></span></span></span> grid of 0s and 1s. This opens the door to linear algebra — but storing it costs <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>O</mi><mo stretchy="false">(</mo><msup><mi>n</mi><mn>2</mn></msup><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">O(n^2)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1.0641em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.0278em;">O</span><span class="mopen">(</span><span class="mord"><span class="mord mathnormal">n</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8141em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">2</span></span></span></span></span></span></span></span><span class="mclose">)</span></span></span></span>, even when almost every entry is 0.</p>
</div>
<div class="fig">
<p><img src="figures/store-matrix.png" alt="" style="width:520px;" /></p>
<figcaption>row 1 (red): 1s at columns 0, 2, 3 — node 1's three neighbors</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="59" data-paginate="true" data-theme="m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i" lang="en-US" data-marpit-pagination="59" style="--paginate:true;--theme:m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i;" data-marpit-pagination-total="80">
<h2 id="degree-three-ways--the-edge-list">Degree, three ways — the edge list</h2>
<hr />
<div class="cols">
<div>
<p>The same quantity holds in every representation. In the edge list, count the rows that mention node 1.</p>
</div>
<div class="fig">
<p><img src="figures/store-edgelist.png" alt="" style="width:520px;" /></p>
<figcaption>three rows mention node 1 — degree 3</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="60" data-paginate="true" data-theme="m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i" lang="en-US" data-marpit-pagination="60" style="--paginate:true;--theme:m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i;" data-marpit-pagination-total="80">
<h2 id="degree-three-ways--the-adjacency-list">Degree, three ways — the adjacency list</h2>
<hr />
<div class="cols">
<div>
<p>The adjacency list needs no counting at all — a row's length is the degree.</p>
</div>
<div class="fig">
<p><img src="figures/store-adjlist.png" alt="" style="width:520px;" /></p>
<figcaption>node 1's row lists three neighbors — degree 3</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="61" data-paginate="true" data-theme="m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i" lang="en-US" data-marpit-pagination="61" style="--paginate:true;--theme:m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i;" data-marpit-pagination-total="80">
<h2 id="degree-three-ways--the-matrix">Degree, three ways — the matrix</h2>
<hr />
<div class="cols">
<div>
<p>And the matrix agrees a third way: sum a row.</p>
</div>
<div class="fig">
<p><img src="figures/store-matrix.png" alt="" style="width:520px;" /></p>
<figcaption>row 1 sums to 3 — same degree as the edge list and adjacency list</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="62" data-paginate="true" data-theme="m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i" lang="en-US" data-marpit-pagination="62" style="--paginate:true;--theme:m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i;" data-marpit-pagination-total="80">
<h2 id="for-a-multigraph-count-the-edges">For a multigraph, count the edges</h2>
<hr />
<div class="cols">
<div>
<p>Two bridges between the same pair? The matrix entry isn't capped at 1 — <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>A</mi><mrow><mi>i</mi><mi>j</mi></mrow></msub></mrow><annotation encoding="application/x-tex">A_{ij}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.9694em;vertical-align:-0.2861em;"></span><span class="mord"><span class="mord mathnormal">A</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3117em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight" style="margin-right:0.0572em;">ij</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.2861em;"><span></span></span></span></span></span></span></span></span></span> becomes the <strong>number</strong> of edges between <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>i</mi></mrow><annotation encoding="application/x-tex">i</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6595em;"></span><span class="mord mathnormal">i</span></span></span></span> and <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>j</mi></mrow><annotation encoding="application/x-tex">j</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.854em;vertical-align:-0.1944em;"></span><span class="mord mathnormal" style="margin-right:0.0572em;">j</span></span></span></span>.</p>
</div>
<div class="fig">
<p><img src="figures/multigraph.png" alt="" style="width:520px;" /></p>
<figcaption>two N–A bridges → the entry is 2, not 1</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="63" data-paginate="true" data-theme="m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i" lang="en-US" data-marpit-pagination="63" style="--paginate:true;--theme:m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i;" data-marpit-pagination-total="80">
<h2 id="multiply-by-itself-what-do-the-entries-mean">Multiply <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>A</mi></mrow><annotation encoding="application/x-tex">A</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal">A</span></span></span></span> by itself. What do the entries mean?</h2>
<hr />
<div class="formula">
<p><span class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msup><mi mathvariant="bold">A</mi><mn>2</mn></msup></mrow><annotation encoding="application/x-tex">\mathbf{A}^2 
</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8641em;"></span><span class="mord"><span class="mord mathbf">A</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8641em;"><span style="top:-3.113em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">2</span></span></span></span></span></span></span></span></span></span></span></span></p><p>What does entry <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo stretchy="false">(</mo><mi>i</mi><mo separator="true">,</mo><mi>j</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">(i,j)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">(</span><span class="mord mathnormal">i</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal" style="margin-right:0.0572em;">j</span><span class="mclose">)</span></span></span></span> count?</p>
</div>
<p><em>30 seconds — try it on the five-node graph from a couple of slides back, the one whose matrix appeared on-screen.</em></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="64" data-paginate="true" data-theme="m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i" lang="en-US" data-marpit-pagination="64" style="--paginate:true;--theme:m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i;" data-marpit-pagination-total="80">
<h2 id="counts-walks"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msup><mi>A</mi><mi>k</mi></msup></mrow><annotation encoding="application/x-tex">A^k</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8491em;"></span><span class="mord"><span class="mord mathnormal">A</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8491em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight" style="margin-right:0.0315em;">k</span></span></span></span></span></span></span></span></span></span></span> counts walks</h2>
<hr />
<div class="cols">
<div>
<div class="formula">
<p><span class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mo stretchy="false">(</mo><msup><mi mathvariant="bold">A</mi><mi>k</mi></msup><msub><mo stretchy="false">)</mo><mrow><mi>i</mi><mi>j</mi></mrow></msub><mo>=</mo><mi mathvariant="normal">#</mi><mo stretchy="false">{</mo><mtext>walks of length </mtext><mi>k</mi><mtext> from </mtext><mi>i</mi><mtext> to </mtext><mi>j</mi><mo stretchy="false">}</mo></mrow><annotation encoding="application/x-tex">(\mathbf{A}^k)_{ij} = \#\{\text{walks of length } k \text{ from } i \text{ to } j\} 
</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1.1852em;vertical-align:-0.2861em;"></span><span class="mopen">(</span><span class="mord"><span class="mord mathbf">A</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8991em;"><span style="top:-3.113em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight" style="margin-right:0.0315em;">k</span></span></span></span></span></span></span></span><span class="mclose"><span class="mclose">)</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3117em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight" style="margin-right:0.0572em;">ij</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.2861em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord">#</span><span class="mopen">{</span><span class="mord text"><span class="mord">walks of length </span></span><span class="mord mathnormal" style="margin-right:0.0315em;">k</span><span class="mord text"><span class="mord"> from </span></span><span class="mord mathnormal">i</span><span class="mord text"><span class="mord"> to </span></span><span class="mord mathnormal" style="margin-right:0.0572em;">j</span><span class="mclose">}</span></span></span></span></span></p></div>
<div class="note">
<p>Walks, not paths — repetition is allowed. Later modules reuse this for clustering and centrality.</p>
</div>
</div>
<div class="fig">
<p><img src="figures/adjacency-squared.png" alt="" style="width:520px;" /></p>
<figcaption>red route 1–2–4, gold route 1–3–4 — both land in cell (1,4)</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="65" data-paginate="true" data-theme="m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i" lang="en-US" data-marpit-pagination="65" style="--paginate:true;--theme:m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i;" data-marpit-pagination-total="80">
<h2 id="a-dense-matrix-for-eight-billion-people--how-much-memory">A dense matrix for eight billion people — how much memory?</h2>
<hr />
<p>Every human on Earth is a node. Store the full <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>n</mi><mo>×</mo><mi>n</mi></mrow><annotation encoding="application/x-tex">n \times n</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6667em;vertical-align:-0.0833em;"></span><span class="mord mathnormal">n</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">×</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal">n</span></span></span></span> adjacency matrix, dense, one byte per entry.</p>
<div class="formula">
<p>Guess before you compute — kilobytes? Gigabytes? More?</p>
</div>
<p><em>30 seconds.</em></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="66" data-paginate="true" data-theme="m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i" lang="en-US" data-marpit-pagination="66" style="--paginate:true;--theme:m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i;" data-marpit-pagination-total="80">
<h2 id="64-exabytes">64 exabytes</h2>
<hr />
<div class="formula">
<p><span class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>n</mi><mo>=</mo><mn>8</mn><mo>×</mo><msup><mn>10</mn><mn>9</mn></msup><mspace width="2em"/><msup><mi>n</mi><mn>2</mn></msup><mo>×</mo><mn>1</mn><mtext> byte</mtext><mo>=</mo><mn>6.4</mn><mo>×</mo><msup><mn>10</mn><mn>19</mn></msup><mtext> bytes</mtext><mo>≈</mo><mn>64</mn><mtext> EB</mtext></mrow><annotation encoding="application/x-tex">n = 8\times10^{9} \qquad n^2 \times 1\text{ byte} = 6.4\times10^{19}\text{ bytes} \approx 64\text{ EB} 
</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal">n</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.7278em;vertical-align:-0.0833em;"></span><span class="mord">8</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">×</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.9474em;vertical-align:-0.0833em;"></span><span class="mord">1</span><span class="mord"><span class="mord">0</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8641em;"><span style="top:-3.113em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">9</span></span></span></span></span></span></span></span></span><span class="mspace" style="margin-right:2em;"></span><span class="mord"><span class="mord mathnormal">n</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8641em;"><span style="top:-3.113em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">2</span></span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">×</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.8889em;vertical-align:-0.1944em;"></span><span class="mord">1</span><span class="mord text"><span class="mord"> byte</span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.7278em;vertical-align:-0.0833em;"></span><span class="mord">6.4</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">×</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:1.0585em;vertical-align:-0.1944em;"></span><span class="mord">1</span><span class="mord"><span class="mord">0</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8641em;"><span style="top:-3.113em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">19</span></span></span></span></span></span></span></span></span><span class="mord text"><span class="mord"> bytes</span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">≈</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord">64</span><span class="mord text"><span class="mord"> EB</span></span></span></span></span></span></p></div>
<p>Eight billion nodes, one byte per pair — more raw storage than most data centers on Earth hold, just to record who is <em>not</em> connected to whom.</p>
<div class="note">
<p>Almost every entry in that grid is a wasted zero. That waste is exactly what a sparse format refuses to store.</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="67" data-marpit-fragments="3" data-paginate="true" data-theme="m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i" lang="en-US" data-marpit-pagination="67" style="--paginate:true;--theme:m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i;" data-marpit-pagination-total="80">
<h2 id="store-only-the-nonzeros">Store only the nonzeros</h2>
<hr />
<div class="cols">
<div>
<p>Most pairs of people are not linked, so store only what is actually there. The <strong>Compressed Sparse Row (CSR)</strong> format keeps three arrays:</p>
<ul>
<li data-marpit-fragment="1"><strong>data</strong> — the values</li>
<li data-marpit-fragment="2"><strong>indices</strong> — the column of each nonzero</li>
<li data-marpit-fragment="3"><strong>indptr</strong> — where each row starts</li>
</ul>
<p>One matrix row is one contiguous slice of <strong>data</strong> and <strong>indices</strong> — that is the whole trick.</p>
</div>
<div class="fig">
<p><img src="figures/csr-build.png" alt="" style="width:520px;" /></p>
<figcaption>row 1: indptr 2→5 marks the slice — indices 0, 2, 3</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="68" data-paginate="true" data-theme="m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i" lang="en-US" data-marpit-pagination="68" style="--paginate:true;--theme:m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i;" data-marpit-pagination-total="80">
<h2 id="the-payoff-degree">The payoff: degree</h2>
<hr />
<div class="cols">
<div>
<p>Degree falls straight out of <strong>indptr</strong> — no scan required:</p>
<div class="formula">
<p><span class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>k</mi><mi>i</mi></msub><mo>=</mo><mrow><mi mathvariant="normal">i</mi><mi mathvariant="normal">n</mi><mi mathvariant="normal">d</mi><mi mathvariant="normal">p</mi><mi mathvariant="normal">t</mi><mi mathvariant="normal">r</mi></mrow><mo stretchy="false">[</mo><mi>i</mi><mo>+</mo><mn>1</mn><mo stretchy="false">]</mo><mo>−</mo><mrow><mi mathvariant="normal">i</mi><mi mathvariant="normal">n</mi><mi mathvariant="normal">d</mi><mi mathvariant="normal">p</mi><mi mathvariant="normal">t</mi><mi mathvariant="normal">r</mi></mrow><mo stretchy="false">[</mo><mi>i</mi><mo stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">k_i = \mathrm{indptr}[i+1]-\mathrm{indptr}[i]
