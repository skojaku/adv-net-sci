</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8444em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0315em;">k</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3117em;"><span style="top:-2.55em;margin-left:-0.0315em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">i</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord"><span class="mord mathrm">indptr</span></span><span class="mopen">[</span><span class="mord mathnormal">i</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord">1</span><span class="mclose">]</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">−</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord"><span class="mord mathrm">indptr</span></span><span class="mopen">[</span><span class="mord mathnormal">i</span><span class="mclose">]</span></span></span></span></span></p></div>
</div>
<div class="fig">
<p><img src="figures/csr-payoff.png" alt="" style="width:520px;" /></p>
<figcaption>the dense row highlighted on the left becomes the highlighted slice on the right</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="69" data-paginate="true" data-theme="m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i" lang="en-US" data-marpit-pagination="69" style="--paginate:true;--theme:m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i;" data-marpit-pagination-total="80">
<h2 id="the-payoff-memory">The payoff: memory</h2>
<hr />
<div class="cols">
<div>
<p>The dense matrix stores 25 numbers here. CSR stores 30 — data (12) + indices (12) + indptr (6) — so at this toy size, <strong>CSR loses</strong>. The claim is about growth, not this graph: real networks are far larger and sparser, and the gap flips hard:</p>
<div class="formula">
<p><span class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>O</mi><mo stretchy="false">(</mo><msup><mi>n</mi><mn>2</mn></msup><mo stretchy="false">)</mo><mo>→</mo><mi>O</mi><mo stretchy="false">(</mo><mi>m</mi><mo>+</mo><mi>n</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">O(n^2) \rightarrow O(m+n) 
</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1.1141em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.0278em;">O</span><span class="mopen">(</span><span class="mord"><span class="mord mathnormal">n</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8641em;"><span style="top:-3.113em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">2</span></span></span></span></span></span></span></span><span class="mclose">)</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">→</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.0278em;">O</span><span class="mopen">(</span><span class="mord mathnormal">m</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal">n</span><span class="mclose">)</span></span></span></span></span></p></div>
</div>
<div class="fig">
<p><img src="figures/csr-memory.png" alt="" style="width:520px;" /></p>
<figcaption>n=100,000, average degree 6: dense 10B vs CSR 1.3M — CSR wins 7,692×</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="70" data-paginate="true" data-theme="m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i" lang="en-US" data-marpit-pagination="70" style="--paginate:true;--theme:m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i;" data-marpit-pagination-total="80">
<h2 id="which-format-when">Which format when?</h2>
<hr />
<div class="note">
<p>Rule of thumb: edge list on disk, sparse matrices for analysis.</p>
</div>
<div class="fig tight">
<p><img src="figures/format-regimes.png" alt="" style="width:760px;" /></p>
<figcaption>axes: node count vs. density</figcaption>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="71" data-paginate="true" data-class="part" data-theme="m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i" lang="en-US" class="part" data-marpit-pagination="71" style="--paginate:true;--class:part;--theme:m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i;" data-marpit-pagination-total="80"><div class="band"><span>Part Eight</span><span class="count">08 / 08</span></div>
<h2 id="edge-cases">Edge cases</h2>
<p>The graphs that break the rules</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="72" data-paginate="true" data-theme="m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i" lang="en-US" data-marpit-pagination="72" style="--paginate:true;--theme:m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i;" data-marpit-pagination-total="80">
<h2 id="does-a-self-loop-add-1-to-a-nodes-degree-or-2">Does a self-loop add 1 to a node's degree, or 2?</h2>
<hr />
<div class="cols">
<div>
<p>Degree is &quot;the number of edges attached to a node.&quot; A self-loop is one edge — but it touches the node at both ends.</p>
<div class="note">
<p>30 seconds: does it count once, or twice?</p>
</div>
</div>
<div class="fig">
<p><img src="figures/selfloop.png" alt="" style="width:520px;" /></p>
<figcaption>both ends attach here</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="73" data-paginate="true" data-theme="m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i" lang="en-US" data-marpit-pagination="73" style="--paginate:true;--theme:m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i;" data-marpit-pagination-total="80">
<h2 id="two">Two</h2>
<hr />
<div class="cols">
<div>
<p>Both endpoints attach at the same node, so a self-loop contributes <strong>2</strong> to its degree.</p>
<div class="note">
<p>This keeps the parity argument intact — a self-loop adds an even number, so it never changes a node's parity.</p>
</div>
</div>
<div class="fig">
<p><img src="figures/selfloop-answer.png" alt="" style="width:520px;" /></p>
<figcaption>1 and 2 mark where the loop leaves and returns</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="74" data-paginate="true" data-theme="m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i" lang="en-US" data-marpit-pagination="74" style="--paginate:true;--theme:m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i;" data-marpit-pagination-total="80">
<h2 id="is-a-single-node-with-no-edges-connected">Is a single node with no edges connected?</h2>
<hr />
<div class="cols">
<div>
<p>One node. No edges. Nothing to reach, and nothing reaching it.</p>
<div class="note">
<p>30 seconds: does &quot;a path between every pair of nodes&quot; even apply here?</p>
</div>
</div>
<div class="fig">
<p><img src="figures/edge-single-node.png" alt="" style="width:520px;" /></p>
<figcaption>the smallest possible graph — a single dot</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="75" data-paginate="true" data-theme="m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i" lang="en-US" data-marpit-pagination="75" style="--paginate:true;--theme:m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i;" data-marpit-pagination-total="80">
<h2 id="yes--vacuously">Yes — vacuously</h2>
<hr />
<div class="cols">
<div>
<p>There are no pairs of nodes to fail the test, so the condition holds by default. A lone node is a <strong>component of its own</strong>.</p>
</div>
<div class="fig">
<p><img src="figures/edge-single-node-answer.png" alt="" style="width:520px;" /></p>
<figcaption>the ring marks the component — it contains exactly one node</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="76" data-paginate="true" data-theme="m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i" lang="en-US" data-marpit-pagination="76" style="--paginate:true;--theme:m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i;" data-marpit-pagination-total="80">
<h2 id="every-node-has-even-degree-and-yet-there-is-no-euler-circuit-how">Every node has even degree, and yet there is no Euler circuit. How?</h2>
<hr />
<p>Picture a graph where every node has degree 2 — all even, Euler's parity condition satisfied in full.</p>
<div class="note">
<p>60 seconds: draw one yourself before the next slide.</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="77" data-paginate="true" data-theme="m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i" lang="en-US" data-marpit-pagination="77" style="--paginate:true;--theme:m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i;" data-marpit-pagination-total="80">
<h2 id="the-graph-is-in-two-pieces">The graph is in two pieces</h2>
<hr />
<div class="cols">
<div>
<p>Parity alone is not enough. Euler's theorem also requires <strong>connectivity</strong> — a single walk cannot jump between components, no matter how even their degrees are. This is why the sweep from Part Five is not optional.</p>
</div>
<div class="fig">
<p><img src="figures/edge-disconnected-2.png" alt="" style="width:520px;" /></p>
<figcaption>two squares, each still degree 2 — no edge between them</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="78" data-marpit-fragments="2" data-paginate="true" data-theme="m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i" lang="en-US" data-marpit-pagination="78" style="--paginate:true;--theme:m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i;" data-marpit-pagination-total="80">
<h2 id="back-to-k%C3%B6nigsberg">Back to Königsberg</h2>
<hr />
<div class="cols">
<div>
<p>Run both conditions against the seven bridges, one last time:</p>
<ul>
<li data-marpit-fragment="1"><strong>Connected?</strong> Yes — every landmass reaches every other.</li>
<li data-marpit-fragment="2"><strong>0 or 2 odd-degree nodes?</strong> No — all four are odd.</li>
</ul>
<p>One condition holds, one fails. That single failure is enough: no Eulerian circuit, and no Eulerian path either.</p>
</div>
<div class="fig">
<p><img src="figures/konigsberg-degrees.png" alt="" style="width:520px;" /></p>
<figcaption>both conditions, checked against the same graph</figcaption>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="79" data-marpit-fragments="4" data-paginate="true" data-theme="m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i" lang="en-US" data-marpit-pagination="79" style="--paginate:true;--theme:m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i;" data-marpit-pagination-total="80">
<h2 id="module-01-review">Module 01 review</h2>
<hr />
<div class="cols">
<div class="fig">
<p><img src="figures/recap.png" alt="" style="width:520px;" /></p>
<figcaption>the seven bridges, one last time</figcaption>
</div>
<div>
<ul>
<li data-marpit-fragment="1"><strong>Abstraction (1736):</strong> landmasses → nodes, bridges → edges</li>
<li data-marpit-fragment="2"><strong>Euler's theorem:</strong> connected, 0 or 2 odd-degree nodes — walk, trail, path, circuit, cycle</li>
<li data-marpit-fragment="3"><strong>Connectivity:</strong> components, the giant component, <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo stretchy="false">(</mo><msup><mi mathvariant="bold">A</mi><mi>k</mi></msup><msub><mo stretchy="false">)</mo><mrow><mi>i</mi><mi>j</mi></mrow></msub></mrow><annotation encoding="application/x-tex">(\mathbf{A}^k)_{ij}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1.1352em;vertical-align:-0.2861em;"></span><span class="mopen">(</span><span class="mord"><span class="mord mathbf">A</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8491em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight" style="margin-right:0.0315em;">k</span></span></span></span></span></span></span></span><span class="mclose"><span class="mclose">)</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3117em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight" style="margin-right:0.0572em;">ij</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.2861em;"><span></span></span></span></span></span></span></span></span></span> counts walks</li>
<li data-marpit-fragment="4"><strong>Representation:</strong> edge list, adjacency, matrix, CSR — <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>O</mi><mo stretchy="false">(</mo><msup><mi>n</mi><mn>2</mn></msup><mo stretchy="false">)</mo><mo>→</mo><mi>O</mi><mo stretchy="false">(</mo><mi>m</mi><mo>+</mo><mi>n</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">O(n^2) \rightarrow O(m+n)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1.0641em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.0278em;">O</span><span class="mopen">(</span><span class="mord"><span class="mord mathnormal">n</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8141em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">2</span></span></span></span></span></span></span></span><span class="mclose">)</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">→</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.0278em;">O</span><span class="mopen">(</span><span class="mord mathnormal">m</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal">n</span><span class="mclose">)</span></span></span></span></li>
</ul>
<div class="note">
<p>Build a CSR matrix by hand in the Module 01 notebook.</p>
</div>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="80" data-paginate="true" data-theme="m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i" lang="en-US" data-marpit-pagination="80" style="--paginate:true;--theme:m8h2o8rt9lq1u1ru1ugtmshzi8htoajap924bxshbh9i;" data-marpit-pagination-total="80">
<h2 id="coming-up-in-module-02">Coming up in Module 02</h2>
<hr />
<div class="cols">
<div>
<h3 id="small-worlds">Small worlds</h3>
<p>Almost all eight billion people are a handful of friendships away from each other.</p>
<p>Short paths. High clustering. One rewiring model that delivers both at once.</p>
</div>
<div class="fig">
<p><img src="figures/smallworld-teaser.png" alt="" style="width:520px;" /></p>
<figcaption>a few shortcuts (red) change everything</figcaption>
</div>
</div>
